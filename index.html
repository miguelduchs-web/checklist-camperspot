<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Motorhome — Camperspot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --oliva:#354C00; --oliva-osc:#26380B; --oliva-cl:#4A6A0A;
  --salvia:#95AA71; --salvia-cl:#C6D4B2; --salvia-pal:#EBF0E2;
  --fondo:#F0F3EA; --panel:#fff;
  --tinta:#1A1E12; --gris:#6E7663; --linea:#D6DCC8;
  --ambar:#E8AC1B; --ambar-osc:#C08D08;
  --ok:#46731A; --dano:#A8341F; --alerta:#9A6B10;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
}
h1,h2,h3,h4,.cond{font-family:"Barlow Condensed","Barlow Semi Condensed",system-ui,sans-serif;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 170px}

/* ---------- barra superior ---------- */
.top{background:var(--oliva);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.top-in{max-width:820px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:5px;display:block;flex:0 0 36px}
.marca{font-family:"Barlow Condensed";font-size:21px;font-weight:700;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.marca span{display:block;font-size:11px;font-weight:500;color:var(--salvia-cl);letter-spacing:.14em;font-family:"Barlow"}
.suc-sw{margin-left:auto;display:flex;background:var(--oliva-osc);border-radius:4px;overflow:hidden}
.suc-sw button{background:none;border:0;color:#BFCCAB;padding:8px 12px;font-family:"Barlow Condensed";font-size:16px;font-weight:600}
.suc-sw button[aria-pressed=true]{background:var(--salvia);color:#26380B}

/* ---------- medidor de etapas ---------- */
.rail{background:var(--oliva-osc);padding:9px 14px 11px;border-bottom:2px solid var(--salvia)}
.rail-in{max-width:820px;margin:0 auto;display:flex;gap:5px}
.gauge{flex:1;background:none;border:0;padding:0;text-align:left}
.gauge b{display:block;font-family:"Barlow Condensed";font-size:14px;font-weight:600;color:#A9BC8C;line-height:1.2}
.gauge[aria-current=true] b{color:var(--ambar)}
.gauge i{display:block;font-style:normal;font-size:11px;color:#8FA173;font-variant-numeric:tabular-nums}
.gauge .bars{display:flex;gap:2px;margin:5px 0 4px}
.gauge .bars s{flex:1;height:5px;background:#4C6317;text-decoration:none;border-radius:1px}
.gauge .bars s.on{background:var(--salvia)}
.gauge[data-full=true] .bars s.on{background:var(--salvia-cl)}

/* ---------- generico ---------- */
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);margin:12px 0}
.card>h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--linea);font-size:19px;display:flex;align-items:center;gap:8px;background:var(--salvia-pal);border-radius:var(--r) var(--r) 0 0;color:var(--oliva)}
.card>h3 em{margin-left:auto;font-style:normal;font-family:"Barlow";font-size:12px;color:var(--gris);font-variant-numeric:tabular-nums}
.pad{padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13px;color:var(--gris);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:11px 10px;border:1px solid var(--linea);border-radius:4px;background:#FBFCF8;min-height:46px
}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--oliva-cl);outline-offset:1px}
.hint{font-size:13px;color:var(--gris);margin:6px 0 0}
h2.tit{color:var(--oliva);text-transform:uppercase;letter-spacing:.03em}

/* ---------- items ---------- */
.items{list-style:none;margin:0;padding:0}
.items li{border-bottom:1px solid #EDF0E5}
.items li:last-child{border-bottom:0}
.chk{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:11px 14px;text-align:left;font-size:15.5px}
.chk .box{flex:0 0 24px;height:24px;border:2px solid #B4BD9E;border-radius:4px;position:relative}
.chk[aria-pressed=true]{background:#F1F6E9}
.chk[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed=true] .box:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}

.tri{padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tri>p{margin:0;flex:1 1 190px;font-size:15.5px}
.tri .set{display:flex;gap:4px}
.tri .set button{border:1px solid var(--linea);background:#FBFCF8;border-radius:4px;padding:8px 11px;font-family:"Barlow Condensed";font-weight:600;font-size:14px;color:var(--gris);min-width:46px}
.tri .set button[aria-pressed=true][data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.tri .set button[aria-pressed=true][data-v=dano]{background:var(--dano);border-color:var(--dano);color:#fff}
.tri textarea{margin-top:2px;flex-basis:100%;min-height:52px}
.tri .resp{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap}
.tri .tiras{flex-basis:100%;margin-top:0}
.tri .tiras:empty{display:none}

/* ---------- media ---------- */
.slot{padding:12px 14px;border-bottom:1px solid #EDF0E5}
.slot:last-child{border-bottom:0}
.slot h4{margin:0 0 2px;font-size:17px}
.slot p{margin:0 0 9px;font-size:13px;color:var(--gris)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--oliva);background:var(--oliva);color:#fff;border-radius:4px;padding:11px 15px;font-family:"Barlow Condensed";font-weight:600;font-size:16px;min-height:46px}
.btn.ghost{background:#fff;color:var(--tinta)}
.btn.acento{background:var(--ambar);border-color:var(--ambar-osc);color:#2B2000;
  box-shadow:0 1px 0 var(--ambar-osc)}
.btn.acento:active{background:var(--ambar-osc);box-shadow:none;transform:translateY(1px)}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tiras{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tira{position:relative;width:88px;height:88px;border-radius:4px;overflow:hidden;border:1px solid var(--linea);background:var(--oliva-osc);padding:0;display:block}
.tira .txt{position:static;display:flex;align-items:center;justify-content:center;height:100%;color:#C6D4B2;font-size:11px;text-align:center;padding:4px;background:none}
.suc-fija{font-family:"Barlow Condensed";font-weight:600;font-size:16px;color:var(--salvia-cl);padding:8px 4px}
.tira img,.tira video{width:100%;height:100%;object-fit:cover;display:block}
.tira[data-estado=local]{border-color:var(--alerta);border-style:dashed}
.tira[data-estado=listo]{border-color:var(--ok)}
.tira[data-estado=error]{border-color:var(--dano)}
.tira i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;font-style:normal;
  font-size:12px;line-height:20px;text-align:center;color:#fff;font-weight:700}
.tira i.ok{background:var(--ok)}
.tira i.err{background:var(--dano)}
.pb-caja{position:absolute;left:3px;right:3px;bottom:3px;height:4px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.pb{display:block;height:100%;background:var(--ambar);width:0;transition:width .2s}
.tira em{position:absolute;left:0;right:0;bottom:0;background:rgba(26,30,18,.78);color:#fff;font-style:normal;font-size:10.5px;padding:2px 4px;text-align:center}
.badge{display:inline-block;font-family:"Barlow Condensed";font-weight:600;font-size:12.5px;padding:2px 7px;border-radius:3px;background:#E3E9D7;color:#54603F}
.badge.ok{background:#E2EFD2;color:var(--ok)}
.badge.warn{background:#FBF0D6;color:#7A5409}
.badge.bad{background:#F5E1DD;color:var(--dano)}

/* ---------- lista fichas ---------- */
section.bloque{margin:18px 0 4px}
section.bloque h2.tit{font-size:20px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.ficha[data-fase=prep]{border-left-color:var(--ambar)}
.ficha[data-fase=entrega]{border-left-color:var(--ambar)}
.ficha[data-fase=ruta]{border-left-color:var(--salvia)}
.ficha[data-fase=revision]{border-left-color:var(--dano)}
.ficha[data-fase=reporte]{border-left-color:var(--oliva-cl)}
.ficha[data-fase=lista]{border-left-color:var(--ok)}
.ficha[data-fase=datos]{border-left-color:var(--linea)}
.ficha{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--linea);border-left:5px solid var(--ambar);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
.ficha[data-cerrada=true]{border-left-color:var(--ok)}
.ficha b{font-family:"Barlow Condensed";font-size:20px;display:block;line-height:1.1;color:var(--oliva);letter-spacing:.02em}
.ficha small{color:var(--gris);font-size:13px}
.ficha .m{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
.vacio{border:1px dashed #B6C09E;border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--gris);

/* ---------- pie fijo ---------- */
.pie{position:fixed;left:0;right:0;bottom:0;background:rgba(38,56,11,.97);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:45}
.pie-in{max-width:820px;margin:0 auto;display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.pie .nav{flex:0 0 40px;height:42px;border:1px solid #4C6317;background:#1F2E06;color:#fff;
  border-radius:4px;font-size:24px;line-height:1;padding:0;font-family:"Barlow Condensed"}
.pie .nav[disabled]{opacity:.3}
.pie .nav:active{background:var(--oliva)}
.pie .salir{white-space:nowrap}
@media(max-width:470px){
  .pie-in{flex-wrap:wrap}
  .pie .est{order:2;flex:1 1 auto}
  .pie .salir{order:3;flex:1 1 100%;margin-top:7px}
}
.pie .est{color:var(--salvia-cl);font-size:12px;flex:1;min-width:0;text-align:center;overflow:hidden}
.pie .est b{color:#fff;display:block;font-family:"Barlow Condensed";font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(26,30,18,.62);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal .box{background:#fff;width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 10px;font-size:21px}
.sig{width:100%;height:180px;border:1px dashed #B6C09E;border-radius:4px;background:#FBFCF8;touch-action:none;display:block}
.ruta{border:1px solid var(--linea);border-radius:4px;background:#FBFCF8;padding:10px;margin-bottom:10px}
.ruta>span{display:block;font-size:12.5px;color:var(--gris);margin-bottom:5px}
.ruta code{display:block;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;margin-bottom:8px;color:var(--tinta)}
ul.arch{list-style:none;margin:5px 0 0;padding:0}
ul.arch li{padding:4px 0;border-bottom:1px solid #EDF0E5;font-size:13px}
ul.arch li:last-child{border-bottom:0}
ul.arch code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}

/* Usa IndexedDB en el navegador. Si corre dentro de un entorno con window.storage, lo prefiere. */
const MEM = {}; let SIN_DISCO = false;

const IDB = {
  db:null,
  abrir(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((ok,err)=>{
      const p = indexedDB.open("camperspot", 1);
      p.onupgradeneeded = ()=>{ p.result.createObjectStore("kv"); };
      p.onsuccess = ()=>{ this.db=p.result; ok(this.db); };
      p.onerror = ()=>err(p.error);
    });
  },
  async tx(modo){ const db=await this.abrir(); return db.transaction("kv",modo).objectStore("kv"); },
  async get(k){ const t=await this.tx("readonly");
    return new Promise((ok,err)=>{ const r=t.get(k); r.onsuccess=()=>ok(r.result??null); r.onerror=()=>err(r.error); }); },
  async set(k,v){ const t=await this.tx("readwrite");
    return new Promise((ok,err)=>{ const r=t.put(v,k); r.onsuccess=()=>ok(true); r.onerror=()=>err(r.error); }); },
  async del(k){ const t=await this.tx("readwrite");
    return new Promise((ok,err)=>{ const r=t.delete(k); r.onsuccess=()=>ok(true); r.onerror=()=>err(r.error); }); },
  async list(pref){ const t=await this.tx("readonly");
    return new Promise((ok,err)=>{ const r=t.getAllKeys(IDBKeyRange.bound(pref, pref+"\uffff"));
      r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>err(r.error); }); },
};

const NATIVO = typeof window!=="undefined" && !!window.storage;

const St = {
  async get(k){
    if(SIN_DISCO) return MEM[k]??null;
    try{
      if(NATIVO){ const r=await window.storage.get(k); return r?r.value:null; }
      return await IDB.get(k);
    }catch(e){ return MEM[k]??null; }
  },
  async set(k,v){
    MEM[k]=v;
    try{
      if(NATIVO) await window.storage.set(k,v); else await IDB.set(k,v);
    }catch(e){ SIN_DISCO=true; }
  },
  async del(k){
    delete MEM[k];
    try{ if(NATIVO) await window.storage.delete(k); else await IDB.del(k); }catch(e){}
  },
  async list(p){
    if(SIN_DISCO) return Object.keys(MEM).filter(k=>k.startsWith(p));
    try{
      if(NATIVO){ const r=await window.storage.list(p); return r?r.keys:[]; }
      return await IDB.list(p);
    }catch(e){ return Object.keys(MEM).filter(k=>k.startsWith(p)); }
  },
};

const adicSel = r => (r.adicionales||[]).filter(a=>a!=="Ninguno");
const itemsPrep = r => PREP.map((t,i)=>({k:"p"+i,t})).concat(adicSel(r).map(a=>({k:"a:"+a,t:a,adic:1})));
const itemsRev = (g,r) => g.items.map((t,i)=>({k:g.id+i,t}))
  .concat(g.id==="falta" ? adicSel(r).map(a=>({k:"falta_a:"+a,t:a,adic:1})) : []);

function prog(r,et){
  if(!r) return [0,1];
  if(et==="datos"){ const c=[r.patente,r.cliente,r.fi,r.ft]; return [c.filter(Boolean).length,c.length]; }
  if(et==="prep"){ const it=itemsPrep(r); return [it.filter(x=>r.prep[x.k]).length, it.length]; }
  if(et==="entrega"){
    let n=0;
    if(cuentaVideos(r) >= 3) n++;
    if((r.media.f_tab_s||[]).length) n++;
    if(r.entrega.km) n++;
    return [n,3];
  }
  if(et==="revision"){
    let n=(r.media.f_tab_l||[]).length?1:0, tot=1;
    REV_GRUPOS.forEach(g=>itemsRev(g,r).forEach(x=>{ tot++; if(r.rev[x.k]) n++; }));
    return [n,tot];
  }
  const c=[r.reporte.km,r.reporte.bencina,r.reporte.gas]; return [c.filter(Boolean).length,c.length];
}
function faseDe(r){
  if(r.estado==="cerrado") return {k:"cerrada", t:"Cerrada", etapa:"reporte"};
  const listo = k=>{ const[n,t]=prog(r,k); return n>=t; };
  if(!listo("datos"))   return {k:"datos",   t:"Faltan datos",    etapa:"datos"};
  if(!listo("prep"))    return {k:"prep",    t:"Por preparar",    etapa:"prep"};
  if(!listo("entrega")) return {k:"entrega", t:"Por entregar",    etapa:"entrega"};
  if(r.ft && r.ft >= hoy() && !Object.keys(r.rev||{}).length)
                        return {k:"ruta",    t:"En ruta",         etapa:"revision"};
  if(!listo("revision"))return {k:"revision",t:"Por revisar",     etapa:"revision"};
  if(!listo("reporte")) return {k:"reporte", t:"Por cerrar",      etapa:"reporte"};
  return {k:"lista", t:"Lista para cerrar", etapa:"reporte"};
}

async function guardaFicha(forzar){
  const r=S.r; if(!r) return;
  const yaExiste = S.indice.some(x=>x.id===r.id);
  if(!yaExiste && !forzar && !r.patente && !r.cliente) return;   // ficha en blanco: no se archiva
  if(r.driveNombre && r.driveNombre !== nombreCarpeta(r)){
    delete r.driveCarpeta; delete r.driveSubs;
  }
  r.driveNombre = nombreCarpeta(r);
  r.act=Date.now();
  const [n,t]=progTotal(r);
  const res={id:r.id,suc:r.suc,patente:r.patente,cliente:r.cliente,fi:r.fi,ft:r.ft,
             estado:r.estado,act:r.act,pct:Math.round(n/t*100),
             mes:mesDe(r), carpeta:nombreCarpeta(r), fase:faseDe(r).k, driveCarpeta:r.driveCarpeta||""};
  const i=S.indice.findIndex(x=>x.id===r.id);
  if(i<0) S.indice.unshift(res); else S.indice[i]=res;
  await St.set("r:"+r.id, JSON.stringify(r));

  const raw = await St.get("r:"+id); if(!raw) return flash("No se encontró la ficha");

  if(!Array.isArray(S.r.adicionales)) S.r.adicionales = S.r.adicionales ? [S.r.adicionales] : [];
  delete S.r.operador;
  Object.keys(S.r.rev||{}).forEach(k=>{ if(S.r.rev[k]==="obs") S.r.rev[k]="dano"; });
  for(const k of Object.keys(S.r.media||{})){
    for(const m of S.r.media[k]){

      if(m.thumb && !THUMBS[m.id]){ const d=await St.get("t:"+m.id); if(d) THUMBS[m.id]=d; }

    if(m.tipo==="foto" && !FOTOS[m.id]){ const x=await St.get("f:"+m.id); if(x) FOTOS[m.id]=x; }

    for(const d of r.danos||[]) for(const m of d.fotos||[]) await St.del("f:"+m.id);

/* ══════════ IMÁGENES ══════════ */
const THUMBS = {};
function miniaturaVideo(file){
  return new Promise(ok=>{
    let listo=false; const fin=v=>{ if(!listo){ listo=true; ok(v); } };
    const v=document.createElement("video");
    v.preload="metadata"; v.muted=true; v.playsInline=true;
    const u=URL.createObjectURL(file); v.src=u;
    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(1, (v.duration||3)/3); }catch(e){ fin(null); } };
    v.onseeked=()=>{
      try{
        const c=document.createElement("canvas");
        const e=Math.min(1, 260/Math.max(v.videoWidth||260, v.videoHeight||260));
        c.width=Math.round((v.videoWidth||260)*e); c.height=Math.round((v.videoHeight||260)*e);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        fin(c.toDataURL("image/jpeg",.6));
      }catch(e){ fin(null); }
      URL.revokeObjectURL(u);
    };
    v.onerror=()=>{ URL.revokeObjectURL(u); fin(null); };
    setTimeout(()=>{ URL.revokeObjectURL(u); fin(null); }, 7000);
  });
}

function comprime(file,max=1800,q=.72){
  return new Promise((ok,err)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ let{width:w,height:h}=im; const e=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*e); h=Math.round(h*e);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        ok(c.toDataURL("image/jpeg",q)); };
      im.onerror=err; im.src=fr.result; };
    fr.onerror=err; fr.readAsDataURL(file);
  });
}

async function subir(slotKey, files, danoId){
  const r=S.r; const arr=[...files]; if(!arr.length) return;
  let hechos=0;
  flash(`Procesando 1 de ${arr.length}…`, true);
  for(const file of arr){
    flash(`Procesando ${++hechos} de ${arr.length}…`, true);
    const id=uid();
    if(file.type.startsWith("video")){
      ARCHIVOS[id]=file;
      const m={id,tipo:"video",nombre:file.name,peso:file.size};
      const th=await miniaturaVideo(file);
      if(th){ THUMBS[id]=th; await St.set("t:"+id, th); m.thumb=1; }
      push(slotKey,m,danoId); encolar(r,slotKey,danoId,m);
    }else{
      let data; try{ data=await comprime(file); }catch(e){ flash("No se pudo leer la imagen"); continue; }
      FOTOS[id]=data;
      await St.set("f:"+id, data);
      const m={id,tipo:"foto",nombre:file.name,peso:data.length};
      push(slotKey,m,danoId); encolar(r,slotKey,danoId,m);
    }
  }
  await guardaFicha(); pinta();
}
function push(slot,item,danoId){
  const r=S.r;
  if(danoId){ const d=r.danos.find(x=>x.id===danoId); (d.fotos=d.fotos||[]).push(item); }
  else { (r.media[slot]=r.media[slot]||[]).push(item); }
}
async function quitaArchivo(id){
  const i=COLA.findIndex(t=>t.id===id); if(i>=0) COLA.splice(i,1);
  delete ARCHIVOS[id];
  await St.del("f:"+id); delete FOTOS[id];
  await St.del("t:"+id); delete THUMBS[id];
}
async function quitaMedia(slot,id,danoId){
  const r=S.r;
  if(danoId){ const d=r.danos.find(x=>x.id===danoId); d.fotos=d.fotos.filter(m=>m.id!==id); }
  else r.media[slot]=(r.media[slot]||[]).filter(m=>m.id!==id);
  await St.del("f:"+id); delete FOTOS[id];
  await St.del("t:"+id); delete THUMBS[id];
  await guardaFicha(); pinta(true);
}

let CFG = { url:"https://drive-camperspot.miguelduchs.workers.dev", clave:"", raizId:"" };
const hayDrive = ()=> !!(CFG.url && CFG.clave);
const corta = t => { t=String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  return t.length>180 ? t.slice(0,180)+"…" : t; };
const ARCHIVOS = {};          // id -> File o Blob pendiente de subir (solo esta sesión)
const COLA = [];              // trabajos de subida

async function cargaCfg(){
  const raw = await St.get("cfg");
  if(raw){ try{ CFG = {...CFG, ...JSON.parse(raw)}; }catch(e){} }
}
async function guardaCfg(){ await St.set("cfg", JSON.stringify(CFG)); }

async function api(ruta, cuerpo){
  const r = await fetch(CFG.url.replace(/\/$/,"") + ruta, {
    method: cuerpo ? "POST" : "GET",
    headers: { "Content-Type":"application/json", "x-clave": CFG.clave },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const txt = await r.text();
  let d={};
  try{ d=JSON.parse(txt); }catch(e){ throw new Error("Respuesta inesperada del servidor"); }
  if(!r.ok) throw new Error(corta(d.error || ("HTTP "+r.status)));
  return d;
}

/* Dónde va cada archivo dentro de la carpeta del arriendo */
function destino(r, slot, danoId, indice){
  if(danoId){
    const d=(r.danos||[]).find(x=>x.id===danoId);
    return { sub:"Daños", base: slug(d && d.zona || "sin-zona") };
  }
  if(String(slot).startsWith("rev:")){
    const k=slot.slice(4);
    let t=k;
    REV_GRUPOS.forEach(g=>itemsRev(g,r).forEach(x=>{ if(x.k===k) t=x.t; }));
    return { sub:"Daños", base: slug(t) };
  }
  if(slot==="v_rec") return { sub:"Videos", base:NOMBRES[slot] };
  if(NOMBRES[slot]) return { sub:"Ficha", base:NOMBRES[slot] };
  return { sub:"Ficha", base: slug(slot||"archivo") };
}

function encolar(r, slot, danoId, media){
  if(!hayDrive()){ media.estado="local"; return; }
  media.estado = "pendiente";
  COLA.push({ id:media.id, fichaId:r.id, slot, danoId, media });
  procesaCola();
}

let ACTIVAS = 0;
const MAX_PARALELO = 2;

async function procesaCola(){
  if(!hayDrive()) return;
  while(ACTIVAS < MAX_PARALELO && COLA.some(t=>!t.tomado)){
    const t = COLA.find(x=>!x.tomado);
    t.tomado = true; ACTIVAS++;
    trabaja(t).finally(()=>{
      ACTIVAS--;
      const i=COLA.indexOf(t); if(i>=0) COLA.splice(i,1);
      if(S.r && S.r.id===t.fichaId){ pintaSubidas(); guardaFicha(); }
      procesaCola();
    });
  }
}

async function trabaja(t){
  for(let intento=1; intento<=3; intento++){
    try{
      t.media.estado = intento>1 ? "reintento" : "subiendo";
      if(S.r && S.r.id===t.fichaId) pintaSubidas();
      await subeArchivo(t);
      t.media.estado="listo"; delete t.media.detalle;
      return;
    }catch(e){
      t.media.detalle = corta(e.message||e);
      if(intento<3) await new Promise(r=>setTimeout(r, intento*2500));
    }
  }
  t.media.estado="error";
  flash("No se pudo subir: "+t.media.detalle);
}

/* PUT con progreso real. XHR permite seguir el avance del envío, fetch no. */
function enviar(url, blob, rango, onProg){
  return new Promise((ok,err)=>{
    const x=new XMLHttpRequest();
    x.open("PUT", url, true);
    if(rango) x.setRequestHeader("Content-Range", rango);
    x.upload.onprogress = e=>{ if(e.lengthComputable) onProg(e.loaded, e.total); };
    x.onload = ()=>ok({ status:x.status, texto:x.responseText, rango:x.getResponseHeader("Range") });
    x.onerror = ()=>err(new Error("Se cortó la conexión durante la subida"));
    x.onabort = ()=>err(new Error("Subida cancelada"));
    x.send(blob);
  });
}

const UMBRAL_TROZOS = 200 * 1024 * 1024;   // bajo esto va de una sola pasada
const TROZO = 32 * 1024 * 1024;

async function subeArchivo(t){
  const r = S.r && S.r.id===t.fichaId ? S.r : JSON.parse(await St.get("r:"+t.fichaId));
  const blob = ARCHIVOS[t.id] || (FOTOS[t.id] ? await (await fetch(FOTOS[t.id])).blob() : null);
  if(!blob) throw new Error("El archivo ya no está en memoria");

  const d = destino(r, t.slot, t.danoId);
  const lista = t.danoId ? ((r.danos.find(x=>x.id===t.danoId)||{}).fotos||[]) : (r.media[t.slot]||[]);
  const i = Math.max(0, lista.findIndex(m=>m.id===t.id));
  const ext = EXT(t.media.nombre) || (t.media.tipo==="video" ? "mp4" : "jpg");
  const nombre = `${d.base}${i?"-"+(i+1):""}.${ext}`;

  const carpetaId = await carpetaSub(r, d.sub);
  const { subidaUrl } = await api("/sesion", {
    carpetaId, nombre, mime: blob.type || "application/octet-stream", tamano: blob.size,
  });

  const avanza = (hechos)=>{
    t.media.pct = Math.min(100, Math.round(hechos / blob.size * 100));
    if(S.r && S.r.id===t.fichaId) pintaSubidas();
  };

  let respuesta = null;

  if(blob.size <= UMBRAL_TROZOS){
    const res = await enviar(subidaUrl, blob, `bytes 0-${blob.size-1}/${blob.size}`, cargado=>avanza(cargado));
    if(res.status>=200 && res.status<300) respuesta = JSON.parse(res.texto||"{}");
    else throw new Error("Drive respondió "+res.status);
  }else{
    let desde = 0;
    while(desde < blob.size){
      const hasta = Math.min(desde + TROZO, blob.size);
      const base = desde;
      const res = await enviar(subidaUrl, blob.slice(desde, hasta),
        `bytes ${desde}-${hasta-1}/${blob.size}`, cargado=>avanza(base + cargado));
      if(res.status === 308){
        desde = res.rango ? Number(res.rango.split("-")[1]) + 1 : hasta;
      }else if(res.status>=200 && res.status<300){
        respuesta = JSON.parse(res.texto||"{}");
        desde = blob.size;
      }else throw new Error("Drive respondió "+res.status);
      avanza(desde);
    }
  }

  t.media.driveId = respuesta && respuesta.id || "";
  t.media.pct = 100;
  delete ARCHIVOS[t.id];
}

async function carpetaRaiz(){
  if(CFG.raizId) return CFG.raizId;
  const { carpetaId } = await api("/carpeta", { ruta:[RAIZ] });
  CFG.raizId = carpetaId; await guardaCfg();
  return carpetaId;
}
async function carpetaArriendo(r){
  if(r.driveCarpeta) return r.driveCarpeta;
  const padreId = await carpetaRaiz();
  const { carpetaId } = await api("/carpeta", { ruta:[nombreCarpeta(r)], padreId });
  r.driveCarpeta = carpetaId;
  if(S.r && S.r.id===r.id) S.r.driveCarpeta = carpetaId;
  return carpetaId;
}
/* Los ids se guardan en la ficha para no volver a buscarlos en cada archivo */
async function carpetaSub(r, sub){
  r.driveSubs = r.driveSubs || {};
  if(r.driveSubs[sub]) return r.driveSubs[sub];
  const padreId = await carpetaArriendo(r);
  const { carpetaId } = await api("/carpeta", { ruta:[sub], padreId });
  r.driveSubs[sub] = carpetaId;
  if(S.r && S.r.id===r.id){ S.r.driveSubs = S.r.driveSubs||{}; S.r.driveSubs[sub]=carpetaId; }
  return carpetaId;
}
const linkCarpeta = id => id ? `https://drive.google.com/drive/folders/${id}` : "";

/* ── Videos subidos con la app de Drive ────────────────────────────────
   Safari congela el JavaScript al salir de la pestaña, así que una página web
   no puede subir en segundo plano. La app de Drive sí. Cada tema tiene su
   propia carpeta: lo que esté adentro es ese video, sin tener que asignarlo. */
const SLOTS_VIDEO = [
  {k:"v_ext", t:"Exterior y bajo", carpeta:"1 Exterior y bajo", archivo:"1-exterior-y-bajo"},
  {k:"v_int", t:"Interior",        carpeta:"2 Interior",        archivo:"2-interior"},
  {k:"v_tec", t:"Techo",           carpeta:"3 Techo",           archivo:"3-techo"},
];

async function carpetaVideo(r, slotKey){
  const def = SLOTS_VIDEO.find(x=>x.k===slotKey);
  const clave = "Videos/"+def.carpeta;
  r.driveSubs = r.driveSubs || {};
  if(r.driveSubs[clave]) return r.driveSubs[clave];
  const padreId = await carpetaSub(r, "Videos");
  const { carpetaId } = await api("/carpeta", { ruta:[def.carpeta], padreId });
  r.driveSubs[clave] = carpetaId;
  if(S.r && S.r.id===r.id){ S.r.driveSubs = S.r.driveSubs||{}; S.r.driveSubs[clave]=carpetaId; }
  await guardaFicha();
  return carpetaId;
}

async function abreCarpetaVideo(slotKey){
  const r=S.r;
  const def = SLOTS_VIDEO.find(x=>x.k===slotKey);
  flash("Abriendo la carpeta de "+def.t.toLowerCase()+"…", true);
  try{
    const id = await carpetaVideo(r, slotKey);
    flash("Sube el video en Drive y vuelve acá");
    window.open(linkCarpeta(id), "_blank", "noopener");
  }catch(e){ flash("No se pudo abrir: "+corta(e.message)); }
}

/* Lee las carpetas de video y deja el nombre ordenado */
async function revisaVideosDrive(silencioso){
  const r=S.r; if(!r || !hayDrive()) return;
  let encontrados=0, nuevos=0;
  r.driveVids = r.driveVids || {};
  for(const def of SLOTS_VIDEO){
    const id = (r.driveSubs||{})["Videos/"+def.carpeta];
    if(!id) continue;
    try{
      const d = await api("/listar?carpetaId="+encodeURIComponent(id));
      const archivos = (d.files||[])
        .filter(f=>f.mimeType && f.mimeType.startsWith("video"))
        .map(f=>({ id:f.id, nombre:f.name, mb:Math.round(Number(f.size||0)/1048576) }));
      const antes = (r.driveVids[def.k]||[]).length;
      r.driveVids[def.k] = archivos;
      encontrados += archivos.length;
      nuevos += Math.max(0, archivos.length - antes);
      // Nombre ordenado: se renombra solo el primero de cada carpeta
      for(let i=0;i<archivos.length;i++){
        const esperado = `${def.archivo}${i?"-"+(i+1):""}.${EXT(archivos[i].nombre)}`;
        if(archivos[i].nombre !== esperado){
          try{ await api("/renombrar", { fileId:archivos[i].id, nombre:esperado });
               archivos[i].nombre = esperado; }catch(e){}
        }
      }
    }catch(e){ if(!silencioso) flash("No se pudo revisar: "+corta(e.message)); }
  }
  await guardaFicha();
  if(!silencioso || nuevos>0)
    flash(encontrados ? `${encontrados} video(s) en Drive` : "Todavía no hay videos en las carpetas");
  pinta(true);
}
const videosDe = (r,slot) => (r.driveVids||{})[slot] || [];

async function subeDocumentos(r){

}

const pendientes = ()=> COLA.length;
function pintaSubidas(){
  document.querySelectorAll("[data-ver]").forEach(b=>{
    const m = buscaMedia(b.dataset.ver); if(!m) return;
    b.dataset.estado = m.estado || (m.driveId ? "listo" : "");
    const barra = b.querySelector(".pb");
    if(barra) barra.style.width = (m.pct||0) + "%";
  });
  pintaPie();
}
function buscaMedia(id){
  const r=S.r; if(!r) return null;
  for(const k of Object.keys(r.media||{})){ const m=(r.media[k]||[]).find(x=>x.id===id); if(m) return m; }
  for(const d of r.danos||[]){ const m=(d.fotos||[]).find(x=>x.id===id); if(m) return m; }
  return null;
}

/* Deja la carpeta creada antes de que el operario la necesite */
async function alistaVideos(){
  const r=S.r;
  if(!r || !hayDrive() || (r.driveSubs||{}).Videos) return;
  if(!r.patente && !r.cliente) return;
  try{ await carpetaSub(r,"Videos"); await guardaFicha(true); pinta(true); }catch(e){}
}

/* Consulta qué videos llegaron a la carpeta de Drive */
async function revisarVideos(avisar){
  const r=S.r; if(!r || !hayDrive()) return;
  try{
    S.revisando=true; if(avisar) pinta(true);
    const carpeta = await carpetaSub(r,"Videos");
    const d = await api("/listar?carpetaId="+encodeURIComponent(carpeta));
    const antes=(r.driveVideos||[]).length;
    r.driveVideos = (d.files||[])
      .filter(f=>/video|mp4|mov|m4v|avi/i.test(f.mimeType+" "+f.name))
      .map(f=>({id:f.id,name:f.name,size:f.size||0}));
    S.revisando=false;
    await guardaFicha(true); pinta(true);
    const ahora=r.driveVideos.length;
    if(avisar) flash(ahora ? `${ahora} video(s) en la carpeta` : "Todavía no llega ninguno");
    else if(ahora>antes) flash(`${ahora-antes} video(s) nuevo(s) detectado(s)`);
  }catch(e){
    S.revisando=false; pinta(true);
    if(avisar) flash("No se pudo revisar: "+corta(e.message));
  }
}

const app=document.getElementById("app");
function pinta(keep){
  const y = keep ? window.scrollY : 0;
  document.getElementById("sucSw").innerHTML = (S.vista==="ficha"&&S.r)
    ? `<span class="suc-fija">${esc(S.r.suc)}</span>`
    : SUCURSALES.map(x=>`<button data-suc="${x}" aria-pressed="${S.suc===x}">${x}</button>`).join("");
  const rail=document.getElementById("rail"), pie=document.getElementById("pie");
  if(S.vista==="ficha"&&S.r){ rail.hidden=false; pie.hidden=false; pintaRail(); pintaPie(); }
  else { rail.hidden=true; pie.hidden=true; }
  if(S.vista==="inicio") vistaInicio();
  else if(S.vista==="flota") vistaFlota();
  else if(S.vista==="archivo") vistaArchivo();
  else if(S.vista==="ajustes") vistaAjustes();
  else vistaFicha();
  if(keep) window.scrollTo(0,y); else window.scrollTo({top:0});
}
function pintaRail(){
  document.getElementById("railIn").innerHTML = ETAPAS.map(e=>{
    const[n,t]=prog(S.r,e.k), seg=6, on=Math.round(n/t*seg);
    return `<button class="gauge" data-etapa="${e.k}" aria-current="${S.etapa===e.k}" data-full="${n>=t}">
      <b>${e.t}</b><span class="bars">${Array.from({length:seg},(_,i)=>`<s class="${i<on?"on":""}"></s>`).join("")}</span>
      <i>${n}/${t}</i></button>`;
  }).join("");
}
function pintaPie(){
  const[n,t]=progTotal(S.r), p=Math.round(n/t*100);
  const g=!S.indice.some(x=>x.id===S.r.id) ? "Se guarda al escribir"
    : S.guardado ? "Guardado "+new Date(S.guardado).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}) : "Guardada";
  const ix=ETAPAS.findIndex(e=>e.k===S.etapa);
  const[en,et]=prog(S.r,S.etapa);
  document.getElementById("pieIn").innerHTML=`
    <button class="nav" data-nav="-1" ${ix<=0?"disabled":""} aria-label="Etapa anterior">‹</button>
    <div class="est"><b>${ETAPAS[ix].t} · ${en}/${et}</b>${pendientes()?`Subiendo ${pendientes()} archivo(s)…`:g}</div>
    <button class="nav" data-nav="1" ${ix>=ETAPAS.length-1?"disabled":""} aria-label="Etapa siguiente">›</button>

}

/* ══════════ RUTAS Y NOMBRES DE ARCHIVO ══════════ */
const RAIZ = "Camperspot";
function slug(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32) || "sin-dato";
}
const mesDe = r => (r.ft||r.fi||hoy()).slice(0,7);
const nombreCarpeta = r => `${(r.ft||r.fi||hoy())}_${slug(r.patente)||"SIN-PATENTE"}_${slug(r.cliente)}`;
function rutas(r){
  const base=`${RAIZ}/${nombreCarpeta(r)}`;
  return { base, carpeta:nombreCarpeta(r), mes:mesDe(r),
           videos:`${base}/Videos`, ficha:`${base}/Ficha`, danos:`${base}/Daños` };
}
const EXT = n => { const p=String(n||"").split("."); return p.length>1 ? p.pop().toLowerCase() : "jpg"; };
const NOMBRES = {
  v_rec:"recorrido",
  f_tab_s:"tablero-salida", f_tab_l:"tablero-llegada",
};
function archivosDe(r){
  const out={videos:[], ficha:[{n:"ficha.json"},{n:"resumen.txt"}], danos:[]};
  (r.media.v_rec||[]).forEach((m,i)=>out.videos.push({n:`recorrido-${i+1}.${EXT(m.nombre)}`}));
  (r.driveVideos||[]).forEach(v=>out.videos.push({n:v.name}));
  ["f_tab_s","f_tab_l"].forEach(k=>(r.media[k]||[]).forEach((m,i)=>
    out.ficha.push({n:`${NOMBRES[k]}${i?"-"+(i+1):""}.${EXT(m.nombre)}`})));
  hallazgos(r).forEach(h=>h.media.forEach((m,i)=>
    out.danos.push({n:`${slug(h.t)}${i?"-"+(i+1):""}.${EXT(m.nombre)}`, d:h.t})));
  (r.danos||[]).forEach(d=>(d.fotos||[]).forEach((m,i)=>
    out.danos.push({n:`${slug(d.zona||"sin-zona")}${i?"-"+(i+1):""}.${EXT(m.nombre)}`, d:d.zona||""})));
  return out;
}

function hallazgos(r){
  const out=[];
  REV_GRUPOS.forEach(g=>itemsRev(g,r).forEach(x=>{
    const media=r.media["rev:"+x.k]||[];
    if(r.rev[x.k]==="dano" || media.length)
      out.push({grupo:g.t, t:x.t, nota:r.revNota[x.k]||"", media, slot:"rev:"+x.k});
  }));
  return out;
}
function secReporte(r){
  const km = (+r.reporte.km||0)-(+r.entrega.km||0);
  const hs = hallazgos(r);
  const total = hs.length + r.danos.length;
  const adj = hs.reduce((a,h)=>a+h.media.length,0) + r.danos.reduce((a,d)=>a+(d.fotos||[]).length,0);
  return `<div class="card"><h3>Resumen de daños <em>${total} hallazgo(s) · ${adj} respaldo(s)</em></h3>
    ${hs.map(h=>`<div class="slot">
      <h4>${esc(h.t)} <span class="badge bad">Daño</span></h4>
      <p>${esc(h.grupo)}${h.nota?" — "+esc(h.nota):""}</p>
      ${h.media.length?`<div class="tiras">${h.media.map(m=>tiraHTML(m,h.slot)).join("")}</div>`
        :`<span class="badge warn">Sin respaldo adjunto</span>`}
    </div>`).join("")}
    ${r.danos.map(d=>`<div class="slot">
      <div class="row" style="align-items:center"><h4 style="flex:1">${esc(d.zona||"Daño sin zona")} <span class="badge bad">Agregado aquí</span></h4>
        <button class="btn ghost sm" data-deldano="${d.id}">Quitar</button></div>
      <label class="f" style="margin:8px 0 6px"><input type="text" data-dano="${d.id}" data-c="zona" value="${esc(d.zona)}" placeholder="Zona: costado izquierdo, techo, WC…"></label>
      <label class="f"><textarea data-dano="${d.id}" data-c="desc" placeholder="Descripción (opcional)">${esc(d.desc)}</textarea></label>
      <div class="row">
        <button class="btn ghost sm" data-add="dano" data-dano="${d.id}" data-tipo="foto" data-cam="1">Tomar foto</button>
        <button class="btn ghost sm" data-add="dano" data-dano="${d.id}" data-tipo="mixto">Adjuntar respaldo</button>
      </div>
      <div class="tiras">${(d.fotos||[]).map(m=>tiraHTML(m,"",d.id)).join("")}</div>
    </div>`).join("")}
    ${total?"":`<div class="pad" style="padding-bottom:0"><p class="hint" style="margin:0">Sin daños registrados. Todo lo revisado en la etapa anterior quedó en OK.</p></div>`}
    <div class="pad"><button class="btn wide ghost" data-act="addDano">Agregar un daño</button></div>
  </div>
  <div class="card"><h3>Cierre</h3><div class="pad">
    <div class="grid">
      <label class="f"><span>Millaje de llegada</span><input type="number" inputmode="numeric" data-set="reporte.km" value="${esc(r.reporte.km)}" placeholder="Ej: 190450"></label>
      <label class="f"><span>Uso de millaje</span><input type="text" value="${km>0?km.toLocaleString("es-CL"):"—"}" readonly style="background:#EAEEE0"></label>
    </div>
    <div class="grid">
      <label class="f"><span>Estado de bencina</span><select data-set="reporte.bencina">
        <option value="">Seleccionar…</option><option ${r.reporte.bencina==="Lleno"?"selected":""}>Lleno</option>
        <option ${r.reporte.bencina==="Reponer"?"selected":""}>Reponer</option></select></label>
      <label class="f"><span>Pedir gas (balones)</span><select data-set="reporte.gas">
        ${["0","1","2"].map(g=>`<option ${r.reporte.gas===g?"selected":""}>${g}</option>`).join("")}</select></label>
    </div>
    <label class="f"><span>Comentario final</span><textarea data-set="reporte.nota" placeholder="Qué queda pendiente para el próximo arriendo">${esc(r.reporte.nota)}</textarea></label>
    <button class="btn wide" data-act="resumen" style="margin-top:6px">Ver resumen del arriendo</button>
  </div></div>
  ${cardArchivo(r)}`;
}

function cardArchivo(r){
  const ru=rutas(r), ar=archivosDe(r), link=linkCarpeta(r.driveCarpeta);
  const sinSubir = [];
  for(const k of Object.keys(r.media||{})) for(const m of r.media[k]) if(!m.driveId) sinSubir.push(m);
  for(const d of r.danos||[]) for(const m of d.fotos||[]) if(!m.driveId) sinSubir.push(m);
  const bloque=(t,lista,vacio)=>`<div class="ruta"><span>${t}</span>
    <ul class="arch">${lista.length?lista.map(a=>`<li><code>${esc(a.n)}</code></li>`).join("")
      :`<li class="vacia">${vacio}</li>`}</ul></div>`;
  return `<div class="card"><h3>Archivo en Drive</h3><div class="pad">
    ${link
      ? `<a class="btn wide" href="${link}" target="_blank" rel="noopener" style="text-decoration:none">Abrir carpeta del arriendo</a>
         <p class="hint">${esc(ru.carpeta)}</p>`
      : hayDrive()
        ? `<p class="hint" style="margin:0">La carpeta se crea al subir el primer archivo.</p>`
        : `<div class="aviso" style="margin:0"><b>Drive sin conectar.</b><br>Nada se está respaldando.
           <button class="btn ghost sm" data-act="ajustes" style="margin-top:8px">Conectar</button></div>`}
    ${sinSubir.length?`<p class="hint"><b>${sinSubir.length} archivo(s) sin respaldar.</b> Tócalos en su sección para ver el motivo.</p>`:""}
    <div class="grid" style="margin-top:12px">
      ${bloque("Videos", ar.videos, "Ninguno")}
      ${bloque("Ficha", ar.ficha, "—")}
    </div>
    ${bloque("Daños", ar.danos, "Sin daños")}
    <div class="row" style="margin-top:12px">
      <button class="btn ghost sm" data-act="bajarResumen">Bajar resumen.txt</button>
      <button class="btn ghost sm" data-act="bajarJson">Bajar ficha.json</button>
    </div>
  </div></div>`;
}

function slotHTML(s,r){
  const ms=r.media[s.k]||[];
  return `<div class="slot"><h4>${s.t} ${ms.length?`<span class="badge ok">${ms.length}</span>`:`<span class="badge warn">Pendiente</span>`}</h4>
    <p>${s.d}</p>
    <div class="row">
      ${s.tipo==="video"
        ? `<button class="btn ghost sm" data-add="${s.k}" data-tipo="video">Adjuntar video</button>`
        : `<button class="btn ghost sm" data-add="${s.k}" data-tipo="foto" data-cam="1">Tomar foto</button>
           <button class="btn ghost sm" data-add="${s.k}" data-tipo="foto">Elegir archivo</button>`}
    </div>
    ${s.tipo==="video"?`<p class="hint">Graba con la app de cámara del teléfono y adjunta el archivo desde la galería. Así conserva la resolución original.</p>`:""}
    <div class="tiras">${ms.map(m=>tiraHTML(m,s.k)).join("")}</div></div>`;
}
function tiraHTML(m,slot,danoId){
  const cuerpo = m.tipo==="foto"
    ? (FOTOS[m.id]?`<img src="${FOTOS[m.id]}" alt="">`:`<em class="txt">Foto</em>`)
    : (THUMBS[m.id] ? `<img src="${THUMBS[m.id]}" alt=""><em>Video</em>` : `<em class="txt">Video</em>`);
  const est = m.estado || (m.driveId ? "listo" : "");
  const marca = est==="listo" ? `<i class="ok">✓</i>`
    : est==="error" ? `<i class="err">!</i>`
    : est ? `<span class="pb-caja"><span class="pb" style="width:${m.pct||0}%"></span></span>` : "";
  return `<button class="tira" data-ver="${m.id}" data-slot="${slot||""}" data-dano="${danoId||""}"
    data-estado="${est}" aria-label="Ver ${m.tipo}">${cuerpo}${marca}</button>`;
}

let VISOR=null;
function verMedia(id,slot,danoId){
  VISOR={id,slot,danoId};
  const foto=FOTOS[id], m=buscaMedia(id);
  const cuerpo = foto ? `<img src="${foto}" alt="" style="width:100%;border-radius:4px;display:block">`
    : THUMBS[id] ? `<img src="${THUMBS[id]}" alt="" style="width:100%;border-radius:4px;display:block">`
    : "";
  const extra = (m && m.driveId && m.tipo==="video")
    ? `<a class="btn wide" style="margin-top:10px;text-decoration:none"
          href="https://drive.google.com/file/d/${m.driveId}/view" target="_blank" rel="noopener">Reproducir en Drive</a>`
    : "";
  const faltante = (!foto && !(m&&m.driveId))
      ? (m && ARCHIVOS[id]
          ? `<p class="hint">Se está subiendo. Cuando termine se podrá reproducir desde Drive.</p>`
          : `<div class="aviso" style="margin:0"><b>Archivo no disponible aquí.</b><br>No alcanzó a subirse o se adjuntó desde otro dispositivo. Vuelve a adjuntarlo.</div>`)
      : "";
  const est = m && (m.estado || (m.driveId?"listo":""));
  const aviso = est==="error"
      ? `<div class="aviso" style="margin:10px 0 0"><b>No se pudo subir.</b><br>${esc(m.detalle||"Error desconocido")}</div>`
    : est==="listo" ? `<p class="hint">Respaldado en Drive.</p>`
    : est ? `<p class="hint">Subiendo… ${m.pct||0}%</p>`
    : hayDrive() ? "" : `<p class="hint">Solo en este dispositivo. Drive no está conectado.</p>`;
  modal(`${cuerpo}${faltante}${extra}${aviso}<div class="row" style="margin-top:12px">
    ${est==="error"?`<button class="btn acento" data-act="reintentar" style="flex:1">Reintentar</button>`:""}
    <button class="btn ghost" data-act="borrarMedia" style="flex:1">Eliminar</button></div>`);
}

/* ══════════ EVENTOS ══════════ */
document.addEventListener("click", async ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  const d=t.dataset;

  if(d.suc){ S.suc=d.suc; pinta(); return; }
  if(d.etapa){ if(S.r){ S.r.ultimaEtapa=d.etapa; await guardaFicha(true); } S.etapa=d.etapa; pinta();
    if(S.etapa==="entrega") alistaVideos(); return; }
  if(d.nav){ const i=ETAPAS.findIndex(e=>e.k===S.etapa)+Number(d.nav);
    if(i<0||i>=ETAPAS.length) return;
    S.etapa=ETAPAS[i].k; S.r.ultimaEtapa=S.etapa; await guardaFicha(true); pinta();
    if(S.etapa==="entrega") alistaVideos(); return; }
  if(d.abre){ await abreFicha(d.abre); return; }
  if(d.chk!=null){ S.r.prep[d.chk]=!S.r.prep[d.chk];
    t.setAttribute("aria-pressed",!!S.r.prep[d.chk]); pintaRail(); pintaPie(); guardaFicha(); return; }
  if(d.adic){
    const v=d.adic; let a=(S.r.adicionales||[]).slice();
    if(v==="Ninguno") a = a.includes("Ninguno") ? [] : ["Ninguno"];
    else { a=a.filter(x=>x!=="Ninguno"); a = a.includes(v) ? a.filter(x=>x!==v) : [...a,v]; }
    S.r.adicionales=a;
    document.querySelectorAll("[data-adic]").forEach(b=>b.setAttribute("aria-pressed", a.includes(b.dataset.adic)));
    const s=document.getElementById("adicResumen"); if(s) s.textContent=resumenAdic(S.r);
    guardaFicha(); return;
  }
  if(d.tri){ const k=d.tri; S.r.rev[k] = S.r.rev[k]===d.v ? "" : d.v; guardaFicha(); pinta(true); return; }
  if(d.ver){ verMedia(d.ver, d.slot, d.dano||null); return; }
  if(d.add){ pedirArchivo(d.add, d.tipo, d.cam, d.dano||null); return; }
  if(d.deldano){ confirmar("¿Quitar este daño y sus respaldos?", async()=>{ for(const m of (S.r.danos.find(x=>x.id===d.deldano)||{}).fotos||[]) await quitaArchivo(m.id); S.r.danos=S.r.danos.filter(x=>x.id!==d.deldano); await guardaFicha(); pinta(true); }); return; }
  if(d.delveh){ confirmar(`¿Eliminar ${d.delveh} de la flota?`, async()=>{ S.flota=S.flota.filter(v=>v.patente!==d.delveh); await St.set("flota",JSON.stringify(S.flota)); pinta(true); }, "Eliminar"); return; }

  if(d.copiar){ copiar(d.copiar, "Ruta copiada"); return; }

  switch(d.act){
    case "verArchivo": S.vista="archivo"; pinta(); break;
    case "ajustes": S.vista="ajustes"; pinta(); break;
    case "abrirVideo": await abreCarpetaVideo(t.dataset.slot); break;
    case "revisarVideos": await revisaVideosDrive(false); break;
    case "prepararCarpeta":
      try{ flash("Creando carpeta…",true); await carpetaSub(S.r,"Videos"); await guardaFicha(true);
           flash("Carpeta lista"); pinta(true); }
      catch(e){ flash("No se pudo: "+corta(e.message)); }
      break;
    case "revisarVideos": await revisarVideos(true); break;
    case "salir": {
      if(S.r){ S.r.ultimaEtapa=S.etapa; await guardaFicha(true); }
      const guardada = S.r && S.indice.some(x=>x.id===S.r.id);
      S.vista="inicio"; S.r=null; pinta();
      flash(guardada?"Cambios guardados":"Ficha en blanco descartada");
      break; }
    case "bajarResumen": baja(nombreCarpeta(S.r)+"_resumen.txt", textoResumen(S.r), "text/plain"); break;
    case "bajarJson": baja(nombreCarpeta(S.r)+"_ficha.json", JSON.stringify(fichaExport(S.r),null,2), "application/json"); break;
    case "nueva": S.r=nuevaFicha(); S.vista="ficha"; S.etapa="datos"; pinta(); break;
    case "inicio": {
      const enBlanco = S.r && !S.indice.some(x=>x.id===S.r.id);
      S.vista="inicio"; S.r=null; pinta();
      if(enBlanco) flash("Ficha en blanco descartada");
      break; }
    case "verFlota": S.vista="flota"; pinta(); break;
    case "prepNone": confirmar("¿Desmarcar todos los ítems de preparación?", async()=>{ S.r.prep={}; await guardaFicha(); pinta(true); }); break;
    case "addDano": { const nd={id:uid(),zona:"",desc:"",fotos:[]}; S.r.danos.push(nd); await guardaFicha(); pinta(true);
      const c=document.querySelector(`[data-dano="${nd.id}"][data-c="zona"]`); if(c){ c.scrollIntoView({block:"center",behavior:"smooth"}); c.focus({preventScroll:true}); } break; }
    case "firmar": modalFirma(); break;
    case "resumen": modalResumen(); break;
    case "borrar": confirmar("Se elimina la ficha completa con sus fotos. No se puede deshacer.", ()=>borraFicha(S.r.id), "Eliminar"); break;
    case "cerrar": { const cerrando=S.r.estado!=="cerrado";
      if(cerrando && !S.r.ft){ S.etapa="datos"; pinta();
        flash("Falta la fecha de término");
        const f=document.querySelector('[data-set="ft"]'); if(f){ f.scrollIntoView({block:"center"}); f.focus({preventScroll:true}); }
        break; } S.r.estado=cerrando?"cerrado":"borrador"; await guardaFicha();
      if(cerrando){
        if(pendientes()){ flash("Espera a que terminen las subidas"); S.r.estado="borrador"; break; }
        const ficha=S.r;
        if(hayDrive()){ flash("Subiendo documentos…",true);
          try{ await subeDocumentos(ficha); flash("Ficha cerrada y respaldada"); }
          catch(e){ flash("Ficha cerrada, pero falló el respaldo: "+e.message); } }
        else flash("Ficha cerrada");
        S.vista="inicio"; S.r=null; pinta();
      } else pinta(true); break; }
    case "addVeh": modalVehiculo(); break;
    case "reintentar": if(VISOR){ const m=buscaMedia(VISOR.id);
        if(m){ m.estado="pendiente"; COLA.push({id:m.id,fichaId:S.r.id,slot:VISOR.slot,danoId:VISOR.danoId,media:m});
               cierraModal(); pinta(true); procesaCola(); } } break;
    case "borrarMedia": if(VISOR){ const v=VISOR; VISOR=null; cierraModal(); await quitaMedia(v.slot, v.id, v.danoId); } break;
    case "confirmarSi": if(PENDIENTE){ const f=PENDIENTE; PENDIENTE=null; cierraModal(); await f(); } break;
    case "cerrarModal": cierraModal(); break;
  }
});

let tmr;
document.addEventListener("input", ev=>{
  const el=ev.target, d=el.dataset;
  if(d.veh){ const v=S.flota.find(x=>x.patente===d.veh); if(v){ v[d.c]=el.value; clearTimeout(tmr);
    tmr=setTimeout(()=>St.set("flota",JSON.stringify(S.flota)),400);} return; }
  if(d.dano){ const x=S.r.danos.find(y=>y.id===d.dano); if(x){ x[d.c]=el.value; deb(); } return; }
  if(d.set){ const ruta=d.set.split("."); let o=S.r;
    for(let i=0;i<ruta.length-1;i++) o=o[ruta[i]];
    o[ruta.at(-1)]=el.value;
    if(d.set==="suc"||d.set==="patente"){ deb(); pinta(true); return; }
    pintaRail(); pintaPie(); deb(); }
});
function deb(){ clearTimeout(tmr); tmr=setTimeout(guardaFicha,600); }
document.addEventListener("blur", e=>{ if(S.r && e.target.dataset && (e.target.dataset.set||e.target.dataset.dano)){ clearTimeout(tmr); guardaFicha(); } }, true);
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ if(S.r){ clearTimeout(tmr); guardaFicha(); } return; }
  if(S.r && S.vista==="ficha" && S.etapa==="entrega") revisaVideosDrive(true);
});

function pedirArchivo(slot,tipo,cam,danoId){
  const inp=document.createElement("input");
  inp.type="file"; inp.multiple=true;
  inp.accept = tipo==="video" ? "video/*" : tipo==="mixto" ? "image/*,video/*" : "image/*";
  if(cam) inp.setAttribute("capture","environment");
  inp.onchange=()=>subir(slot,inp.files,danoId);
  inp.click();
}

/* ══════════ MODALES ══════════ */
let PENDIENTE=null;
const cierraModal = ()=>{ document.getElementById("modales").innerHTML=""; };
function confirmar(texto, accion, etiqueta){
  PENDIENTE=accion;
  modal(`<h3>Confirmar</h3><p style="margin:0 0 4px">${esc(texto)}</p>
    <div class="row" style="margin-top:14px"><button class="btn acento" data-act="confirmarSi" style="flex:1">${esc(etiqueta||"Sí, continuar")}</button></div>`);
}
function modalVehiculo(){
  modal(`<h3>Agregar vehículo</h3>
    <label class="f"><span>Patente</span><input type="text" id="nvPat" placeholder="Ej: SFCX21" autocapitalize="characters"></label>
    <label class="f"><span>Sucursal base</span><select id="nvSuc">${SUCURSALES.map(x=>`<option>${x}</option>`).join("")}</select></label>
    <button class="btn acento wide" id="nvOk">Agregar</button>`);
  const i=document.getElementById("nvPat"); i.focus();
  document.getElementById("nvOk").onclick=async()=>{
    const pat=i.value.toUpperCase().trim();
    if(!pat) return flash("Escribe la patente");
    if(S.flota.some(v=>v.patente===pat)) return flash("Esa patente ya existe");
    S.flota.push({patente:pat,suc:document.getElementById("nvSuc").value,mant:"",rt:"",permiso:""});
    S.flota=ordenaFlota(S.flota);
    await St.set("flota",JSON.stringify(S.flota)); cierraModal(); pinta(); flash(pat+" agregada");
  };
}
function modal(html){
  document.getElementById("modales").innerHTML =
    `<div class="modal"><div class="box">${html}
      <div class="row" style="margin-top:14px"><button class="btn ghost wide" data-act="cerrarModal">Cerrar</button></div></div></div>`;
}
function modalFirma(){
  modal(`<h3>Firma del cliente</h3><p class="hint" style="margin-bottom:8px">Firme con el dedo sobre el recuadro.</p>
    <canvas class="sig" id="sig"></canvas>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="sigClr">Borrar</button>
    <button class="btn acento" id="sigOk" style="flex:1">Guardar firma</button></div>`);
  const c=document.getElementById("sig");
  c.width=c.offsetWidth*2; c.height=c.offsetHeight*2;
  const x=c.getContext("2d"); x.scale(2,2); x.lineWidth=2.2; x.lineCap="round"; x.strokeStyle="#1A1E12";
  let dib=false, vacio=true;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener("pointerdown",e=>{dib=true;vacio=false;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))});
  c.addEventListener("pointermove",e=>{if(dib){x.lineTo(...pt(e));x.stroke()}});
  c.addEventListener("pointerup",()=>dib=false);
  document.getElementById("sigClr").onclick=()=>{x.clearRect(0,0,c.width,c.height);vacio=true};
  document.getElementById("sigOk").onclick=async()=>{
    if(vacio) return flash("La firma está vacía");
    S.r.entrega.firma=c.toDataURL("image/png");
    document.getElementById("modales").innerHTML=""; await guardaFicha(); pinta();
  };
}
function textoResumen(r){
  const L=[], [n,t]=progTotal(r);
  L.push(`CHECKLIST MOTORHOME — CAMPERSPOT ${r.suc.toUpperCase()}`);
  L.push(`Patente: ${r.patente||"—"}   Cliente: ${r.cliente||"—"}`);
  L.push(`Arriendo: ${fecha(r.fi)} → ${fecha(r.ft)}`);
  L.push(`Avance: ${Math.round(n/t*100)}%   Estado: ${r.estado}`);
  L.push(`Adicionales: ${(r.adicionales||[]).length?r.adicionales.join(", "):"—"}`);
  if(r.obs) L.push(`Observaciones: ${r.obs}`);
  const itp=itemsPrep(r), pend=itp.filter(x=>!r.prep[x.k]);
  L.push(``,`PREPARACIÓN: ${itp.length-pend.length}/${itp.length}`);
  if(pend.length) L.push(`Pendiente: ${pend.map(x=>x.t+(x.adic?" (adicional)":"")).join(", ")}`);
  if(r.prepNota) L.push(`Nota: ${r.prepNota}`);
  L.push(``,`ENTREGA`,`Millaje de salida: ${r.entrega.km||"—"}`);
  L.push(`Videos del recorrido: ${cuentaVideos(r)} de 3`);
  L.push(`Foto al tablero: ${(r.media.f_tab_s||[]).length?"sí":"pendiente"}`);
  L.push(`Firma del cliente: ${r.entrega.firma?"registrada":"pendiente"}`);
  L.push(``,`REVISIÓN`);
  REV_GRUPOS.forEach(g=>{
    const its=itemsRev(g,r);
    const mal=its.map(x=>({t:x.t+(x.adic?" (adicional)":""),v:r.rev[x.k],nota:r.revNota[x.k],
      n:(r.media["rev:"+x.k]||[]).length})).filter(x=>x.v==="dano"||x.n);
    const ok=its.filter(x=>r.rev[x.k]==="ok").length;
    L.push(`${g.t}: ${ok}/${its.length} OK`);
    mal.forEach(x=>L.push(`  · ${x.t} — DAÑO${x.nota?": "+x.nota:""}${x.n?` [${x.n} respaldo/s]`:" [sin respaldo]"}`));
  });
  L.push(``,`REPORTE FINAL`);
  const uso=(+r.reporte.km||0)-(+r.entrega.km||0);
  L.push(`Millaje de llegada: ${r.reporte.km||"—"}   Uso: ${uso>0?uso.toLocaleString("es-CL"):"—"}`);
  L.push(`Bencina: ${r.reporte.bencina||"—"}   Pedir gas: ${r.reporte.gas||"0"}`);
  const hs=hallazgos(r);
  L.push(``,`RESUMEN DE DAÑOS: ${hs.length+r.danos.length} hallazgo(s)`);
  hs.forEach(h=>L.push(`  · ${h.t} (${h.grupo}) — DAÑO${h.nota?": "+h.nota:""} [${h.media.length} respaldo/s]`));
  r.danos.forEach(d=>L.push(`  · ${d.zona||"sin zona"}: ${d.desc||"sin descripción"} [${(d.fotos||[]).length} respaldo/s]`));
  if(!hs.length&&!r.danos.length) L.push(`  Sin daños registrados.`);
  if(r.reporte.nota) L.push(`Comentario: ${r.reporte.nota}`);
  return L.join("\n");
}
function modalResumen(){
  const txt=textoResumen(S.r);
  modal(`<h3>Resumen de la ficha</h3><pre class="res" id="res">${esc(txt)}</pre>
    <div class="row" style="margin-top:10px"><button class="btn acento" id="copiar" style="flex:1">Copiar para WhatsApp</button>
    <button class="btn ghost" id="imprimir">Imprimir</button></div>`);
  document.getElementById("copiar").onclick=async()=>{
    try{ await navigator.clipboard.writeText(txt); flash("Resumen copiado"); }
    catch(e){ const p=document.getElementById("res"); const s=getSelection();
      s.removeAllRanges(); const rg=document.createRange(); rg.selectNodeContents(p); s.addRange(rg);
      flash("Selecciónalo y copia con Ctrl+C"); }
  };
  document.getElementById("imprimir").onclick=()=>window.print();
}
async function copiar(txt,msg){
  try{ await navigator.clipboard.writeText(txt); flash(msg||"Copiado"); }
  catch(e){ modal(`<h3>Copia esto</h3><pre class="res">${esc(txt)}</pre>`); }
}
function baja(nombre,contenido,tipo){
  try{
    const b=new Blob([contenido],{type:tipo}), u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=nombre; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),3000); flash("Descargando "+nombre);
  }catch(e){ modal(`<h3>${esc(nombre)}</h3><pre class="res">${esc(contenido)}</pre>`); }
}
function fichaExport(r){
  const ru=rutas(r), ar=archivosDe(r);
  const {media, ...resto}=r;
  return {...resto, rutas:ru, archivos:ar, exportado:new Date().toISOString()};
}
function flash(msg,fijo){
  let e=document.getElementById("flash");
  if(!e){ e=document.createElement("div"); e.id="flash";
    e.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#26380B;color:#fff;padding:9px 15px;border-radius:4px;font-size:14px;z-index:80;pointer-events:none";
    document.body.appendChild(e); }
  e.textContent=msg; e.style.opacity="1";
  clearTimeout(e._t); if(!fijo) e._t=setTimeout(()=>e.style.opacity="0",1900);
}

(function(){ const l=document.querySelector(".logo");
  if(l){ const k=document.createElement("link"); k.rel="icon"; k.href=l.src; document.head.appendChild(k); } })();
window.addEventListener("beforeunload", e=>{
  if(pendientes()){ e.preventDefault(); e.returnValue=""; }
});
bootstrap();
</script>
