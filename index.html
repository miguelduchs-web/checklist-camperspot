const TIPOS = [
  {k:"reparacion", t:"Reparación"},
  {k:"mantencion", t:"Mantención"},
  {k:"permiso",    t:"Documentos"},
  {k:"otro",       t:"Otro"},
];
const ESTADOS = [
  {k:"pendiente", t:"Pendiente"},
  {k:"curso",     t:"En curso"},
  {k:"listo",     t:"Resuelta"},
];
const tTipo   = k => (TIPOS.find(x=>x.k===k)||{t:"Otro"}).t;
const tEstado = k => (ESTADOS.find(x=>x.k===k)||{t:"Pendiente"}).t;

let FLOTA = { v:1, act:0, veh:{}, tareas:[], bajas:{} };
let FLOTA_SYNC = { subiendo:false, sucio:false, ultimo:0, error:"" };

const listaFlota = () => ordenaFlota(Object.values(FLOTA.veh||{}));
const tareasDe = (patente, estado) => FLOTA.tareas
  .filter(t=>t.patente===patente && (!estado || (estado==="abiertas" ? t.estado!=="listo" : t.estado===estado)))
  .sort((a,b)=>(b.creado||0)-(a.creado||0));
const abiertasDe = p => FLOTA.tareas.filter(t=>t.patente===p && t.estado!=="listo").length;
/* Un documento avisa 45 días antes de vencer, no el día después */
const porVencer = d => { if(!d || d < hoy()) return false;
  return (new Date(d) - new Date(hoy())) / 86400000 <= 45; };

/* Fusión: las tareas se unen por id y gana la versión más reciente.
   Así, si uno agrega y otro cierra al mismo tiempo, no se pierde ninguna. */
function fusiona(local, remoto){
  if(!remoto || !remoto.tareas) return local;
  const out = { v:1, act:Math.max(local.act||0, remoto.act||0), veh:{}, tareas:[], bajas:{} };

  /* Sin dejar constancia de lo borrado, la fusión lo revive desde el otro lado */
  const bajas = {};
  for(const [k,t] of Object.entries({...(remoto.bajas||{}), ...(local.bajas||{})}))
    bajas[k] = Math.max(t, ((remoto.bajas||{})[k]||0), ((local.bajas||{})[k]||0));
  const limite = Date.now() - 180*86400000;
  for(const [k,t] of Object.entries(bajas)) if(t > limite) out.bajas[k] = t;

  const patentes = new Set([...Object.keys(local.veh||{}), ...Object.keys(remoto.veh||{})]);
  for(const p of patentes){
    const a=(local.veh||{})[p], b=(remoto.veh||{})[p];
    const base0 = !a ? b : !b ? a
      : a.provisional && !b.provisional ? b
      : b.provisional && !a.provisional ? a
      : ((a.act||0) >= (b.act||0) ? {...b,...a} : {...a,...b});
    if(out.bajas["v:"+p] && out.bajas["v:"+p] >= (base0.act||0)) continue;
    const base = {...base0};
    if(a && b){
      const km = Math.max(Number(a.km)||0, Number(b.km)||0);   // el millaje solo sube
      if(km) base.km = km; else delete base.km;
    }
    out.veh[p]=base;
  }

  const mapa = new Map();
  for(const t of [...(remoto.tareas||[]), ...(local.tareas||[])]){
    const prev = mapa.get(t.id);
    if(!prev || (t.act||0) >= (prev.act||0)) mapa.set(t.id, t);
  }
  for(const [id,t] of [...mapa])
    if(out.bajas["t:"+id] && out.bajas["t:"+id] >= (t.act||0)) mapa.delete(id);
  out.tareas = [...mapa.values()];
  return out;
}

async function cargaFlota(){
  const raw = await St.get("flotaEstado");
  if(raw){ try{ FLOTA = JSON.parse(raw); }catch(e){} }
  FLOTA.veh = FLOTA.veh || {}; FLOTA.tareas = FLOTA.tareas || []; FLOTA.bajas = FLOTA.bajas || {};
  const bajo = await bajaFlota(true);
  /* Los vehículos de fábrica se siembran con act:0 a propósito: son un relleno
     provisional para que la app no se vea vacía, y NUNCA deben ganarle a un dato
     real al fusionar. Con una marca de tiempo actual sobrescribían Drive. */
  if(!Object.keys(FLOTA.veh).length){
    FLOTA_BASE.forEach(v=>{ FLOTA.veh[v.patente] = {...v, act:0, provisional:true}; });
    await St.set("flotaEstado", JSON.stringify(FLOTA));   // local, sin subir
  }
  /* Un vehículo guardado antes de que existieran los tipos, o creado a mano
     sin elegirlo, queda sin tipo. Se le pone el de la lista de fábrica si lo
     conocemos; si no, motorhome, que es lo que había hasta ahora. */
  let arreglados = 0;
  for(const v of Object.values(FLOTA.veh)){
    if(v.tipo) continue;
    v.tipo = (FLOTA_BASE.find(x=>x.patente===v.patente)||{}).tipo || "mh";
    if(!v.provisional){ v.sucio = true; arreglados++; }
  }
  if(arreglados){ await St.set("flotaEstado", JSON.stringify(FLOTA)); subeFlota(); }
}

async function bajaFlotaDrive(silencioso){
  if(!hayDrive() || !navigator.onLine) return false;
  try{
    const d = await api("/estado");
    if(d && d.contenido) FLOTA = fusiona(FLOTA, d.contenido);
    FLOTA_SYNC.ultimo = Date.now(); FLOTA_SYNC.error = "";
    await St.set("flotaEstado", JSON.stringify(FLOTA));
    if(FLOTA_SYNC.sucio) await subeFlota();
    if(!silencioso) flash("Flota actualizada");
    if(S.vista==="flota"||S.vista==="vehiculo") pinta(true);
    return true;
  }catch(e){
    FLOTA_SYNC.error = corta(e.message||e);
    if(!silencioso) flash("No se pudo leer la flota: "+FLOTA_SYNC.error);
    return false;
  }
}

async function guardaFlota(){
  FLOTA.act = Date.now();
  await St.set("flotaEstado", JSON.stringify(FLOTA));
  FLOTA_SYNC.sucio = true;
  if(S.vista==="vehiculo") pintaPieVeh();
  clearTimeout(guardaFlota._t);
  guardaFlota._t = setTimeout(subeFlota, 700);
}

async function subeFlotaDrive(){
  if(!hayDrive() || !navigator.onLine || FLOTA_SYNC.subiendo) return;
  const soloRelleno = Object.values(FLOTA.veh||{}).every(v=>v.provisional)
                      && !FLOTA.tareas.length;
  if(soloRelleno){ FLOTA_SYNC.sucio = false; return; }
  FLOTA_SYNC.subiendo = true;
  try{
    const d = await api("/estado");                       // fusionar antes de escribir
    if(d && d.contenido) FLOTA = fusiona(FLOTA, d.contenido);
    await api("/estado", { contenido: FLOTA });
    await St.set("flotaEstado", JSON.stringify(FLOTA));
    FLOTA_SYNC.sucio = false; FLOTA_SYNC.ultimo = Date.now();
  }catch(e){
    FLOTA_SYNC.sucio = true;                              // se reintenta al volver la señal
  }finally{
    FLOTA_SYNC.subiendo = false;
    if(S.vista==="vehiculo") pintaPieVeh();
  }
}

/* ══════════════════════════════════════════════════════════════════
   DATOS DE OPERACIÓN EN LA BASE (D1)

   Reemplaza el índice y el archivo de flota que vivían en Drive. La
   diferencia de fondo: aquí hay UNA copia y el servidor manda. Pone la
   hora (los relojes de los equipos ya no compiten) y lleva el número
   de versión de cada fila, así que si dos personas editan lo mismo se
   detecta de verdad en vez de que una pise a la otra en silencio.

   Drive sigue guardando fotos, videos y un ficha.json por arriendo.
   IndexedDB sigue siendo la copia para trabajar sin señal.

   Si la base no está conectada, todo cae al camino antiguo de Drive,
   para que la app nunca quede inutilizable.
   ══════════════════════════════════════════════════════════════════ */

let BD = {
  hay: null,              // null = no se ha probado todavía
  desde: 0,               // hora del último cambio que ya trajimos
  equipo: "",             // este dispositivo, para saber quién escribió
  pend: { arriendos:new Set(), vehiculos:new Set(), tareas:new Set() },
  choques: new Set(),     // filas que otra persona guardó después que nosotros
  forzar: false,          // true mientras corre un guardado explícito
  subiendo: false,
  error: "",
  importado: false,
};

function nombreEquipo(){
  if(BD.equipo) return BD.equipo;
  const ua = navigator.userAgent||"";
  BD.equipo = (/iPhone|iPad|Android/i.test(ua) ? "telefono" : "computador")
              + "-" + Math.random().toString(36).slice(2,6);
  return BD.equipo;
}

/* ¿Hay base conectada? Se pregunta una vez por sesión. */
async function hayBase(){
  if(BD.hay !== null) return BD.hay;
  if(!hayDrive() || !navigator.onLine) return false;
  try{
    const d = await api("/db/estado");
    BD.hay = !!(d && d.ok && d.tablas);        // una respuesta reconocible, no cualquier ok
    if(d && d.importado) BD.importado = true;
  }catch(e){
    BD.hay = false;                     // Worker viejo o base sin vincular
  }
  return BD.hay;
}

/* ---------- traer lo que cambió ---------- */
async function bajaDeBase(silencioso){
  let refrescarFicha = false;
  /* Se pide con dos segundos de traslape. Un cambio que ocurra en el mismo
     milisegundo que la respuesta anterior quedaba justo en el borde y ese
     dispositivo no lo veía nunca más. Volver a aplicar algo ya aplicado no
     tiene efecto, así que el traslape sale gratis. */
  const d = await api("/db/cambios?desde="+Math.max(0, BD.desde - 2000));
  let nuevos = 0;

  for(const f of d.arriendos||[]){
    const i = S.indice.findIndex(x=>x.id===f.id);
    if(f.borrado){
      if(i>=0) S.indice.splice(i,1);
      await St.del("r:"+f.id);
      if(S.r && S.r.id===f.id){ S.r=null; if(S.vista==="ficha") S.vista="inicio"; }
      continue;
    }
    /* Si aquí hay cambios sin mandar, lo del servidor no se aplica: primero
       suben los nuestros y el servidor decide con el número de versión.
       Se miran las dos colas, porque un cambio recién escrito todavía puede
       estar en la de Drive y no haber pasado a la de la base. */
    if(BD.pend.arriendos.has(f.id) || SYNC.pendientes.has(f.id)) continue;
    const r = { ...(f.datos||{}), id:f.id, ver:f.ver };
    await St.set("r:"+f.id, JSON.stringify(r));
    const res = { ...resumenDe(r), ver:f.ver, act:f.act };
    if(i<0){ S.indice.unshift(res); nuevos++; } else S.indice[i] = res;
    /* La ficha abierta se refresca sola, pero NUNCA encima de algo escrito
       que aún no alcanzó a guardarse: entre tecla y guardado hay medio
       segundo, y ahí se podía perder lo recién escrito. */
    if(S.r && S.r.id===f.id && !hayCambios()){
      S.r = r;
      S.original = JSON.stringify(r);
      refrescarFicha = true;
    }
  }

  for(const f of d.vehiculos||[]){
    if(f.borrado){ delete FLOTA.veh[f.patente]; continue; }
    if(BD.pend.vehiculos.has(f.patente)) continue;      // lo nuestro aún no sube
    FLOTA.veh[f.patente] = { ...(f.datos||{}), patente:f.patente,
                             suc:f.suc||"Santiago", ver:f.ver, act:f.act };
  }

  for(const f of d.tareas||[]){
    const i = (FLOTA.tareas||[]).findIndex(t=>t.id===f.id);
    if(f.borrado){ if(i>=0) FLOTA.tareas.splice(i,1); continue; }
    if(BD.pend.tareas.has(f.id)) continue;
    const t = { ...(f.datos||{}), id:f.id, patente:f.patente,
                estado:f.estado, tipo:f.tipo, ver:f.ver, act:f.act };
    if(i<0) FLOTA.tareas.push(t); else FLOTA.tareas[i] = t;
  }

  BD.desde = d.hora || BD.desde;
  BD.error = ""; SYNC.error = ""; FLOTA_SYNC.error = "";
  SYNC.ultimo = Date.now(); FLOTA_SYNC.ultimo = Date.now();
  await guardaIndice();
  await St.set("flotaEstado", JSON.stringify(FLOTA));
  await St.set("bdDesde", String(BD.desde));
  if(!silencioso) flash(nuevos ? nuevos+" arriendo(s) nuevo(s)" : "Al día");
  /* Si cambió la ficha que alguien tiene en pantalla, se repinta para que no
     siga mirando datos viejos. pinta(true) ya se aguanta si hay un campo con
     el cursor puesto, así no se cierra el teclado a media palabra. */
  if(/^(inicio|archivo|flota|vehiculo)$/.test(S.vista) || (S.vista==="ficha" && refrescarFicha))
    pinta(true);
  return nuevos;
}

/* ---------- mandar lo que falta ---------- */
async function subeABase(){
  if(BD.subiendo) return false;
  BD.subiendo = true;
  BD.choques.clear();
  try{
    if(BD.pend.arriendos.size){
      const filas = [];
      for(const id of [...BD.pend.arriendos]){
        const raw = await St.get("r:"+id);
        if(!raw){ BD.pend.arriendos.delete(id); continue; }
        const r = JSON.parse(raw);
        if(!r.patente && !r.cliente){ BD.pend.arriendos.delete(id); continue; }
        const {ultimaEtapa, ...compartido} = r;        // la pestaña no se comparte
        filas.push({ id, suc:r.suc, patente:r.patente, cliente:r.cliente, fi:r.fi, ft:r.ft,
                     estado:r.estado, carpeta:nombreCarpeta(r), drive_id:r.driveCarpeta||"",
                     ver:Number(r.ver)||0, datos:compartido });
      }
      if(filas.length) await mandaFilas("arriendos", filas, "id", BD.pend.arriendos);
    }

    /* Los vehículos provisionales de fábrica NUNCA se mandan: son relleno
       para que la app no se vea vacía y no deben pisar datos reales. */
    const veh = Object.values(FLOTA.veh||{})
      .filter(v=>BD.pend.vehiculos.has(v.patente) && !v.provisional);
    if(veh.length) await mandaFilas("vehiculos",
      veh.map(v=>({ patente:v.patente, suc:v.suc, ver:Number(v.ver)||0, datos:v })),
      "patente", BD.pend.vehiculos);

    const tar = (FLOTA.tareas||[]).filter(t=>BD.pend.tareas.has(t.id));
    if(tar.length) await mandaFilas("tareas",
      tar.map(t=>({ id:t.id, patente:t.patente, estado:t.estado, tipo:t.tipo,
                    ver:Number(t.ver)||0, datos:t })),
      "id", BD.pend.tareas);

    BD.error = ""; SYNC.error = ""; FLOTA_SYNC.error = "";
    if(!BD.pend.arriendos.size) SYNC.ultimo = Date.now();
    if(!BD.pend.vehiculos.size && !BD.pend.tareas.size){
      FLOTA_SYNC.sucio = false; FLOTA_SYNC.ultimo = Date.now();
    }
    return true;
  }catch(e){
    BD.error = corta(e.message||e); SYNC.error = BD.error;
    return false;
  }finally{
    BD.subiendo = false;
    try{ await St.set("bdPend", JSON.stringify({ arriendos:[...BD.pend.arriendos],
      vehiculos:[...BD.pend.vehiculos], tareas:[...BD.pend.tareas] })); }catch(e){}
  }
}

/* Fusión de tres vías para que un guardado explícito nunca sea rechazado
   y tampoco borre el trabajo ajeno.

     base  = cómo estaba la ficha cuando ESTE equipo la abrió
     mio   = cómo está ahora aquí
     suyo  = lo que tiene el servidor

   Regla: si yo cambié un campo, manda el mío; si no lo toqué, se respeta el
   del servidor. En preparación y revisión se compara casilla por casilla,
   así dos personas marcando cosas distintas no se pisan.
   Sin base (la ficha no estaba abierta aquí) gana lo mío, que es lo que
   significa apretar Guardar. */
const esMapa = v => v && typeof v==="object" && !Array.isArray(v);
const igual  = (a,b) => JSON.stringify(a===undefined?null:a) === JSON.stringify(b===undefined?null:b);

function fusionaFicha(base, mio, suyo){
  const out = { ...(suyo||{}) };
  for(const k of new Set([...Object.keys(mio||{}), ...Object.keys(suyo||{})])){
    if(k==="ver" || k==="act" || k==="ultimaEtapa") continue;
    const b = base ? base[k] : undefined;
    const m = (mio||{})[k], y = (suyo||{})[k];
    if(igual(m, b)) continue;                       // yo no lo toqué: queda lo suyo
    if(esMapa(m) && esMapa(y)){                     // prep, rev, entrega, reporte
      const mezcla = { ...y };
      for(const kk of new Set([...Object.keys(m), ...Object.keys(esMapa(b)?b:{})])){
        const bb = esMapa(b) ? b[kk] : undefined;
        if(!igual(m[kk], bb)) mezcla[kk] = m[kk];   // solo lo que cambié yo
      }
      out[k] = mezcla;
    }else out[k] = m;
  }
  return out;
}

async function mandaFilas(tabla, filas, llave, pendientes, reintento){
  const d = await api("/db/guardar", { tabla, filas, equipo:nombreEquipo() });
  for(const g of d.guardadas||[]){
    pendientes.delete(g[llave]);
    await anotaVersion(tabla, g[llave], g.ver, g.act);
  }
  /* Choque: alguien guardó esto mismo después que nosotros. */
  const rehacer = [];
  for(const c of d.choques||[]){
    pendientes.delete(c[llave]);
    /* Guardado explícito: se funde con lo del servidor y se reintenta una
       vez. Así apretar Guardar siempre queda, sin borrar lo del otro. */
    if(tabla==="arriendos" && BD.forzar && !reintento && c.suyo){
      const mia = filas.find(f=>f[llave]===c[llave]);
      if(mia){
        const base = (S.original && S.r && S.r.id===c[llave]) ? JSON.parse(S.original) : null;
        rehacer.push({ ...mia, ver:c.suyo.ver,
                       datos: fusionaFicha(base, mia.datos, c.suyo.datos||{}) });
        continue;
      }
    }
    BD.choques.add(c[llave]);
    if(tabla==="arriendos" && c.suyo)
      avisaChoque(c[llave], { ...(c.suyo.datos||{}), ver:c.suyo.ver, act:c.suyo.act });
    else if(c.suyo)
      await anotaVersion(tabla, c[llave], c.suyo.ver, c.suyo.act, c.suyo.datos);
  }
  if(rehacer.length){
    await mandaFilas(tabla, rehacer, llave, pendientes, true);
    /* La ficha fundida pasa a ser la de este equipo */
    for(const f of rehacer){
      const id = f[llave];
      if(BD.choques.has(id)) continue;                    // el reintento tampoco pudo
      const guardada = { ...f.datos, id };
      const previo = await St.get("r:"+id);
      if(previo){ try{ guardada.ver = JSON.parse(previo).ver; }catch(e){} }
      await St.set("r:"+id, JSON.stringify(guardada));
      if(S.r && S.r.id===id){ S.r = { ...guardada, ultimaEtapa:S.etapa }; S.original = JSON.stringify(guardada); }
      const i = S.indice.findIndex(x=>x.id===id);
      if(i>=0) S.indice[i] = { ...resumenDe(guardada), ver:S.indice[i].ver, act:S.indice[i].act };
    }
    await guardaIndice();
  }
}

async function anotaVersion(tabla, llave, ver, act, datos){
  if(tabla==="arriendos"){
    const raw = await St.get("r:"+llave);
    if(raw){ const r = JSON.parse(raw); r.ver = ver;
             await St.set("r:"+llave, JSON.stringify(r));
             if(S.r && S.r.id===llave) S.r.ver = ver; }
    const i = S.indice.findIndex(x=>x.id===llave);
    if(i>=0){ S.indice[i].ver = ver; S.indice[i].act = act; }
    await guardaIndice();
  } else if(tabla==="vehiculos"){
    const v = FLOTA.veh[llave];
    if(v) Object.assign(v, datos||{}, { ver, act, sucio:false });
  } else {
    const t = (FLOTA.tareas||[]).find(x=>x.id===llave);
    if(t) Object.assign(t, datos||{}, { ver, act, sucio:false });
  }
}

/* ---------- carga inicial, una sola vez ---------- */
async function importaABase(){
  if(BD.importado) return false;
  const arriendos = [];
  for(const res of S.indice){
    const raw = await St.get("r:"+res.id);
    if(!raw) continue;
    const r = JSON.parse(raw);
    arriendos.push({ id:r.id, suc:r.suc, patente:r.patente, cliente:r.cliente,
                     fi:r.fi, ft:r.ft, estado:r.estado, carpeta:nombreCarpeta(r),
                     drive_id:r.driveCarpeta||"", datos:r });
  }
  const vehiculos = Object.values(FLOTA.veh||{}).filter(v=>!v.provisional)
    .map(v=>({ patente:v.patente, suc:v.suc, datos:v }));
  const tareas = (FLOTA.tareas||[])
    .map(t=>({ id:t.id, patente:t.patente, estado:t.estado, tipo:t.tipo, datos:t }));
  BD.importado = true;                        // se intenta una sola vez por sesión
  if(!arriendos.length && !vehiculos.length && !tareas.length) return false;
  try{
    const d = await api("/db/importar", { arriendos, vehiculos, tareas });
    const n = d.importado||{};
    flash("Datos cargados a la base: "+(n.arriendos||0)+" arriendo(s), "
          +(n.vehiculos||0)+" vehículo(s), "+(n.tareas||0)+" tarea(s)");
    return true;
  }catch(e){
    /* Ya se había importado: otro equipo subió los datos primero y a
       este le toca bajarlos. No es un error. */
    return false;
  }
}

/* Borrar en la base es marcar la fila, así el borrado alcanza a los
   otros dispositivos. Antes esto se hacía con "lápidas" locales y por eso
   las tareas borradas reaparecían. */
async function borraEnBase(tabla, llaves){
  const lista = (llaves||[]).filter(Boolean);
  if(!lista.length) return;
  for(const k of lista){ BD.pend.vehiculos.delete(k); BD.pend.tareas.delete(k); }
  if(!(await hayBase())) return;
  try{ await api("/db/borrar", { tabla, llaves:lista, equipo:nombreEquipo() }); }
  catch(e){ flash("Se borró aquí, pero no se pudo avisar al servidor: "+corta(e.message||e)); }
}

/* ---------- despachadores: la base si está, Drive si no ---------- */
/* Una sola sincronización a la vez. Al revisar cada 10 segundos, con red
   lenta una consulta puede no haber terminado cuando parte la siguiente:
   las dos moverían el corte de tiempo y podrían aplicar cambios encima de
   la otra. La segunda llamada espera a la primera en vez de competir. */
let BAJADA_EN_VUELO = null;
async function bajaArriendos(silencioso){
  if(!(await hayBase())) return bajaArriendosDrive(silencioso);
  if(BAJADA_EN_VUELO) return BAJADA_EN_VUELO;
  BAJADA_EN_VUELO = bajaArriendosYa(silencioso);
  try{ return await BAJADA_EN_VUELO; }
  finally{ BAJADA_EN_VUELO = null; }
}
async function bajaArriendosYa(silencioso){
  try{
    if(!BD.importado) await importaABase();
    await bajaDeBase(silencioso);
    if(BD.pend.arriendos.size || BD.pend.vehiculos.size || BD.pend.tareas.size)
      await subeABase();
    return true;
  }catch(e){
    BD.error = corta(e.message||e); SYNC.error = BD.error;
    if(!silencioso) flash("No se pudo sincronizar: "+BD.error);
    return false;
  }
}
async function subeArriendosSegunDestino(){
  if(!(await hayBase())) return subeArriendosDrive();
  for(const id of SYNC.pendientes) BD.pend.arriendos.add(id);
  SYNC.pendientes.clear();
  const ok = await subeABase();
  /* Lo que no se pudo mandar vuelve a la cola que muestra el pie */
  for(const id of BD.pend.arriendos) SYNC.pendientes.add(id);
  if(ok) await respaldaEnDrive();
  return ok;
}
async function bajaFlota(silencioso){
  if(!(await hayBase())) return bajaFlotaDrive(silencioso);
  return bajaArriendos(silencioso);          // una sola llamada trae todo
}
async function subeFlota(){
  if(!(await hayBase())) return subeFlotaDrive();
  /* Solo lo que cambió. Mandar los cinco vehículos en cada sincronización
     les subía la versión sin motivo y hacía rebotar cambios entre equipos. */
  for(const v of Object.values(FLOTA.veh||{}))
    if(!v.provisional && v.sucio) BD.pend.vehiculos.add(v.patente);
  for(const t of FLOTA.tareas||[]) if(t.sucio) BD.pend.tareas.add(t.id);
  return subeABase();
}

/* El respaldo legible en Drive: un ficha.json por arriendo. No es la
   fuente de verdad, pero deja todo revisable desde Drive. */
async function respaldaEnDrive(){
  if(!hayDrive() || !navigator.onLine || !S.r) return;
  try{
    const carp = await carpetaSub(S.r, "Ficha");
    await api("/json", { carpetaId:carp, nombre:"ficha.json", contenido:S.r });
  }catch(e){ /* el respaldo nunca debe hacer fallar el guardado */ }
}

function nuevaTarea(patente, datos){
  const t = { id:uid(), patente, tipo:"reparacion", titulo:"", detalle:"", estado:"pendiente",
              fotos:[], creado:Date.now(), act:Date.now(), sucio:true, ...datos };
  FLOTA.tareas.push(t);
  guardaFlota();
  return t;
}
/* Las fotos se leen del disco solo al abrir la tarea, no al entrar al vehículo:
   un historial de años no tiene por qué cargarse entero en memoria. */
async function cargaFotosTarea(id){
  const t = FLOTA.tareas.find(x=>x.id===id); if(!t) return;

  /* Una tarea guarda una COPIA de la referencia a sus fotos. Si nació
     mientras la foto todavía subía, quedó sin identificador de Drive. En vez
     de esperar a que el equipo que la sacó la actualice, se busca el dato
     actual en el arriendo de origen: así se repara en cualquier dispositivo
     que tenga ese arriendo. */
  const fichaId = t.origen && t.origen.fichaId;
  if(fichaId && (t.fotos||[]).some(f=>!f.driveId)){
    try{
      const raw = await St.get("r:"+fichaId);
      if(raw){
        const r = JSON.parse(raw), todas = [];
        for(const k of Object.keys(r.media||{})) todas.push(...(r.media[k]||[]));
        for(const d of r.danos||[]) todas.push(...(d.fotos||[]));
        let cambio = false;
        for(const f of t.fotos||[]){
          if(f.driveId) continue;
          const m = todas.find(x=>x.id===f.id);
          if(m && m.driveId){ f.driveId = m.driveId; cambio = true; }
        }
        if(cambio){ t.act=Date.now(); t.sucio=true; guardaFlota(); }
      }
    }catch(e){}
  }

  for(const f of t.fotos||[])
    if(!FOTOS[f.id]){ const x=await St.get("f:"+f.id); if(x) FOTOS[f.id]=x; }
}

/* Una tarea resuelta cuyas fotos ya están en Drive no necesita copia local.
   Se siguen viendo desde la ficha, abriéndolas en Drive. */
async function liberaFotosViejas(){
  const limite = Date.now() - 30*86400000;
  let n = 0;
  for(const t of FLOTA.tareas){
    if(t.estado !== "listo" || !t.cerrado || t.cerrado > limite) continue;
    for(const f of t.fotos||[]){
      if(!f.driveId || f.local === false) continue;
      await St.del("f:"+f.id); delete FOTOS[f.id];
      f.local = false; n++;
    }
  }
  if(n) await guardaFlota();
  return n;
}

async function tocaTarea(id, cambios){
  const t = FLOTA.tareas.find(x=>x.id===id); if(!t) return null;
  Object.assign(t, cambios, { act:Date.now(), auto:false, sucio:true });
  await guardaFlota();
  return t;
}


/* Lo que conviene revisar antes de cerrar. No bloquea salvo la fecha de
   término, de la que depende el nombre de la carpeta y la purga de videos. */
function faltantes(r){
  const out = [];
  if(!r.patente) out.push({bloquea:true, etapa:"datos", t:"Falta elegir la patente"});
  if(!r.cliente) out.push({bloquea:false, etapa:"datos", t:"Falta el nombre del cliente"});
  const[np,tp] = prog(r,"prep");
  if(np < tp) out.push({bloquea:false, etapa:"prep", t:`Preparación incompleta (${np} de ${tp})`});
  const faltanVid = SLOTS_VIDEO.filter(def=>!videosDe(r,def.k).length).map(def=>def.t);
  if(faltanVid.length) out.push({bloquea:false, etapa:"entrega", t:"Sin video de "+faltanVid.join(", ")});
  if(cfgTipo(r).millaje && !r.entrega.km)
    out.push({bloquea:false, etapa:"entrega", t:"Falta el millaje de salida"});
  if(cfgTipo(r).tablero && !(r.media.f_tab_s||[]).length)
    out.push({bloquea:false, etapa:"entrega", t:"Falta la foto del tablero de salida"});
  const revTot = gruposRev(r).reduce((a,g)=>a+itemsRev(g,r).length,0);
  const revHechos = gruposRev(r).reduce((a,g)=>a+itemsRev(g,r).filter(x=>r.rev[x.k]).length,0);
  if(revHechos < revTot) out.push({bloquea:false, etapa:"revision", t:`Revisión incompleta (${revHechos} de ${revTot})`});
  if(cfgTipo(r).millaje && !r.reporte.km)
    out.push({bloquea:false, etapa:"reporte", t:"Falta el millaje de llegada"});
  const salida = Number(r.entrega.km)||0, llegada = Number(r.reporte.km)||0;
  if(salida && llegada && llegada < salida)
    out.push({bloquea:false, etapa:"reporte", t:"El millaje de llegada es menor que el de salida"});
  if(!r.reporte.bencina) out.push({bloquea:false, etapa:"reporte", t:"Falta el estado de bencina"});
  return out;
}

/* ══════════ PUENTE ENTRE ARRIENDOS Y FLOTA ══════════ */

/* El millaje de llegada pasa a ser el millaje actual del vehículo.
   Solo sube: un error de tipeo hacia abajo no borra el kilometraje real. */
/* El millaje del vehículo se actualiza con la lectura más alta del
   arriendo, venga de la salida o de la llegada. Nunca retrocede: si
   alguien escribe un número menor al que ya tiene la flota, se ignora. */
async function millajeAFlota(r){
  if(!cfgTipo(r).millaje) return false;      // una casa rodante no lleva millaje
  const salida  = Number(r.entrega && r.entrega.km) || 0;
  const llegada = Number(r.reporte && r.reporte.km) || 0;
  const km = Math.max(salida, llegada);
  if(!km || !r.patente) return false;
  const v = FLOTA.veh[r.patente];
  if(!v || km <= (Number(v.km)||0)) return false;
  v.km = km;
  v.kmFecha = (llegada >= salida ? r.ft : r.fi) || hoy();
  v.act = Date.now();
  v.sucio = true;                       // sin esto no viaja a los otros equipos
  S.flota = listaFlota();
  await guardaFlota();
  return true;
}

/* Cada daño del arriendo se convierte en una reparación pendiente.
   La clave de origen evita duplicar si se cierra el arriendo dos veces. */
async function danosAFlota(r){
  if(!r.patente) return 0;
  const arriendo = nombreCarpeta(r);
  const previas = new Map(FLOTA.tareas.filter(t=>t.origen&&t.origen.clave).map(t=>[t.origen.clave,t]));
  const vigentes = new Set();
  let n = 0, cambio = false;

  const sincroniza = (clave, titulo, detalle, media) => {
    vigentes.add(clave);
    const fotos = (media||[]).filter(m=>m.driveId||FOTOS[m.id])
                             .map(m=>({ id:m.id, nombre:m.nombre||"", driveId:m.driveId||"" }));
    const ya = previas.get(clave);
    if(!ya){
      FLOTA.tareas.push({ id:uid(), patente:r.patente, tipo:"reparacion",
        titulo, detalle: detalle||"", estado:"pendiente", auto:true, fotos,
        origen:{ clave, fichaId:r.id, arriendo, carpetaId:r.driveCarpeta||"" },
        creado:Date.now(), act:Date.now(), sucio:true });
      n++; cambio = true;
      return;
    }
    /* Si nadie la editó a mano, se mantiene al día con lo que dice la revisión */
    if(ya.auto && ya.estado === "pendiente"){
      /* Se comparan los identificadores de Drive, no solo CUÁNTAS fotos hay.
         Una tarea se crea mientras la foto todavía sube, así que nace sin
         identificador; al terminar la subida la cantidad no cambia, y antes
         la tarea se quedaba con el hueco para siempre: en el equipo que sacó
         la foto se veía bien, en los demás decía "Foto no disponible". */
      const mismas = (a,b) => a.length===b.length &&
        a.every((x,i)=> x.id===b[i].id && (x.driveId||"")===(b[i].driveId||""));
      const distinto = ya.titulo!==titulo || (ya.detalle||"")!==(detalle||"") ||
                       !mismas(ya.fotos||[], fotos);
      if(distinto){ ya.titulo=titulo; ya.detalle=detalle||""; ya.fotos=fotos;
                    ya.origen.carpetaId = r.driveCarpeta||ya.origen.carpetaId;
                    ya.act=Date.now(); ya.sucio=true; cambio = true; }
    }
  };

  for(const h of hallazgos(r)) sincroniza(`${r.id}:${h.slot}`, h.t, h.nota, h.media);
  for(const d of r.danos||[]) sincroniza(`${r.id}:dano:${d.id}`, d.zona || "Daño sin zona", d.desc, d.fotos);

  /* Un daño desmarcado retira su tarea, salvo que alguien ya la haya tomado */
  const sobran = FLOTA.tareas.filter(t=>t.origen && t.origen.fichaId===r.id &&
    t.auto && t.estado==="pendiente" && !vigentes.has(t.origen.clave));
  if(sobran.length){
    const ids = new Set(sobran.map(t=>t.id));
    ids.forEach(id=>FLOTA.bajas["t:"+id]=Date.now());
    FLOTA.tareas = FLOTA.tareas.filter(t=>!ids.has(t.id));
    borraEnBase("tareas", [...ids]);
    cambio = true;
  }

  if(cambio) await guardaFlota();
  return n;
}

/* Al cerrar el arriendo se traspasa todo de una vez */
async function traspasaAFlota(r){
  const subio = await millajeAFlota(r);
  const nuevas = await danosAFlota(r);
  const partes = [];
  if(subio) partes.push("millaje actualizado");
  if(nuevas) partes.push(`${nuevas} reparación(es) a la flota`);
  return partes.join(" · ");
}

async function diagSync(){
  const L=[];
  L.push("Dispositivo: "+(window.matchMedia("(display-mode: standalone)").matches?"app instalada":"navegador"));
  L.push("Drive configurado: "+(hayDrive()?"sí":"no"));
  L.push("Arriendos en este dispositivo: "+S.indice.length);
  L.push("Esperando subir: "+SYNC.pendientes.size);
  L.push("Bajas registradas: "+((S.borradas||[]).length));
  L.push("");
  try{
    const p=await api("/ping");
    L.push("Worker: "+(p.version||"?")+" · unidad "+(p.unidad||"?"));
    L.push("Carpeta base: "+(p.raiz||"?"));
  }catch(e){ L.push("Worker no responde: "+corta(e.message)); }
  L.push("");
  try{
    /* Estado de la base de operación: es la fuente de verdad de los datos */
    try{
      const e = await api("/db/estado");
      L.push("Base de datos: conectada · "+(e.version||"?"));
      for(const t of Object.keys(e.tablas||{}))
        L.push("  "+t+": "+e.tablas[t].filas+" fila(s)");
      L.push("  carga inicial: "+(e.importado ? e.importado : "no hecha"));
      L.push("  este equipo: "+nombreEquipo());
      L.push("  corte de sincronización: "+(BD.desde ? new Date(BD.desde).toLocaleString("es-CL") : "desde cero"));
      const p = BD.pend.arriendos.size + BD.pend.vehiculos.size + BD.pend.tareas.size;
      L.push("  sin mandar: "+(p ? p+" fila(s)" : "nada"));
      if(BD.error) L.push("  ⚠ último error: "+BD.error);
    }catch(e){
      L.push("Base de datos: NO disponible ("+corta(e.message)+")");
      L.push("  Los datos están viajando por Drive, que es el camino antiguo.");
      L.push("  Revisa que el Worker esté actualizado y que la base D1 esté");
      L.push("  vinculada con el nombre de variable DB.");
    }
    L.push("");
    /* Lo que el SERVIDOR ve en Drive, que ahora solo guarda archivos */
    try{
      const g = await api("/diagnostico");
      L.push("Carpeta raíz (servidor): "+g.raizId);
      L.push("Carpeta de estado (servidor): "+g.estadoId);
      if(g.raicesDuplicadas>1) L.push("⚠ HAY "+g.raicesDuplicadas+" carpetas raíz con el mismo nombre");
      if(g.flotasDuplicadas>1) L.push("⚠ HAY "+g.flotasDuplicadas+" carpetas _Flota duplicadas");
      L.push("Según el servidor · índice: "+(g.indice?g.indice.arriendos+" arriendo(s)":"no existe")
             +" · flota: "+(g.flota?g.flota.vehiculos+" vehículo(s), "+g.flota.tareas+" tarea(s)":"no existe"));
    }catch(e){ L.push("Diagnóstico del servidor no disponible: "+corta(e.message)
                      +" (¿falta actualizar el Worker?)"); }
    const d = await leeIndice();
    if(!d || !d.contenido){ L.push("indice.json: NO EXISTE en Drive"); }
    else {
      const lista = d.contenido.lista||[];
      L.push("indice.json: "+lista.length+" arriendo(s)");
      lista.slice(0,12).forEach(f=>L.push("  · "+(f.carpeta||f.id)+" ["+(f.cliente||"sin cliente")+"]"));
      const bor = d.contenido.borradas||[];
      if(bor.length) L.push("  bajas en Drive: "+bor.length);
      const soloAca = S.indice.filter(a=>!lista.some(b=>b.id===a.id));
      const soloAlla = lista.filter(b=>!S.indice.some(a=>a.id===b.id));
      if(soloAca.length) L.push("SOLO AQUÍ (sin subir): "+soloAca.map(f=>f.carpeta||f.id).join(", "));
      if(soloAlla.length) L.push("SOLO EN DRIVE (sin bajar): "+soloAlla.map(f=>f.carpeta||f.id).join(", "));
      if(!soloAca.length && !soloAlla.length) L.push("Coinciden: este dispositivo y Drive tienen lo mismo.");
    }
  }catch(e){ L.push("Error leyendo el índice: "+corta(e.message)); }

  const txt=L.join("\n");
  modal(`<h3>Diagnóstico de sincronización</h3><pre class="res">${esc(txt)}</pre>
    <div class="row" style="margin-top:10px">
      <button class="btn acento" data-act="forzarSubida" style="flex:1">Forzar subida de todo</button>
    </div>`);
}

const app=document.getElementById("app");
function pinta(keep){
  /* Redibujar destruye el campo con foco y el teclado se cierra solo.
     Si alguien está escribiendo, el repintado espera a que termine. */
  const foco = document.activeElement;
  if(keep && foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName||"")){
    S.repintarPendiente = true;
    return;
  }
  S.repintarPendiente = false;
  const y = keep ? window.scrollY : 0;
  document.getElementById("sucSw").innerHTML = (S.vista==="ficha"&&S.r)
    ? `<span class="suc-fija">${esc(S.r.suc)}</span>`
    : SUCURSALES.map(x=>`<button data-suc="${x}" aria-pressed="${S.suc===x}">${x}</button>`).join("");
  const rail=document.getElementById("rail"), pie=document.getElementById("pie");
  if(S.vista==="ficha"&&S.r){ rail.hidden=false; pie.hidden=false; pintaRail(); pintaPie(); }
  else if(S.vista==="vehiculo"&&FLOTA.veh[S.veh]){ rail.hidden=true; pie.hidden=false; pintaPieVeh(); }
  else { rail.hidden=true; pie.hidden=true; }
  pintaConexion();
  /* Red de seguridad: si una vista falla, muestra el motivo y una salida.
     Nunca más una pantalla en blanco sin explicación. */
  try{
    if(S.vista==="inicio") vistaInicio();
    else if(S.vista==="flota") vistaFlota();
    else if(S.vista==="archivo") vistaArchivo();
    else if(S.vista==="ajustes") vistaAjustes();
    else if(S.vista==="vehiculo") vistaVehiculo();
    else vistaFicha();
  }catch(e){
    console.error("Falló la vista "+S.vista, e);
    document.getElementById("app").innerHTML = `
      <div class="aviso"><b>No se pudo mostrar esta pantalla.</b><br>
        Tus datos están a salvo. Avísale a Miguel con este detalle:<br>
        <code style="font-size:12px;word-break:break-word">${esc(S.vista)} · ${esc(String(e&&e.message||e))}</code>
      </div>
      <button class="btn acento" data-act="irInicio" style="width:100%">Volver al inicio</button>`;
  }
  if(keep) window.scrollTo(0,y); else window.scrollTo({top:0});
  pintaFotosDrive();          // trae las fotos que solo están en Drive
}

    const[n,t]=prog(S.r,e.k), seg=6, on=Math.round(n/t*seg);
    return `<button class="gauge" data-etapa="${e.k}" aria-current="${S.etapa===e.k}" data-full="${n>=t}">
      <b>${e.t}</b><span class="bars">${Array.from({length:seg},(_,i)=>`<s class="${i<on?"on":""}"></s>`).join("")}</span>
      <i>${n}/${t}</i></button>`;

function pintaPie(){
  const ix=ETAPAS.findIndex(e=>e.k===S.etapa);
  const[en,et]=prog(S.r,S.etapa);
  const existe = S.indice.some(x=>x.id===S.r.id);

     es un botón: así se puede confirmar sin tener que salir de la ficha. */
  let centro;
  if(pendientes())
    centro = `<div class="est"><b>${ETAPAS[ix].t} · ${en}/${et}</b>Subiendo ${pendientes()} archivo(s)…</div>`;
  else if(!existe)
    centro = `<div class="est"><b>${ETAPAS[ix].t} · ${en}/${et}</b>Se guarda al escribir</div>`;
  else if(SYNC.subiendo)
    centro = `<div class="est"><b>${ETAPAS[ix].t} · ${en}/${et}</b>Sincronizando…</div>`;

  document.getElementById("pieIn").innerHTML=`

/* Mira arriendos y flota: decir "todo respaldado" mirando solo una mitad
   es peor que no decir nada, porque da confianza sin fundamento. */
function nivelSync(){
  if(!navigator.onLine) return "espera";
  if(SYNC.subiendo || FLOTA_SYNC.subiendo) return "espera";
  if(SYNC.pendientes.size || FLOTA_SYNC.sucio) return "pendiente";
  if(FLOTA_SYNC.error || SYNC.error) return "pendiente";
  return (SYNC.ultimo && FLOTA_SYNC.ultimo) ? "ok" : "pendiente";
}

/* Fotos que viven en Drive porque se tomaron en otro dispositivo.
   Se piden al Worker, que las sirve con su propia autenticación, y se
   quedan en memoria mientras dure la sesión. */
const FOTOS_DRIVE = {};
async function fotoDeDrive(driveId){
  if(!driveId) return "";
  if(FOTOS_DRIVE[driveId]) return FOTOS_DRIVE[driveId];
  if(!hayDrive() || !navigator.onLine) return "";
  try{
    const r = await fetch(CFG.url.replace(/\/$/,"")+"/archivo?fileId="+encodeURIComponent(driveId),
                          { headers:{ "x-clave": CFG.clave } });
    if(!r.ok) return "";
    return FOTOS_DRIVE[driveId] = URL.createObjectURL(await r.blob());
  }catch(e){ return ""; }
}

/* Rellena los huecos sin repintar la pantalla: repintar borraría lo que la
   persona esté escribiendo. Solo reemplaza el texto de relleno y deja
   intacto el botón de quitar y el indicador de subida. */
let PINTANDO_DRIVE = false;
async function pintaFotosDrive(){
  if(PINTANDO_DRIVE) return;
  PINTANDO_DRIVE = true;
  try{
    for(const hueco of [...document.querySelectorAll("[data-drivefoto]")]){
      const src = await fotoDeDrive(hueco.dataset.drivefoto);
      if(!document.body.contains(hueco)) continue;
      const relleno = hueco.querySelector(".txt");
      if(src){
        const img = document.createElement("img");
        img.src = src; img.alt = "";
        if(relleno) relleno.replaceWith(img); else hueco.prepend(img);
        hueco.removeAttribute("data-drivefoto");
      }else if(relleno){
        relleno.innerHTML = "Ver en<br>Drive";   // sin conexión o sin permiso
      }
    }
  }finally{ PINTANDO_DRIVE = false; }
}

function faltaParaCarpeta(r){
  const f=[];
  if(!r.patente) f.push("la patente");
  if(!(r.cliente||"").trim()) f.push("el cliente");
  if(!r.ft && !r.fi) f.push("las fechas");
  return f;
}

/* ══════════ RUTAS Y NOMBRES DE ARCHIVO ══════════ */
const RAIZ = "Fichas Camperspot";
function slug(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32) || "sin-dato";
}
const mesDe = r => (r.ft||r.fi||hoy()).slice(0,7);
const nombreCarpeta = r => `${(r.ft||r.fi||hoy())}_${slug(r.patente)||"SIN-PATENTE"}_${slug(r.cliente)}`;
function rutas(r){
  const base=`${RAIZ}/${nombreCarpeta(r)}`;
  return { base, carpeta:nombreCarpeta(r), mes:mesDe(r),
           videos:`${base}/Videos`, ficha:`${base}/Ficha`, danos:`${base}/Daños` };
}
const EXT = n => { const p=String(n||"").split("."); return p.length>1 ? p.pop().toLowerCase() : "jpg"; };
const NOMBRES = {
  f_tab_s:"tablero-salida", f_tab_l:"tablero-llegada",
};
function archivosDe(r){
  const out={videos:[], ficha:[{n:"ficha.json"},{n:"resumen.txt"}], danos:[]};
  SLOTS_VIDEO.forEach(def=>{
    videosDe(r,def.k).forEach(v=>out.videos.push({n:def.carpeta+"/"+v.nombre}));
    (r.media[def.k]||[]).forEach((m,i)=>out.videos.push({n:def.carpeta+"/"+def.archivo+(i?"-"+(i+1):"")+"."+EXT(m.nombre)}));
  });
  ["f_tab_s","f_tab_l"].forEach(k=>(r.media[k]||[]).forEach((m,i)=>
    out.ficha.push({n:`${NOMBRES[k]}${i?"-"+(i+1):""}.${EXT(m.nombre)}`})));
  hallazgos(r).forEach(h=>h.media.forEach((m,i)=>
    out.danos.push({n:`${slug(h.t)}${i?"-"+(i+1):""}.${EXT(m.nombre)}`, d:h.t})));
  (r.danos||[]).forEach(d=>(d.fotos||[]).forEach((m,i)=>
    out.danos.push({n:`${slug(d.zona||"sin-zona")}${i?"-"+(i+1):""}.${EXT(m.nombre)}`, d:d.zona||""})));
  return out;
}

function hallazgos(r){
  const out=[];
  gruposRev(r).forEach(g=>itemsRev(g,r).forEach(x=>{
    const media=r.media["rev:"+x.k]||[];
    if(r.rev[x.k]==="dano" || media.length)
      out.push({grupo:g.t, t:x.t, nota:r.revNota[x.k]||"", media, slot:"rev:"+x.k});
  }));
  return out;
}
function secReporte(r){
  const km = (+r.reporte.km||0)-(+r.entrega.km||0);
  const hs = hallazgos(r);
  const total = hs.length + r.danos.length;
  const adj = hs.reduce((a,h)=>a+h.media.length,0) + r.danos.reduce((a,d)=>a+(d.fotos||[]).length,0);
  return `<div class="card"><h3>Resumen de daños <em>${total} hallazgo(s) · ${adj} respaldo(s)</em></h3>
    ${hs.map(h=>`<div class="slot">
      <h4>${esc(h.t)} <span class="badge bad">Daño</span></h4>
      <p>${esc(h.grupo)}${h.nota?" — "+esc(h.nota):""}</p>
      ${h.media.length?`<div class="tiras">${h.media.map(m=>tiraHTML(m,h.slot)).join("")}</div>`
        :`<span class="badge warn">Sin respaldo adjunto</span>`}
    </div>`).join("")}
    ${r.danos.map(d=>`<div class="slot">
      <div class="row" style="align-items:center"><h4 style="flex:1">${esc(d.zona||"Daño sin zona")} <span class="badge bad">Agregado aquí</span></h4>
        <button class="btn ghost sm" data-deldano="${d.id}">Quitar</button></div>
      <label class="f" style="margin:8px 0 6px"><input type="text" data-dano="${d.id}" data-c="zona" value="${esc(d.zona)}" placeholder="Zona: costado izquierdo, techo, WC…"></label>
      <label class="f"><textarea data-dano="${d.id}" data-c="desc" placeholder="Descripción (opcional)">${esc(d.desc)}</textarea></label>
      <div class="row">
        <button class="btn ghost sm" data-add="dano" data-dano="${d.id}" data-tipo="foto" data-cam="1">Tomar foto</button>
        <button class="btn ghost sm" data-add="dano" data-dano="${d.id}" data-tipo="mixto">Adjuntar respaldo</button>
      </div>
      <div class="tiras">${(d.fotos||[]).map(m=>tiraHTML(m,"",d.id)).join("")}</div>
    </div>`).join("")}
    ${total?"":`<div class="pad" style="padding-bottom:0"><p class="hint" style="margin:0">Sin daños registrados. Todo lo revisado en la etapa anterior quedó en OK.</p></div>`}
    <div class="pad"><button class="btn wide ghost" data-act="addDano">Agregar un daño</button></div>
  </div>
  <div class="card"><h3>Cierre</h3><div class="pad">
    <div class="grid">
      ${cfgTipo(r).millaje ? `<label class="f"><span>Millaje de llegada</span><input type="number" inputmode="numeric" data-set="reporte.km" value="${esc(r.reporte.km)}" placeholder="Ej: 190450"></label>` : ""}
      ${cfgTipo(r).millaje ? `<label class="f"><span>Uso de millaje</span><input type="text" id="usoKm" value="${km>0?km.toLocaleString("es-CL"):"—"}" readonly style="background:#EAEEE0"></label>` : ""}
    </div>
    <div class="grid">
      ${cfgTipo(r).bencina ? `<label class="f"><span>Estado de bencina</span><select data-set="reporte.bencina">
        <option value="">Seleccionar…</option><option ${r.reporte.bencina==="Lleno"?"selected":""}>Lleno</option>
        <option ${r.reporte.bencina==="Reponer"?"selected":""}>Reponer</option></select></label>` : ""}
      <label class="f"><span>Pedir gas (balones)</span><select data-set="reporte.gas">
        ${["0","1","2"].map(g=>`<option ${r.reporte.gas===g?"selected":""}>${g}</option>`).join("")}</select></label>
    </div>
    <button class="btn wide" data-act="resumen" style="margin-top:6px">Ver resumen del arriendo</button>
  </div></div>

  ${r.patente?`<div class="card"><h3>Qué pasa al cerrar</h3><div class="pad">
    ${(()=>{ const v=FLOTA.veh[r.patente]||{}, km=Number(r.reporte.km)||0, sube=km>(Number(v.km)||0);
      const pend=hs.length+r.danos.length;
      return `<ul class="arch" style="margin:0">
        ${!cfgTipo(r).millaje ? "" : `<li style="padding:6px 0">${sube
          ? `<code>${esc(etiquetaPat(r.patente))}</code> <small>millaje actual pasa de ${(Number(v.km)||0).toLocaleString("es-CL")} a ${km.toLocaleString("es-CL")}</small>`
          : `<code>${esc(etiquetaPat(r.patente))}</code> <small>${km?"el millaje del vehículo ya es mayor, no se toca":"sin millaje de llegada, el vehículo no cambia"}</small>`}</li>`}
        <li style="padding:6px 0">${pend
          ? `<code>${pend} reparación(es)</code> <small>se agregan como pendientes en la flota</small>`
          : `<code>Sin daños</code> <small>no se crea ninguna tarea</small>`}</li>
      </ul>`; })()}
  </div></div>`:""}
  ${cardArchivo(r)}`;
}

function cardArchivo(r){
  const link=linkCarpeta(r.driveCarpeta);
  const sinSubir=[];
  for(const k of Object.keys(r.media||{})) for(const m of r.media[k]) if(!m.driveId) sinSubir.push(m);
  for(const d of r.danos||[]) for(const m of d.fotos||[]) if(!m.driveId) sinSubir.push(m);
  return `<div class="card"><h3>Archivo en Drive</h3><div class="pad">
    ${link
      ? `<a class="btn wide" href="${link}" target="_blank" rel="noopener" style="text-decoration:none">Abrir carpeta del arriendo</a>`
      : hayDrive()
        ? `<p class="hint" style="margin:0">La carpeta se crea al completar patente, cliente y fechas.</p>`
        : `<div class="aviso" style="margin:0"><b>Drive sin conectar.</b><br>Nada se está respaldando.
           <button class="btn ghost sm" data-act="ajustes" style="margin-top:8px">Conectar</button></div>`}
    ${sinSubir.length?`<p class="hint"><b>${sinSubir.length} archivo(s) sin respaldar.</b> Tócalos en su sección para ver el motivo.</p>`:""}
  </div></div>`;
}

function slotHTML(s,r){
  const ms=r.media[s.k]||[];
  return `<div class="slot"><h4>${s.t} ${ms.length?`<span class="badge ok">${ms.length}</span>`:`<span class="badge warn">Pendiente</span>`}</h4>
    <p>${s.d}</p>
    <div class="row">
      <button class="btn ghost sm" data-add="${s.k}" data-tipo="foto" data-cam="1">Tomar foto</button>
      <button class="btn ghost sm" data-add="${s.k}" data-tipo="foto">Elegir archivo</button>
    </div>
    <div class="tiras">${ms.map(m=>tiraHTML(m,s.k)).join("")}</div></div>`;
}
function tiraHTML(m,slot,danoId){
  /* Si la foto se tomó en otro dispositivo no está en este disco, pero sí
     en Drive: se marca el hueco y pintaFotosDrive la trae. */
  const deDrive = m.tipo==="foto" && !FOTOS[m.id] && m.driveId;
  /* Sin copia aquí y sin identificador de Drive: la subida está en curso en
     el equipo donde se tomó. Antes se mostraba una barra de progreso que no
     correspondía a nada que estuviera pasando en ESTE dispositivo. */
  const enOtro = !FOTOS[m.id] && !THUMBS[m.id] && !m.driveId
                 && m.equipo && m.equipo !== nombreEquipo();
  const cuerpo = m.tipo==="foto"
    ? (FOTOS[m.id] ? `<img src="${FOTOS[m.id]}" alt="">`
      : m.driveId ? `<em class="txt">Trayendo…</em>`
      : enOtro ? `<em class="txt">Subiendo en<br>el otro equipo</em>`
      : `<em class="txt">Foto</em>`)
    : (THUMBS[m.id] ? `<img src="${THUMBS[m.id]}" alt=""><em>Video</em>`
      : enOtro ? `<em class="txt">Subiendo en<br>el otro equipo</em>`
      : `<em class="txt">Video</em>`);
  const est = enOtro ? "" : (m.estado || (m.driveId ? "listo" : ""));
  const marca = est==="listo" ? `<i class="ok">✓</i>`
    : est==="error" ? `<i class="err">!</i>`
    : est ? `<span class="pb-caja"><span class="pb" style="width:${m.pct||0}%"></span></span>` : "";
  return `<button class="tira" data-ver="${m.id}" data-slot="${slot||""}" data-dano="${danoId||""}"
    ${deDrive?`data-drivefoto="${esc(m.driveId)}"`:""}
    data-estado="${est}" aria-label="Ver ${m.tipo}">${cuerpo}${marca}</button>`;
}

let VISOR=null;
function verMedia(id,slot,danoId){
  VISOR={id,slot,danoId};
  const foto=FOTOS[id], m=buscaMedia(id);
  const cuerpo = foto ? `<img src="${foto}" alt="" style="width:100%;border-radius:4px;display:block">`
    : THUMBS[id] ? `<img src="${THUMBS[id]}" alt="" style="width:100%;border-radius:4px;display:block">`
    : (m && m.driveId && m.tipo==="foto")
      ? `<div data-drivefoto="${esc(m.driveId)}" style="min-height:120px;display:flex;
           align-items:center;justify-content:center;background:var(--oliva-osc,#26380B);border-radius:4px">
           <em class="txt" style="color:#C6D4B2;font-style:normal;font-size:13px">Trayendo la foto…</em></div>`
      : "";
  const extra = (m && m.driveId && m.tipo==="video")
    ? `<a class="btn wide" style="margin-top:10px;text-decoration:none"
          href="https://drive.google.com/file/d/${m.driveId}/view" target="_blank" rel="noopener">Reproducir en Drive</a>`
    : "";
  const faltante = (!foto && !(m&&m.driveId))
      ? (m && ARCHIVOS[id]
          ? `<p class="hint">Se está subiendo. Cuando termine se podrá reproducir desde Drive.</p>`
          : `<div class="aviso" style="margin:0"><b>Archivo no disponible aquí.</b><br>No alcanzó a subirse o se adjuntó desde otro dispositivo. Vuelve a adjuntarlo.</div>`)
      : "";
  const est = m && (m.estado || (m.driveId?"listo":""));
  const aviso = est==="error"
      ? `<div class="aviso" style="margin:10px 0 0"><b>No se pudo subir.</b><br>${esc(m.detalle||"Error desconocido")}</div>`
    : est==="listo" ? `<p class="hint">Respaldado en Drive.</p>`
    : est ? `<p class="hint">Subiendo… ${m.pct||0}%</p>`
    : hayDrive() ? "" : `<p class="hint">Solo en este dispositivo. Drive no está conectado.</p>`;
  modal(`${cuerpo}${faltante}${extra}${aviso}<div class="row" style="margin-top:12px">
    ${est==="error"?`<button class="btn acento" data-act="reintentar" style="flex:1">Reintentar</button>`:""}
    <button class="btn ghost" data-act="borrarMedia" style="flex:1">Eliminar</button></div>`);
}

/* ══════════ EVENTOS ══════════ */
document.addEventListener("click", async ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  const d=t.dataset;

  if(d.suc){ S.suc=d.suc; pinta(); return; }
  if(d.etapa){ S.etapa=d.etapa; recuerdaEtapa(); pinta();
    if(S.etapa==="entrega") alistaVideos(); return; }
  if(d.nav){ const i=ETAPAS.findIndex(e=>e.k===S.etapa)+Number(d.nav);
    if(i<0||i>=ETAPAS.length) return;
    S.etapa=ETAPAS[i].k; recuerdaEtapa(); pinta();
    if(S.etapa==="entrega") alistaVideos(); return; }
  if(d.abre){ await abreFicha(d.abre); return; }
  if(d.limpiahuerfana){ cierraModal(); await borraFicha(d.limpiahuerfana);
    S.vista = S.vista==="archivo" ? "archivo" : "inicio"; pinta();
    flash("Registro quitado"); return; }
  if(d.borrafi){ const f=S.indice.find(x=>x.id===d.borrafi)||{};
    confirmar(`Se elimina ${f.carpeta||"esta ficha"} de este dispositivo, con sus fotos locales. Lo que está en Drive no se toca.`,
      async()=>{ await borraFicha(d.borrafi); S.vista="archivo"; pinta(); }, "Eliminar");
    return; }
  if(d.chk!=null){ S.r.prep[d.chk]=!S.r.prep[d.chk];
    t.setAttribute("aria-pressed",!!S.r.prep[d.chk]); pintaRail(); pintaPie(); guardaFicha(); return; }
  if(d.vehabrir){ S.veh=d.vehabrir; S.verHist=10; S.vista="vehiculo"; pinta(); bajaFlota(true); return; }
  if(d.tarea){ await cargaFotosTarea(d.tarea); modalTarea(d.tarea); return; }
  if(d.irA){ cierraModal(); S.etapa=d.irA; recuerdaEtapa(); pinta(); return; }
  if(d.tarfoto){ pedirFotoTarea(d.cam); return; }
  if(d.taredel){ const t=buscaTarea(S.tarea);
    if(t){ t.fotos=(t.fotos||[]).filter(f=>f.id!==d.taredel);
           await quitaArchivo(d.taredel);
           if(!(S.borrador && S.borrador.id===t.id)) await tocaTarea(t.id,{fotos:t.fotos});
           modalTarea(t.id); }
    return; }
  if(d.adic){
    const v=d.adic; let a=(S.r.adicionales||[]).slice();
    if(v==="Ninguno") a = a.includes("Ninguno") ? [] : ["Ninguno"];
    else { a=a.filter(x=>x!=="Ninguno"); a = a.includes(v) ? a.filter(x=>x!==v) : [...a,v]; }
    S.r.adicionales=a;
    document.querySelectorAll("[data-adic]").forEach(b=>b.setAttribute("aria-pressed", a.includes(b.dataset.adic)));
    const s=document.getElementById("adicResumen"); if(s) s.textContent=resumenAdic(S.r);
    guardaFicha(); return;
  }
  if(d.tri){ const k=d.tri; S.r.rev[k] = S.r.rev[k]===d.v ? "" : d.v; guardaFicha(); pinta(true); return; }
  if(d.ver){ verMedia(d.ver, d.slot, d.dano||null); return; }
  if(d.add){ pedirArchivo(d.add, d.tipo, d.cam, d.dano||null); return; }
  if(d.deldano){ confirmar("¿Quitar este daño y sus respaldos?", async()=>{ for(const m of (S.r.danos.find(x=>x.id===d.deldano)||{}).fotos||[]) await quitaArchivo(m.id); S.r.danos=S.r.danos.filter(x=>x.id!==d.deldano); await guardaFicha(); pinta(true); }); return; }
  if(d.delveh){ confirmar(`¿Eliminar ${d.delveh} de la flota? Sus tareas también se eliminan.`, async()=>{
      FLOTA.bajas["v:"+d.delveh] = Date.now();
      const tareasDel = FLOTA.tareas.filter(t=>t.patente===d.delveh).map(t=>t.id);
      tareasDel.forEach(id=>FLOTA.bajas["t:"+id]=Date.now());
      delete FLOTA.veh[d.delveh];
      FLOTA.tareas = FLOTA.tareas.filter(t=>t.patente!==d.delveh);
      await borraEnBase("tareas", tareasDel);
      await borraEnBase("vehiculos", [d.delveh]);
      S.flota = listaFlota(); await guardaFlota();
      S.vista="flota"; pinta();
    }, "Eliminar"); return; }


  switch(d.act){
    case "verArchivo": S.vista="archivo"; pinta(); break;
    case "ganarYo":
      S.baseAct = Date.now(); cierraModal();
      if(S.r){ S.r.act = Date.now(); await guardaFicha(true); }
      flash("Se subió tu versión"); break;
    case "traerSuyo": {
      const id = S.r && S.r.id; cierraModal();
      if(!id) break;
      await St.del("r:"+id);
      const baja = await traeFicha(id);
      if(baja){ S.r = baja; S.original = JSON.stringify(baja); S.baseAct = baja.act||0;
                pinta(); flash("Se trajo la versión del otro dispositivo"); }
      else flash("No se pudo traer la otra versión");
      break; }
    case "forzarSubida":
      cierraModal();
      S.indice.forEach(f=>SYNC.pendientes.add(f.id));
      flash("Subiendo todo…",true);
      await subeArriendos();
      flash(SYNC.pendientes.size ? "Quedaron "+SYNC.pendientes.size+" sin subir" : "Todo subido");
      pinta(true); break;
    case "sincronizar": {
      flash("Buscando cambios…",true);
      const okF = await bajaFlota(true);
      await bajaArriendos(false);
      S.flota = listaFlota();
      if(!okF && hayDrive()) flash("La flota no se pudo leer: "+(FLOTA_SYNC.error||"revisa la conexión"));
      pinta(true);
      break; }
    case "ajustes": S.vista="ajustes"; pinta(); break;
    case "irInicio": S.vista="inicio"; S.r=null; S.veh=null; pinta(); break;
    case "guardarYa": {
      if(!S.r) break;
      flash("Guardando…", true);
      const res = await guardaYSube();
      pintaPie(); flash(avisoGuardado(res, false));
      break; }
    case "cerrarIgual": S.forzarCierre=true; cierraModal();
      document.querySelector('[data-act="cerrar"]').click(); break;
    case "salirVeh":
      clearTimeout(guardaFlota._t);
      if(FLOTA_SYNC.sucio && hayDrive() && navigator.onLine){
        flash("Guardando…", true); pintaPieVeh();
        await subeFlota();
      }
      flash(FLOTA_SYNC.sucio ? "Guardado en el teléfono · se sube al volver la señal" : "Cambios guardados");
      S.vista="flota"; S.veh=null; pinta();
      break;
    case "masHist": S.verHist=(S.verHist||10)+20; pinta(true); break;
    case "addTarea":
      S.borrador = { id:uid(), patente:S.veh, tipo:"reparacion", titulo:"", detalle:"",
                     estado:"pendiente", fotos:[], creado:Date.now(), act:Date.now() };
      S.tarea = S.borrador.id;
      modalTarea(S.borrador.id);
      break;
    case "guardarTarea": {
      const b = S.borrador; if(!b) break;
      if(!b.titulo.trim()){ flash("Escribe qué hay que hacer"); break; }
      FLOTA.tareas.push({...b, act:Date.now()});
      S.borrador = null;
      await guardaFlota(); cierraModal(); pinta(true); flash("Tarea creada");
      break; }
    case "descartarTarea":
      for(const f of (S.borrador&&S.borrador.fotos)||[]) await quitaArchivo(f.id);
      S.borrador = null; cierraModal(); break;
    case "cerrarTarea": await tocaTarea(S.tarea,{estado:"listo", cerrado:Date.now()});
      cierraModal(); pinta(true); flash("Tarea resuelta"); break;
    case "reabrirTarea": await tocaTarea(S.tarea,{estado:"pendiente", cerrado:0});
      cierraModal(); pinta(true); flash("Tarea reabierta"); break;
    case "borrarTarea": { const id=S.tarea;
      confirmar("Se elimina la tarea y su respaldo. No se puede deshacer.", async()=>{
        const t=FLOTA.tareas.find(x=>x.id===id);
        for(const f of (t&&t.fotos)||[]) await quitaArchivo(f.id);
        FLOTA.tareas = FLOTA.tareas.filter(x=>x.id!==id);
        FLOTA.bajas["t:"+id] = Date.now();
        await borraEnBase("tareas", [id]);
        await guardaFlota(); cierraModal(); pinta(true); flash("Tarea eliminada");
      }, "Eliminar"); break; }
    case "salir": {
      if(S.r && !S.indice.some(x=>x.id===S.r.id) && !tieneContenido(S.r)){
        S.original=null; S.vista="inicio"; S.r=null; pinta();
        flash("No había nada que guardar"); break;
      }
      /* Se sube a Drive ANTES de soltar la ficha. Antes esto solo guardaba
         en el teléfono y la subida quedaba en un temporizador que moría al
         cerrar la app: decía "guardado" y nunca llegaba a los otros equipos. */
      flash("Guardando…", true);
      const res = await guardaYSube();
      S.original=null; S.vista="inicio"; S.r=null; pinta();
      flash(res.local ? avisoGuardado(res, true) : "Ficha en blanco descartada");
      break; }
    case "volver":
      if(pendientes()) { flash("Espera a que terminen las subidas"); break; }
      {
        const r=S.r||{}, guardada=S.indice.some(x=>x.id===r.id);
        const hayQuePerder = guardada ? hayCambios() : tieneContenido(r);
        if(hayQuePerder)
          confirmar("Se pierde lo que escribiste desde que abriste la ficha. Las fotos y videos que ya subieron a Drive se quedan.",
                    descartaCambios, "Salir sin guardar");
        else { S.original=null; S.vista="inicio"; S.r=null; pinta(); }
      }
      break;
    case "nueva": S.r=nuevaFicha(); S.original=null; S.vista="ficha"; S.etapa="datos"; pinta(); break;
    case "inicio": {
      const enBlanco = S.r && !S.indice.some(x=>x.id===S.r.id);
      S.vista="inicio"; S.r=null; pinta();
      if(enBlanco) flash("Ficha en blanco descartada");
      break; }
    case "verFlota": S.vista="flota"; pinta(); break;
    case "prepNone": confirmar("¿Desmarcar todos los ítems de preparación?", async()=>{ S.r.prep={}; await guardaFicha(); pinta(true); }); break;
    case "addDano": { const nd={id:uid(),zona:"",desc:"",fotos:[]}; S.r.danos.push(nd); await guardaFicha(); pinta(true);
      const c=document.querySelector(`[data-dano="${nd.id}"][data-c="zona"]`); if(c){ c.scrollIntoView({block:"center",behavior:"smooth"}); c.focus({preventScroll:true}); } break; }
    case "resumen": modalResumen(); break;
    case "borrar": confirmar("Se elimina la ficha completa con sus fotos. No se puede deshacer.", ()=>borraFicha(S.r.id), "Eliminar"); break;
    case "cerrar": { const cerrando=S.r.estado!=="cerrado";
      if(cerrando){
        if(!S.r.ft || !S.r.patente){
          const campo = !S.r.ft ? "ft" : "patente";
          S.etapa="datos"; pinta();
          flash(!S.r.ft ? "Falta la fecha de término" : "Falta elegir la patente");
          const f=document.querySelector(`[data-set="${campo}"]`);
          if(f){ f.scrollIntoView({block:"center"}); f.focus({preventScroll:true}); }
          break;
        }
        if(pendientes()){ flash("Espera a que terminen las subidas"); break; }
        const pend = faltantes(S.r);
        if(pend.length && !S.forzarCierre){
          modalCierre(pend); break;
        }
      }
      S.forzarCierre=false; S.r.estado=cerrando?"cerrado":"borrador"; await guardaFicha();
      if(cerrando){
        const ficha=S.r;
        const aFlota = await traspasaAFlota(ficha);
        if(hayDrive()){ flash("Subiendo documentos…",true);
          try{ await subeDocumentos(ficha); flash("Arriendo cerrado" + (aFlota?" · "+aFlota:"")); }
          catch(e){ flash("Arriendo cerrado, pero falló el respaldo: "+e.message); } }
        else flash("Arriendo cerrado" + (aFlota?" · "+aFlota:""));
        S.vista="inicio"; S.r=null; pinta();
      } else pinta(true); break; }
    case "addVeh": modalVehiculo(); break;
    case "reintentar": if(VISOR){ const m=buscaMedia(VISOR.id);
        if(m){ m.estado="pendiente"; COLA.push({id:m.id,fichaId:S.r.id,slot:VISOR.slot,danoId:VISOR.danoId,media:m});
               cierraModal(); pinta(true); procesaCola(); } } break;
    case "borrarMedia": if(VISOR){ const v=VISOR; VISOR=null; cierraModal(); await quitaMedia(v.slot, v.id, v.danoId); } break;
    case "confirmarSi": if(PENDIENTE){ const f=PENDIENTE; PENDIENTE=null; cierraModal(); await f(); } break;
    case "cerrarModal":
      if(S.borrador){
        for(const f of S.borrador.fotos||[]) await quitaArchivo(f.id);
        S.borrador=null;
      }
      cierraModal(); break;
  }
});

let tmr;
document.addEventListener("input", ev=>{
  const el=ev.target, d=el.dataset;
  if(d.veh){ const v=FLOTA.veh[d.veh]; if(v){
      /* Cambiar el tipo cambia qué checklist se usa. En los arriendos que ya
         existen de ese vehículo, los checks quedarían leídos contra otra
         lista, así que conviene que quien lo cambia lo sepa. */
      if(d.c==="tipo" && el.value!==v.tipo){
        const conFichas = S.indice.filter(x=>x.patente===d.veh).length;
        if(conFichas) flash(`Ojo: ${d.veh} ya tiene ${conFichas} arriendo(s). Sus marcas se leerán con el checklist nuevo.`);
      }
      v[d.c] = (d.c==="km"||d.c==="kmMant") ? (Number(el.value)||0) : el.value;
      if(d.c==="km") v.kmFecha = hoy();
      v.act = Date.now(); v.sucio = true; delete v.provisional; S.flota = listaFlota();
      clearTimeout(tmr); tmr=setTimeout(guardaFlota, 500);
    } return; }
  if(d.tarc){ const t=buscaTarea(S.tarea); if(t){
      if(S.borrador && S.borrador.id===S.tarea){
        t[d.tarc] = d.tarc==="costo" ? (Number(el.value)||0) : el.value;
        return;
      }
      t[d.tarc] = d.tarc==="costo" ? (Number(el.value)||0) : el.value;
      t.auto = false;
      if(d.tarc==="estado" && el.value==="listo" && !t.cerrado) t.cerrado=Date.now();
      if(d.tarc==="estado" && el.value!=="listo") t.cerrado=0;
      t.act=Date.now(); t.sucio=true; clearTimeout(tmr); tmr=setTimeout(guardaFlota, 500);
    } return; }
  if(d.dano){ const x=S.r.danos.find(y=>y.id===d.dano); if(x){ x[d.c]=el.value; deb(); } return; }
  if(d.set){ const ruta=d.set.split("."); let o=S.r;
    for(let i=0;i<ruta.length-1;i++) o=o[ruta[i]];
    o[ruta.at(-1)]=el.value;
    if(d.set==="reporte.km" || d.set==="entrega.km"){
      const uso=document.getElementById("usoKm");
      if(uso){ const n=(Number(S.r.reporte.km)||0)-(Number(S.r.entrega.km)||0);
        uso.value = n>0 ? n.toLocaleString("es-CL") : "—"; }
    }
    if(d.set==="fi"){
      const ft=document.querySelector('[data-set="ft"]');
      if(ft){ ft.min = el.value || "";
        if(ft.value && el.value && ft.value < el.value){ ft.value = el.value; S.r.ft = el.value; } }
    }
    if(d.set==="patente"){ S.r.tipo = tipoDe(S.r.patente); }
    if(d.set==="suc"||d.set==="patente"){ deb(); pinta(true); return; }
    pintaRail(); pintaPie(); deb(); }
});
function deb(){ clearTimeout(tmr); tmr=setTimeout(guardaFicha,600); }
document.addEventListener("blur", e=>{
  if(S.r && e.target.dataset && (e.target.dataset.set||e.target.dataset.dano)){ clearTimeout(tmr); guardaFicha(); }
  if(S.repintarPendiente) setTimeout(()=>{ if(S.repintarPendiente) pinta(true); }, 120);
}, true);
/* Al minimizar o cerrar hay que guardar Y subir, en ese orden y esperando.
   Antes se llamaba a subeArriendos() antes de que guardaFicha() terminara,
   así que subía el estado anterior y los últimos cambios se perdían. */
async function alOcultar(){
  clearTimeout(tmr);
  clearTimeout(marcaParaSubir._t);
  marcaParaSubir._desde = 0;
  if(S.r) await guardaFicha(true);
  clearTimeout(marcaParaSubir._t);
  if(FLOTA_SYNC.sucio) await subeFlota();
  if(SYNC.pendientes.size) await subeArriendos();
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ alOcultar(); return; }
  if(S.r && S.vista==="ficha" && S.etapa==="entrega") revisaVideosDrive(true);
  /* Volver a la app es el mejor momento para ponerse al día: el operario
     sale a la cámara y vuelve. Antes solo se sincronizaba si estaba en la
     pantalla de inicio, que es justo donde menos falta hace. */
  sincronizaAhora(true);
  if(S.r) reanudaSubidas(S.r);
  if(S.vista==="ficha" && S.r) pintaPie();
});
/* En iPhone, al cerrar la app web solo llega pagehide, no visibilitychange */
window.addEventListener("pagehide", ()=>{ alOcultar(); });

function pedirFotoTarea(cam){
  const inp=document.createElement("input");
  inp.type="file"; inp.multiple=true; inp.accept="image/*";
  if(cam) inp.setAttribute("capture","environment");
  inp.onchange=async()=>{
    const t=buscaTarea(S.tarea); if(!t) return;
    for(const file of [...inp.files]){
      const id=uid();
      let data; try{ data=await comprime(file); }catch(e){ flash("No se pudo leer la imagen"); continue; }
      FOTOS[id]=data; await St.set("f:"+id, data);
      t.fotos=(t.fotos||[]).concat([{id, nombre:file.name}]);
      subeFotoTarea(t, id, file.name);
    }
    if(!(S.borrador && S.borrador.id===t.id)) await tocaTarea(t.id,{fotos:t.fotos});
    modalTarea(t.id);
  };
  inp.click();
}

/* Las fotos de flota van a Fichas Camperspot/_Flota/<patente>/ */
async function subeFotoTarea(t, fotoId, nombre){
  if(!hayDrive()) return;
  try{
    const raizId = await carpetaRaiz();
    const { carpetaId:flotaId } = await api("/carpeta", { ruta:["_Flota"], padreId:raizId });
    const { carpetaId } = await api("/carpeta", { ruta:[t.patente], padreId:flotaId });
    const blob = await (await fetch(FOTOS[fotoId])).blob();
    const ext = EXT(nombre) || "jpg";
    const { subidaUrl } = await api("/sesion", {
      carpetaId, nombre:`${slug(t.titulo||"tarea")}-${fotoId}.${ext}`,
      mime: blob.type||"image/jpeg", tamano: blob.size });
    const res = await fetch(subidaUrl, { method:"PUT",
      headers:{ "Content-Range":`bytes 0-${blob.size-1}/${blob.size}` }, body:blob });
    if(res.ok){
      const d = await res.json().catch(()=>({}));
      const f = (t.fotos||[]).find(x=>x.id===fotoId);
      if(f){ f.driveId = d.id||""; await tocaTarea(t.id,{fotos:t.fotos}); }
    }
  }catch(e){ /* queda local; se reintenta al volver a abrir la tarea */ }
}

function pedirArchivo(slot,tipo,cam,danoId){
  const inp=document.createElement("input");
  inp.type="file"; inp.multiple=true;
  inp.accept = tipo==="video" ? "video/*" : tipo==="mixto" ? "image/*,video/*" : "image/*";
  if(cam) inp.setAttribute("capture","environment");
  inp.onchange=()=>subir(slot,inp.files,danoId);
  inp.click();
}

function textoResumen(r){
  const L=[], [n,t]=progTotal(r);
  L.push(`CHECKLIST MOTORHOME — CAMPERSPOT ${r.suc.toUpperCase()}`);
  L.push(`Patente: ${r.patente||"—"}   Cliente: ${r.cliente||"—"}`);
  L.push(`Arriendo: ${fecha(r.fi)} → ${fecha(r.ft)}`);
  L.push(`Avance: ${Math.round(n/t*100)}%   Estado: ${r.estado}`);
  L.push(`Adicionales: ${(r.adicionales||[]).length?r.adicionales.join(", "):"—"}`);
  if(r.obs) L.push(`Observaciones: ${r.obs}`);
  const itp=itemsPrep(r), pend=itp.filter(x=>!r.prep[x.k]);
  L.push(``,`PREPARACIÓN: ${itp.length-pend.length}/${itp.length}`);
  if(pend.length) L.push(`Pendiente: ${pend.map(x=>x.t+(x.adic?" (adicional)":"")).join(", ")}`);
  L.push(``,`ENTREGA`,`Millaje de salida: ${r.entrega.km||"—"}`);
  L.push(`Videos del recorrido: ${cuentaVideos(r)} de 3`);
  L.push(`Foto al tablero: ${(r.media.f_tab_s||[]).length?"sí":"pendiente"}`);
  L.push(``,`REVISIÓN`);
  gruposRev(r).forEach(g=>{
    const its=itemsRev(g,r);
    const mal=its.map(x=>({t:x.t+(x.adic?" (adicional)":""),v:r.rev[x.k],nota:r.revNota[x.k],
      n:(r.media["rev:"+x.k]||[]).length})).filter(x=>x.v==="dano"||x.n);
    const ok=its.filter(x=>r.rev[x.k]==="ok").length;
    L.push(`${g.t}: ${ok}/${its.length} OK`);
    mal.forEach(x=>L.push(`  · ${x.t} — DAÑO${x.nota?": "+x.nota:""}${x.n?` [${x.n} respaldo/s]`:" [sin respaldo]"}`));
  });
  L.push(``,`REPORTE FINAL`);
  const uso=(+r.reporte.km||0)-(+r.entrega.km||0);
  L.push(`Millaje de llegada: ${r.reporte.km||"—"}   Uso: ${uso>0?uso.toLocaleString("es-CL"):"—"}`);
  L.push(`Bencina: ${r.reporte.bencina||"—"}   Pedir gas: ${r.reporte.gas||"0"}`);
  const hs=hallazgos(r);
  L.push(``,`RESUMEN DE DAÑOS: ${hs.length+r.danos.length} hallazgo(s)`);
  hs.forEach(h=>L.push(`  · ${h.t} (${h.grupo}) — DAÑO${h.nota?": "+h.nota:""} [${h.media.length} respaldo/s]`));
  r.danos.forEach(d=>L.push(`  · ${d.zona||"sin zona"}: ${d.desc||"sin descripción"} [${(d.fotos||[]).length} respaldo/s]`));
  if(!hs.length&&!r.danos.length) L.push(`  Sin daños registrados.`);
  return L.join("\n");
}
function modalResumen(){
  const txt=textoResumen(S.r);
  modal(`<h3>Resumen de la ficha</h3><pre class="res" id="res">${esc(txt)}</pre>
    <div class="row" style="margin-top:10px"><button class="btn acento" id="copiar" style="flex:1">Copiar para WhatsApp</button>
    <button class="btn ghost" id="imprimir">Imprimir</button></div>`);
  document.getElementById("copiar").onclick=async()=>{
    try{ await navigator.clipboard.writeText(txt); flash("Resumen copiado"); }
    catch(e){ const p=document.getElementById("res"); const s=getSelection();
      s.removeAllRanges(); const rg=document.createRange(); rg.selectNodeContents(p); s.addRange(rg);
      flash("Selecciónalo y copia con Ctrl+C"); }
  };
  document.getElementById("imprimir").onclick=()=>window.print();
}
async function copiar(txt,msg){
  try{ await navigator.clipboard.writeText(txt); flash(msg||"Copiado"); }
  catch(e){ modal(`<h3>Copia esto</h3><pre class="res">${esc(txt)}</pre>`); }
}
function fichaExport(r){
  const ru=rutas(r), ar=archivosDe(r);
  const {media, ...resto}=r;
  return {...resto, rutas:ru, archivos:ar, exportado:new Date().toISOString()};
}
function flash(msg,fijo){
  let e=document.getElementById("flash");
  if(!e){ e=document.createElement("div"); e.id="flash";
    e.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#26380B;color:#fff;padding:9px 15px;border-radius:4px;font-size:14px;z-index:80;pointer-events:none";
    document.body.appendChild(e); }
  e.textContent=msg; e.style.opacity="1";
  clearTimeout(e._t);
  /* Los avisos "fijos" igual se borran a los 30 s. Si una operación tarda
     más que eso, algo falló y dejar el cartel puesto solo confunde. */
  e._t = setTimeout(()=>e.style.opacity="0", fijo ? 30000 : 1900);
}
