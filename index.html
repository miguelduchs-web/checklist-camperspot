<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Motorhome — Camper Spot</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#354C00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="apple-touch-icon" href="./icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --oliva:#354C00; --oliva-osc:#26380B; --oliva-cl:#4A6A0A;
  --salvia:#95AA71; --salvia-cl:#C6D4B2; --salvia-pal:#EBF0E2;
  --fondo:#F0F3EA; --panel:#fff;
  --tinta:#1A1E12; --gris:#6E7663; --linea:#D6DCC8;
  --ambar:#DFCB6B; --ambar-osc:#BFA944;
  --ok:#46731A; --dano:#A8341F; --alerta:#9A6B10;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,label,summary,input,select,textarea,.chk,.tri .set button,.tira,.ficha,.gauge{touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
}
h1,h2,h3,h4,.cond{font-family:"Barlow Condensed","Barlow Semi Condensed",system-ui,sans-serif;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 170px}

/* ---------- barra superior ---------- */
.top{background:var(--oliva);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top)}
body{overscroll-behavior-y:contain}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:9px calc(14px + env(safe-area-inset-right)) 9px calc(14px + env(safe-area-inset-left))}
.logo{width:36px;height:36px;border-radius:5px;display:block;flex:0 0 36px}
.marca{font-family:"Barlow Condensed";font-size:21px;font-weight:700;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.marca span{display:block;font-size:11px;font-weight:500;color:var(--salvia-cl);letter-spacing:.14em;font-family:"Barlow"}
.suc-sw{margin-left:auto;display:flex;background:var(--oliva-osc);border-radius:4px;overflow:hidden}
.suc-sw button{background:none;border:0;color:#BFCCAB;padding:8px 12px;font-family:"Barlow Condensed";font-size:16px;font-weight:600}
.suc-sw button[aria-pressed=true]{background:var(--salvia);color:#26380B}

/* ---------- medidor de etapas ---------- */
.rail{background:var(--oliva-osc);padding:8px 12px 10px;border-bottom:2px solid var(--salvia)}
.rail-in{max-width:820px;margin:0 auto;display:flex;gap:4px;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.gauge{flex:1;background:rgba(255,255,255,.06);border:1px solid #4C6317;border-radius:5px;
  padding:5px 6px 6px;text-align:left;min-width:0}
.gauge:active{background:rgba(255,255,255,.14)}
.gauge[aria-current=true]{background:var(--oliva);border-color:var(--ambar)}
.gauge b{display:block;font-family:"Barlow Condensed";font-size:13.5px;font-weight:600;color:#A9BC8C;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge[aria-current=true] b{color:var(--ambar)}
.gauge i{display:block;font-style:normal;font-size:11px;color:#8FA173;font-variant-numeric:tabular-nums}
.gauge .bars{display:flex;gap:2px;margin:4px 0 3px}
.gauge .bars s{flex:1;height:5px;background:#4C6317;text-decoration:none;border-radius:1px}
.gauge .bars s.on{background:var(--salvia)}
.gauge[data-full=true] .bars s.on{background:var(--salvia-cl)}

/* ---------- generico ---------- */
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);margin:12px 0}
.card>h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--linea);font-size:19px;display:flex;align-items:center;gap:8px;background:var(--salvia-pal);border-radius:var(--r) var(--r) 0 0;color:var(--oliva)}
.card>h3 em{margin-left:auto;font-style:normal;font-family:"Barlow";font-size:12px;color:var(--gris);font-variant-numeric:tabular-nums}
.pad{padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13px;color:var(--gris);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:11px 10px;border:1px solid var(--linea);border-radius:4px;background:#FBFCF8;min-height:46px;
  font-size:16px;-webkit-appearance:none;appearance:none
}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--oliva-cl);outline-offset:1px}
.hint{font-size:13px;color:var(--gris);margin:6px 0 0}
button.enlace{background:none;border:0;padding:0 0 0 6px;color:var(--oliva-cl);font-size:13px;
  text-decoration:underline;font-family:inherit}
.estado-sync{margin:10px 0 0;padding:9px 11px;border-radius:4px;font-size:13px;line-height:1.4;
  border:1px solid var(--linea);background:#FBFCF8;color:var(--gris)}
.estado-sync b{display:block;font-family:"Barlow Condensed";font-size:15px;font-weight:600}
.estado-sync[data-nivel=ok]{background:#EDF4E3;border-color:#C9DCAE}
.estado-sync[data-nivel=ok] b{color:var(--ok)}
.estado-sync[data-nivel=pendiente]{background:#FBF0D6;border-color:#E0C692}
.estado-sync[data-nivel=pendiente] b{color:#7A5409}
.estado-sync[data-nivel=espera] b{color:var(--oliva)}
h2.tit{color:var(--oliva);text-transform:uppercase;letter-spacing:.03em}

/* ---------- items ---------- */
.items{list-style:none;margin:0;padding:0}
.items li{border-bottom:1px solid #EDF0E5}
.items li:last-child{border-bottom:0}
.chk{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:11px 14px;text-align:left;font-size:15.5px;-webkit-user-select:none;user-select:none}
.chk .box{flex:0 0 24px;height:24px;border:2px solid #B4BD9E;border-radius:4px;position:relative}
.chk[aria-pressed=true]{background:#F1F6E9}
.chk[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed=true] .box:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}

.tri{padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tri>p{margin:0;flex:1 1 190px;font-size:15.5px}
.tri .set{display:flex;gap:4px}
.tri .set button{-webkit-user-select:none;user-select:none;border:1px solid var(--linea);background:#FBFCF8;border-radius:4px;padding:8px 11px;font-family:"Barlow Condensed";font-weight:600;font-size:14px;color:var(--gris);min-width:46px}
.tri .set button[aria-pressed=true][data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.tri .set button[aria-pressed=true][data-v=dano]{background:var(--dano);border-color:var(--dano);color:#fff}
.tri textarea{margin-top:2px;flex-basis:100%;min-height:52px}
.tri .resp{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap}
.tri .tiras{flex-basis:100%;margin-top:0}
.tri .tiras:empty{display:none}

/* ---------- media ---------- */
.slot{padding:12px 14px;border-bottom:1px solid #EDF0E5}
button.slot.tarea{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EDF0E5;border-left:4px solid var(--linea)}
button.slot.tarea:active{background:var(--salvia-pal)}
.slot:last-child{border-bottom:0}
.slot h4{margin:0 0 2px;font-size:17px}
.slot p{margin:0 0 9px;font-size:13px;color:var(--gris)}
.btn{-webkit-user-select:none;user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--oliva);background:var(--oliva);color:#fff;border-radius:4px;padding:11px 15px;font-family:"Barlow Condensed";font-weight:600;font-size:16px;min-height:46px}
.btn.ghost{background:#fff;color:var(--tinta)}
.btn.borrar-fi{border-color:#E2C3BD;color:var(--dano)}
.btn.borrar-fi:active{background:#F5E1DD}
.btn.acento{background:var(--ambar);border-color:var(--ambar-osc);color:#2E2A06;
  box-shadow:0 1px 0 var(--ambar-osc)}
.btn.acento:active{background:var(--ambar-osc);box-shadow:none;transform:translateY(1px)}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* Íconos de los botones: heredan el color del texto, así sirven igual
   sobre el botón oliva que sobre uno blanco. */
.ico{width:19px;height:19px;flex:0 0 19px;display:block}
.tiras{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tira{position:relative;width:88px;height:88px;border-radius:4px;overflow:hidden;border:1px solid var(--linea);background:var(--oliva-osc,#26380B);padding:0;display:block}
.tira .txt{position:static;display:flex;align-items:center;justify-content:center;height:100%;color:#C6D4B2;font-size:11px;text-align:center;padding:4px;background:none;
  text-decoration:none;line-height:1.25}
.suc-fija{font-family:"Barlow Condensed";font-weight:600;font-size:16px;color:var(--salvia-cl);padding:8px 4px}
.tira img,.tira video{width:100%;height:100%;object-fit:cover;display:block}
.tira[data-estado=local]{border-color:var(--alerta);border-style:dashed}
.tira[data-estado=listo]{border-color:var(--ok)}
.tira[data-estado=error]{border-color:var(--dano)}
.tira i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;font-style:normal;
  font-size:12px;line-height:20px;text-align:center;color:#fff;font-weight:700}
.tira i.ok{background:var(--ok)}
.tira i.err{background:var(--dano)}
.pb-caja{position:absolute;left:3px;right:3px;bottom:3px;height:4px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.pb{display:block;height:100%;background:var(--ambar);width:0;transition:width .2s}
.tira em{position:absolute;left:0;right:0;bottom:0;background:rgba(26,30,18,.78);color:#fff;font-style:normal;font-size:10.5px;padding:2px 4px;text-align:center}
.badge{display:inline-block;font-family:"Barlow Condensed";font-weight:600;font-size:12.5px;padding:2px 7px;border-radius:3px;background:#E3E9D7;color:#54603F}
.badge.ok{background:#E2EFD2;color:var(--ok)}
.badge.warn{background:#FBF0D6;color:#7A5409}
.badge.bad{background:#F5E1DD;color:var(--dano)}

/* ---------- lista fichas ---------- */
section.bloque{margin:18px 0 4px}
section.bloque h2.tit{font-size:20px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.ficha[data-fase=prep]{border-left-color:var(--ambar)}
.ficha[data-fase=entrega]{border-left-color:var(--ambar)}
.ficha[data-fase=ruta]{border-left-color:var(--salvia)}
.ficha[data-fase=revision]{border-left-color:var(--dano)}
.ficha[data-fase=reporte]{border-left-color:var(--oliva-cl)}
.ficha[data-fase=lista]{border-left-color:var(--ok)}
.ficha[data-fase=datos]{border-left-color:var(--linea)}
.ficha{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--linea);border-left:5px solid var(--ambar);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
.ficha[data-cerrada=true]{border-left-color:var(--ok)}
.ficha b{font-family:"Barlow Condensed";font-size:20px;display:block;line-height:1.1;color:var(--oliva);letter-spacing:.02em}
.ficha small{color:var(--gris);font-size:13px}
.ficha .m{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
.vacio{border:1px dashed #B6C09E;border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--gris);

/* ---------- pie fijo ---------- */
.pie{position:fixed;left:0;right:0;bottom:0;background:rgba(38,56,11,.97);padding:7px 12px calc(7px + env(safe-area-inset-bottom));z-index:45}
.pie-in{max-width:820px;margin:0 auto;display:flex;gap:7px;align-items:center;flex-wrap:nowrap;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.pie .nav{flex:0 0 36px;height:38px;border:1px solid #4C6317;background:#1F2E06;color:#fff;
  border-radius:4px;font-size:24px;line-height:1;padding:0;font-family:"Barlow Condensed"}
.pie .nav[disabled]{opacity:.3}
.pie .nav:active{background:var(--oliva)}
.pie .salir{white-space:nowrap}
.pie .est{color:var(--salvia-cl);font-size:12px;flex:1;min-width:0;text-align:center;overflow:hidden}
.pie .est b{color:#fff;display:block;font-family:"Barlow Condensed";font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Cuando falta subir algo, el centro del pie es un botón: se nota y se toca */
.pie .est-btn{appearance:none;-webkit-appearance:none;font:inherit;cursor:pointer;
  border:1px solid var(--salvia);border-radius:9px;background:rgba(149,170,113,.18);
  padding:3px 8px;min-height:34px;color:var(--salvia-cl)}
.pie .est-btn:active{background:rgba(149,170,113,.34)}
@media(max-width:470px){
  .pie{padding:5px 10px calc(5px + env(safe-area-inset-bottom))}
  .pie-in{gap:5px}
  .pie .nav{flex:0 0 32px;height:34px;font-size:21px}
  .pie .salir{padding:0 10px;min-height:34px;font-size:13px}
  .pie .est{font-size:0;line-height:0}
  .pie .est b{font-size:13px;line-height:1.2}
  /* el aviso de "falta subir" sí debe leerse en el teléfono */
  .pie .est-btn{font-size:10px;line-height:1.1;padding:2px 6px}
  .pie .est-btn b{font-size:12px}
}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(26,30,18,.62);display:flex;align-items:flex-end;justify-content:center;z-index:60}
/* 820px dejaba los formularios muy estirados en el computador */
.modal .box{background:#fff;width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 10px;font-size:21px}
.volver-modal{position:sticky;top:0;z-index:3;display:block;width:calc(100% + 32px);margin:0 -16px 12px;
  padding:13px 16px;background:#fff;border:0;border-bottom:1px solid var(--linea);
  font-family:"Barlow Condensed";font-weight:600;font-size:16px;color:var(--oliva);
  text-align:left;cursor:pointer}
.volver-modal:active{background:var(--salvia-pal)}
/* En pantalla ancha el modal se centra en vez de pegarse abajo */
@media(min-width:720px){
  .modal{align-items:center}
  .modal .box{border-radius:10px;max-height:86vh}
}
.ruta{border:1px solid var(--linea);border-radius:4px;background:#FBFCF8;padding:10px;margin-bottom:10px}
.ruta>span{display:block;font-size:12.5px;color:var(--gris);margin-bottom:5px}
.ruta code{display:block;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;margin-bottom:8px;color:var(--tinta)}
ul.arch{list-style:none;margin:5px 0 0;padding:0}
ul.arch li{padding:4px 0;border-bottom:1px solid #EDF0E5;font-size:13px}
ul.arch li:last-child{border-bottom:0}
ul.arch code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
ul.arch small{color:var(--gris);display:block}
ul.arch li.vacia{color:var(--gris);font-style:italic}
.sub{padding:9px 14px 4px;border-top:1px solid var(--linea);background:#F7F9F1;font-family:"Barlow Condensed";font-weight:600;font-size:15px;color:var(--gris)}
.desplegable{border:1px solid var(--linea);border-radius:4px;background:#FBFCF8;margin-bottom:10px}
.aviso-doc{background:#F6EBD3;border-color:#E0C692;margin-top:12px}
.aviso-doc>summary{color:#6B4A08;font-size:14px}
.aviso-doc>summary b{color:#6B4A08;margin-left:0}
.desplegable>summary{list-style:none;cursor:pointer;padding:12px 10px;min-height:46px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris)}
.desplegable>summary::-webkit-details-marker{display:none}
.desplegable>summary b{margin-left:auto;text-align:right;font-family:"Barlow";font-weight:500;font-size:14px;color:var(--tinta)}
.desplegable>summary:after{content:"▾";color:var(--gris);flex:0 0 auto}
.desplegable[open]>summary{border-bottom:1px solid var(--linea)}
.desplegable[open]>summary:after{content:"▴"}
.desplegable .items{background:#fff;border-radius:0 0 4px 4px}
.aviso{background:#F6EBD3;border:1px solid #E0C692;border-radius:4px;padding:10px 12px;font-size:13.5px;color:#6B4A08;margin:12px 0}
.aviso b{font-family:"Barlow Condensed";font-size:15px}
pre.res{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12.5px;background:#F2F5EA;border:1px solid var(--linea);border-radius:4px;padding:11px;max-height:44vh;overflow:auto}
@media(prefers-reduced-motion:no-preference){.tira{transition:opacity .15s}}
</style>

/* Qué cambia entre un tipo y otro. El prefijo es SOLO para mostrar: la

  cr: { etiqueta:"CR", nombre:"Casa rodante", prep:PREP_CR, rev:REV_CR,

/* ══════════ ALMACENAMIENTO ══════════ */
/* Usa IndexedDB en el navegador. Si corre dentro de un entorno con window.storage, lo prefiere. */
const MEM = {}; let SIN_DISCO = false;

const IDB = {
  db:null,
  abrir(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((ok,err)=>{
      const p = indexedDB.open("camperspot", 1);
      p.onupgradeneeded = ()=>{ p.result.createObjectStore("kv"); };
      p.onsuccess = ()=>{ this.db=p.result; ok(this.db); };
      p.onerror = ()=>err(p.error);
    });
  },
  async tx(modo){ const db=await this.abrir(); return db.transaction("kv",modo).objectStore("kv"); },
  async get(k){ const t=await this.tx("readonly");
    return new Promise((ok,err)=>{ const r=t.get(k); r.onsuccess=()=>ok(r.result??null); r.onerror=()=>err(r.error); }); },
  async set(k,v){ const t=await this.tx("readwrite");
    return new Promise((ok,err)=>{ const r=t.put(v,k); r.onsuccess=()=>ok(true); r.onerror=()=>err(r.error); }); },
  async del(k){ const t=await this.tx("readwrite");
    return new Promise((ok,err)=>{ const r=t.delete(k); r.onsuccess=()=>ok(true); r.onerror=()=>err(r.error); }); },
  async list(pref){ const t=await this.tx("readonly");
    return new Promise((ok,err)=>{ const r=t.getAllKeys(IDBKeyRange.bound(pref, pref+"\uffff"));
      r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>err(r.error); }); },
};

const NATIVO = typeof window!=="undefined" && !!window.storage;

const St = {
  async get(k){
    if(SIN_DISCO) return MEM[k]??null;
    try{
      if(NATIVO){ const r=await window.storage.get(k); return r?r.value:null; }
      return await IDB.get(k);
    }catch(e){ return MEM[k]??null; }
  },
  async set(k,v){
    MEM[k]=v;
    try{
      if(NATIVO) await window.storage.set(k,v); else await IDB.set(k,v);
    }catch(e){ SIN_DISCO=true; }
  },
  async del(k){
    delete MEM[k];
    try{ if(NATIVO) await window.storage.delete(k); else await IDB.del(k); }catch(e){}
  },
  async list(p){
    if(SIN_DISCO) return Object.keys(MEM).filter(k=>k.startsWith(p));
    try{
      if(NATIVO){ const r=await window.storage.list(p); return r?r.keys:[]; }
      return await IDB.list(p);
    }catch(e){ return Object.keys(MEM).filter(k=>k.startsWith(p)); }
  },
};

/* ══════════ PROGRESO ══════════ */
const adicSel = r => (r.adicionales||[]).filter(a=>a!=="Ninguno");
const itemsPrep = r => cfgTipo(r).prep.map((t,i)=>({k:"p"+i,t})).concat(adicSel(r).map(a=>({k:"a:"+a,t:a,adic:1})));
const itemsRev = (g,r) => g.items.map((t,i)=>({k:g.id+i,t}))
  .concat(g.id==="falta" ? adicSel(r).map(a=>({k:"falta_a:"+a,t:a,adic:1})) : []);

function prog(r,et){
  if(!r) return [0,1];
  if(et==="datos"){ const c=[r.patente,r.cliente,r.fi,r.ft]; return [c.filter(Boolean).length,c.length]; }
  if(et==="prep"){ const it=itemsPrep(r); return [it.filter(x=>r.prep[x.k]).length, it.length]; }
  /* Una casa rodante no tiene tablero ni motor: en Entrega solo cuentan
     los videos, y en Reporte no se pide millaje. Si se contaran igual que
     en una motorhome, nunca llegaría al 100%. */
  const cfg = cfgTipo(r);
  if(et==="entrega"){
    let n=0, tot=1;
    if(cuentaVideos(r) >= 3) n++;
    if(cfg.tablero){ tot++; if((r.media.f_tab_s||[]).length) n++; }
    if(cfg.millaje){ tot++; if(r.entrega.km) n++; }
    return [n,tot];
  }
  if(et==="revision"){
    let n=0, tot=0;
    if(cfg.tablero){ tot++; if((r.media.f_tab_l||[]).length) n++; }
    gruposRev(r).forEach(g=>itemsRev(g,r).forEach(x=>{ tot++; if(r.rev[x.k]) n++; }));
    return [n, tot||1];
  }
  const c=[...(cfg.millaje?[r.reporte.km]:[]), ...(cfg.bencina?[r.reporte.bencina]:[]), r.reporte.gas];
  return [c.filter(Boolean).length, c.length];
}
function faseDe(r){
  if(r.estado==="cerrado") return {k:"cerrada", t:"Cerrada", etapa:"reporte"};
  const listo = k=>{ const[n,t]=prog(r,k); return n>=t; };
  if(!listo("datos"))   return {k:"datos",   t:"Faltan datos",    etapa:"datos"};
  if(!listo("prep"))    return {k:"prep",    t:"Por preparar",    etapa:"prep"};
  if(!listo("entrega")) return {k:"entrega", t:"Por entregar",    etapa:"entrega"};
  if(r.ft && r.ft >= hoy() && !Object.keys(r.rev||{}).length)
                        return {k:"ruta",    t:"En ruta",         etapa:"revision"};
  if(!listo("revision"))return {k:"revision",t:"Por revisar",     etapa:"revision"};
  if(!listo("reporte")) return {k:"reporte", t:"Por cerrar",      etapa:"reporte"};
  return {k:"lista", t:"Lista para cerrar", etapa:"reporte"};
}
const FASES=[
  {k:"prep",    t:"Por preparar",       d:"Alistar la máquina antes de la salida"},
  {k:"entrega", t:"Por entregar",       d:"Grabar el recorrido y registrar el millaje"},
  {k:"ruta",    t:"En ruta",            d:"Arriendos en curso"},
  {k:"revision",t:"Por revisar",        d:"Recibir la máquina y chequearla"},
  {k:"reporte", t:"Por cerrar",         d:"Millaje, bencina y gas"},
  {k:"lista",   t:"Listas para cerrar", d:"Sin nada pendiente"},
  {k:"datos",   t:"Faltan datos",       d:"Sin patente, cliente o fechas"},
];
const cuentaVideos = r => SLOTS_VIDEO.reduce((a,d)=>a+videosDe(r,d.k).length,0);
const progTotal = r => ETAPAS.reduce((a,e)=>{const[n,t]=prog(r,e.k);return[a[0]+n,a[1]+t]},[0,0]);

/* Elegir una patente para mirar no debería crear un arriendo. Recién se
   archiva cuando hay algo escrito o marcado, o al apretar Guardar y salir. */
function tieneContenido(r){
  if((r.cliente||"").trim()) return true;
  if(Object.values(r.prep||{}).some(Boolean)) return true;
  if(Object.values(r.rev||{}).some(Boolean)) return true;
  if((r.adicionales||[]).length) return true;
  if((r.danos||[]).length) return true;
  if(Object.values(r.media||{}).some(a=>(a||[]).length)) return true;
  if(Object.values(r.driveVids||{}).some(a=>(a||[]).length)) return true;
  if((r.entrega||{}).km || (r.reporte||{}).km) return true;
  if((r.obs||"").trim()) return true;
  return false;
}

async function guardaFicha(forzar){
  const r=S.r; if(!r) return;
  const yaExiste = S.indice.some(x=>x.id===r.id);
  if(!yaExiste && !forzar && !tieneContenido(r)) return;   // aún no hay nada que archivar
  if(!r.driveCarpeta) r.driveNombre = nombreCarpeta(r);
  else if(r.driveNombre !== nombreCarpeta(r)) setTimeout(()=>renombraCarpeta(r), 0);
  r.act=Date.now();
  const [n,t]=progTotal(r);
  const res=resumenDe(r);
  const i=S.indice.findIndex(x=>x.id===r.id);
  if(i<0) S.indice.unshift(res); else S.indice[i]=res;
  await St.set("r:"+r.id, JSON.stringify(r));
  await guardaIndice();
  marcaParaSubir(r.id);
  S.guardado=Date.now(); pintaPie();
  /* Daños Y millaje pasan a la flota en cada guardado. Antes el millaje
     solo se traspasaba al CERRAR el arriendo, así que escribirlo no se
     reflejaba en la flota hasta mucho después. */
  if(r.patente){ clearTimeout(guardaFicha._flota);
    guardaFicha._flota = setTimeout(async()=>{
      await danosAFlota(r); await millajeAFlota(r); }, 900); }
  if(hayDrive() && datosListos(r) && !PREPARANDO &&
     SLOTS_VIDEO.some(def=>!(r.driveSubs||{})["Videos/"+def.carpeta]))
    setTimeout(alistaVideos, 0);
}
/* Guarda la pestaña actual SOLO en este dispositivo: no toca la ficha
   compartida, así que navegar ya no le sube la versión a nadie. */
function recuerdaEtapa(){
  if(!S.r) return;
  S.r.ultimaEtapa = S.etapa;
  try{ St.set("etapa:"+S.r.id, S.etapa); }catch(e){}
}

async function abreFicha(id){
  let raw = await St.get("r:"+id);
  if(!raw){
    const baja = await traeFicha(id);
    if(!baja){
      const res = S.indice.find(x=>x.id===id) || {};
      modal(`<h3>Este arriendo no tiene datos</h3>
        <p style="margin:0 0 10px">Aparece en la lista pero su ficha no está ni en este dispositivo
        ni en Drive. Suele pasar con registros creados por error o borrados a medias.</p>
        <div class="aviso" style="margin:0 0 12px"><b>${esc(res.carpeta||res.patente||"Sin datos")}</b><br>
          ${esc(res.cliente||"Sin cliente")} · ${res.pct||0}% completo</div>
        <button class="btn acento wide" data-limpiahuerfana="${id}">Quitarlo de la lista</button>`);
      return;
    }
    raw = JSON.stringify(baja);
  }
  S.r = JSON.parse(raw); S.vista="ficha";
  if(!Array.isArray(S.r.adicionales)) S.r.adicionales = S.r.adicionales ? [S.r.adicionales] : [];
  delete S.r.operador;
  Object.keys(S.r.rev||{}).forEach(k=>{ if(S.r.rev[k]==="obs") S.r.rev[k]="dano"; });
  for(const k of Object.keys(S.r.media||{})){
    for(const m of S.r.media[k]){
      if(m.tipo==="foto" && !FOTOS[m.id]){ const d=await St.get("f:"+m.id); if(d) FOTOS[m.id]=d; }
      if(m.thumb && !THUMBS[m.id]){ const d=await St.get("t:"+m.id); if(d) THUMBS[m.id]=d; }
    }
  }
  for(const d of S.r.danos||[]) for(const m of d.fotos||[]){
    if(m.tipo==="foto" && !FOTOS[m.id]){ const x=await St.get("f:"+m.id); if(x) FOTOS[m.id]=x; }
    if(m.thumb && !THUMBS[m.id]){ const x=await St.get("t:"+m.id); if(x) THUMBS[m.id]=x; }
  }
  /* En qué pestaña quedaste es cosa de ESTE equipo. Antes viajaba dentro de
     la ficha, así que navegar entre pestañas contaba como editar y le subía
     la versión a todos: quien estuviera trabajando quedaba desactualizado y
     su guardado terminaba rechazado. */
  /* Una ficha creada antes de que existieran los tipos adopta el suyo al
     abrirse, y desde ahí viaja con ella en el próximo guardado. Solo se sella
     si la flota ya dice qué tipo es: sellar a ciegas fijaría un tipo
     equivocado justo en el equipo que todavía no recibió el vehículo.
     Y NO se marca para subir: eso la dejaría "pendiente" por el solo hecho
     de abrirla, y una ficha pendiente deja de recibir los cambios del otro. */
  if(!S.r.tipo && S.r.patente && FLOTA.veh[S.r.patente] && FLOTA.veh[S.r.patente].tipo)
    S.r.tipo = FLOTA.veh[S.r.patente].tipo;
  setTimeout(()=>reanudaSubidas(S.r), 400);   // lo que quedó a medio subir
  const etapaLocal = await St.get("etapa:"+id);
  const recordada = etapaLocal || S.r.ultimaEtapa || "";
  if(recordada==="entrega") setTimeout(alistaVideos,300);
  S.etapa = (recordada && ETAPAS.some(e=>e.k===recordada)) ? recordada : faseDe(S.r).etapa;
  S.original = raw;            // copia intacta, para poder salir sin guardar
  S.baseAct = (S.indice.find(x=>x.id===id)||{}).act || S.r.act || 0;
  pinta();
}

/* Devuelve la ficha a como estaba al abrirla. El autoguardado sigue activo
   para no perder trabajo si se apaga la pantalla; esto deshace esa escritura. */
async function descartaCambios(){
  const r=S.r; if(!r) return;
  const nueva = !S.indice.some(x=>x.id===r.id);
  if(nueva){
    await St.del("r:"+r.id);
    S.indice = S.indice.filter(x=>x.id!==r.id);
    await guardaIndice();
  }else if(S.original){
    await St.set("r:"+r.id, S.original);
    const prev = JSON.parse(S.original);
    const [n,t] = progTotal(prev);
    const i = S.indice.findIndex(x=>x.id===r.id);
    if(i>=0){
      S.indice[i] = {...S.indice[i], patente:prev.patente, cliente:prev.cliente, fi:prev.fi, ft:prev.ft,
                     estado:prev.estado, pct:Math.round(n/t*100), fase:faseDe(prev).k,
                     carpeta:nombreCarpeta(prev), driveCarpeta:prev.driveCarpeta||""};
      await guardaIndice();
    }
  }
  S.original=null; S.vista="inicio"; S.r=null; pinta();
  flash(nueva ? "Ficha descartada" : "Cambios descartados");
}
const hayCambios = ()=> !!(S.r && S.original && JSON.stringify({...S.r, act:0, ultimaEtapa:0})
                            !== JSON.stringify({...JSON.parse(S.original), act:0, ultimaEtapa:0}));
async function borraFicha(id){
  const raw=await St.get("r:"+id);
  if(raw){ const r=JSON.parse(raw);
    for(const k of Object.keys(r.media||{})) for(const m of r.media[k]) if(m.tipo==="foto") await St.del("f:"+m.id);
    for(const d of r.danos||[]) for(const m of d.fotos||[]) await St.del("f:"+m.id);
  }
  await St.del("r:"+id);
  S.indice=S.indice.filter(x=>x.id!==id);
  S.borradas=(S.borradas||[]).concat([{id, t:Date.now()}]);
  BD.pend.arriendos.delete(id);
  await guardaIndice();
  if(await hayBase()){
    try{ await api("/db/borrar", { tabla:"arriendos", llaves:[id], equipo:nombreEquipo() }); }
    catch(e){ flash("Se borró aquí, pero no se pudo avisar al servidor: "+corta(e.message||e)); }
  } else subeArriendos();
  if(S.r && S.r.id===id){ S.r=null; S.original=null; S.vista="inicio"; }
  pinta(); flash("Arriendo eliminado");
}

/* ══════════ IMÁGENES ══════════ */
const THUMBS = {};
function miniaturaVideo(file){
  return new Promise(ok=>{
    let listo=false; const fin=v=>{ if(!listo){ listo=true; ok(v); } };
    const v=document.createElement("video");
    v.preload="metadata"; v.muted=true; v.playsInline=true;
    const u=URL.createObjectURL(file); v.src=u;
    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(1, (v.duration||3)/3); }catch(e){ fin(null); } };
    v.onseeked=()=>{
      try{
        const c=document.createElement("canvas");
        const e=Math.min(1, 260/Math.max(v.videoWidth||260, v.videoHeight||260));
        c.width=Math.round((v.videoWidth||260)*e); c.height=Math.round((v.videoHeight||260)*e);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        fin(c.toDataURL("image/jpeg",.6));
      }catch(e){ fin(null); }
      URL.revokeObjectURL(u);
    };
    v.onerror=()=>{ URL.revokeObjectURL(u); fin(null); };
    setTimeout(()=>{ URL.revokeObjectURL(u); fin(null); }, 7000);
  });
}

function comprime(file,max=1800,q=.72){
  return new Promise((ok,err)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ let{width:w,height:h}=im; const e=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*e); h=Math.round(h*e);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        ok(c.toDataURL("image/jpeg",q)); };
      im.onerror=err; im.src=fr.result; };
    fr.onerror=err; fr.readAsDataURL(file);
  });
}

async function subir(slotKey, files, danoId){
  const r=S.r; const arr=[...files]; if(!arr.length) return;
  let hechos=0;
  flash(`Procesando 1 de ${arr.length}…`, true);
  for(const file of arr){
    flash(`Procesando ${++hechos} de ${arr.length}…`, true);
    const id=uid();
    if(file.type.startsWith("video")){
      ARCHIVOS[id]=file;
      const m={id,tipo:"video",nombre:file.name,peso:file.size};
      const th=await miniaturaVideo(file);
      if(th){ THUMBS[id]=th; await St.set("t:"+id, th); m.thumb=1; }
      push(slotKey,m,danoId); encolar(r,slotKey,danoId,m);
    }else{
      let data; try{ data=await comprime(file); }catch(e){ flash("No se pudo leer la imagen"); continue; }
      FOTOS[id]=data;
      await St.set("f:"+id, data);
      const m={id,tipo:"foto",nombre:file.name,peso:data.length};
      push(slotKey,m,danoId); encolar(r,slotKey,danoId,m);
    }
  }
  await guardaFicha(); pinta();
  /* Cierra el "Procesando…", que antes quedaba puesto para siempre y
     parecía que la carga nunca terminaba aunque ya estuviera lista. */
  flash(arr.length>1 ? arr.length+" archivos agregados" : "Archivo agregado");
}
function push(slot,item,danoId){
  const r=S.r;
  if(danoId){ const d=r.danos.find(x=>x.id===danoId); (d.fotos=d.fotos||[]).push(item); }
  else { (r.media[slot]=r.media[slot]||[]).push(item); }
}
async function quitaArchivo(id){
  const i=COLA.findIndex(t=>t.id===id); if(i>=0) COLA.splice(i,1);
  delete ARCHIVOS[id];
  await St.del("f:"+id); delete FOTOS[id];
  await St.del("t:"+id); delete THUMBS[id];
}
async function quitaMedia(slot,id,danoId){
  const r=S.r;
  if(danoId){ const d=r.danos.find(x=>x.id===danoId); d.fotos=d.fotos.filter(m=>m.id!==id); }
  else r.media[slot]=(r.media[slot]||[]).filter(m=>m.id!==id);
  await St.del("f:"+id); delete FOTOS[id];
  await St.del("t:"+id); delete THUMBS[id];
  await guardaFicha(); pinta(true);
}


/* ══════════ CONEXIÓN CON GOOGLE DRIVE ══════════ */
let CFG = { url:"https://drive-camperspot.miguelduchs.workers.dev", clave:"", raizId:"", huella:"" };
const hayDrive = ()=> !!(CFG.url && CFG.clave);
const corta = t => { t=String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  return t.length>180 ? t.slice(0,180)+"…" : t; };
const ARCHIVOS = {};          // id -> File o Blob pendiente de subir (solo esta sesión)
const COLA = [];              // trabajos de subida

async function cargaCfg(){
  const raw = await St.get("cfg");
  if(raw){ try{ CFG = {...CFG, ...JSON.parse(raw)}; }catch(e){} }
  await cfgDesdeEnlace();
}

/* Un enlace con ?k=clave deja el dispositivo configurado de una */
async function cfgDesdeEnlace(){
  try{
    const p = new URLSearchParams(location.search);
    const k = p.get("k"), w = p.get("w");
    if(!k && !w) return;
    if(w) CFG.url = decodeURIComponent(w);
    if(k && k !== CFG.clave){ CFG.clave = k; CFG.raizId=""; CFG.huella=""; CFG.estadoId=""; }
    await guardaCfg();
    history.replaceState(null, "", location.pathname);   // la clave no queda a la vista
  }catch(e){}
}
const enlaceConfig = () =>
  location.origin + location.pathname + "?k=" + encodeURIComponent(CFG.clave) +
  "&w=" + encodeURIComponent(CFG.url);
async function guardaCfg(){ await St.set("cfg", JSON.stringify(CFG)); }

async function api(ruta, cuerpo){
  const r = await fetch(CFG.url.replace(/\/$/,"") + ruta, {
    method: cuerpo ? "POST" : "GET",
    headers: { "Content-Type":"application/json", "x-clave": CFG.clave },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const txt = await r.text();
  let d={};
  try{ d=JSON.parse(txt); }catch(e){ throw new Error("Respuesta inesperada del servidor"); }
  if(!r.ok) throw new Error(corta(d.error || ("HTTP "+r.status)));
  return d;
}

/* Dónde va cada archivo dentro de la carpeta del arriendo */
function destino(r, slot, danoId, indice){
  if(danoId){
    const d=(r.danos||[]).find(x=>x.id===danoId);
    return { sub:"Daños", base: slug(d && d.zona || "sin-zona") };
  }
  if(String(slot).startsWith("rev:")){
    const k=slot.slice(4);
    let t=k;
    gruposRev(r).forEach(g=>itemsRev(g,r).forEach(x=>{ if(x.k===k) t=x.t; }));
    return { sub:"Daños", base: slug(t) };
  }
  const sv=SLOTS_VIDEO.find(x=>x.k===slot);
  if(sv) return { sub:"Videos/"+sv.carpeta, base:sv.archivo };
  if(NOMBRES[slot]) return { sub:"Ficha", base:NOMBRES[slot] };
  return { sub:"Ficha", base: slug(slot||"archivo") };
}

function encolar(r, slot, danoId, media){
  if(!hayDrive()){ media.estado="local"; return; }
  media.estado = "pendiente";
  media.equipo = nombreEquipo();     // solo este equipo tiene los bytes
  COLA.push({ id:media.id, fichaId:r.id, slot, danoId, media });
  procesaCola();
}

/* La cola de subida vive en memoria. Si la app se recarga o se cierra con
   un archivo en camino, la cola desaparece y ese archivo queda marcado
   "subiendo" PARA SIEMPRE: nunca se reintenta y nunca llega a Drive, pero
   la app lo muestra como si estuviera bien. Esto lo retoma al abrir la ficha.
   Las fotos se pueden recuperar porque sus bytes quedan guardados aquí; los
   videos no, así que esos se marcan para volver a subirlos a mano. */
const aMedias = m => m && !m.driveId && /^(subiendo|pendiente|reintento)$/.test(m.estado||"");

async function reanudaSubidas(r){
  if(!hayDrive() || !navigator.onLine || !r) return 0;
  const sueltos = [];
  for(const slot of Object.keys(r.media||{}))
    for(const m of r.media[slot]||[]) if(aMedias(m)) sueltos.push({slot, danoId:"", m});
  for(const d of r.danos||[])
    for(const m of d.fotos||[]) if(aMedias(m)) sueltos.push({slot:"", danoId:d.id, m});

  let n = 0;
  for(const {slot, danoId, m} of sueltos){
    if(COLA.some(x=>x.id===m.id)) continue;             // ya está en camino
    if(!ARCHIVOS[m.id]){
      const dato = await St.get("f:"+m.id);
      if(dato) FOTOS[m.id] = dato;
      /* Sin los bytes aquí: si la subida la empezó OTRO equipo, ese la va a
         retomar y no hay que tocarla. Marcarla como perdida desde acá
         saboteaba una subida que el otro dispositivo sí podía terminar. */
      else if(m.equipo && m.equipo !== nombreEquipo()) continue;
      else {                                            // un video: sus bytes no se guardan
        m.estado = "error";
        m.detalle = "se interrumpió al cerrar la app · vuelve a subirlo";
        continue;
      }
    }
    encolar(r, slot, danoId, m);
    n++;
  }
  if(sueltos.length){ await guardaFicha(); if(S.r && S.r.id===r.id) pintaSubidas(); }
  if(n) flash(n===1 ? "Retomando una subida que quedó a medias" : `Retomando ${n} subidas que quedaron a medias`);
  return n;
}

let ACTIVAS = 0;
const MAX_PARALELO = 2;

async function procesaCola(){
  if(!hayDrive()) return;
  while(ACTIVAS < MAX_PARALELO && COLA.some(t=>!t.tomado)){
    const t = COLA.find(x=>!x.tomado);
    t.tomado = true; ACTIVAS++;
    trabaja(t).finally(()=>{
      ACTIVAS--;
      const i=COLA.indexOf(t); if(i>=0) COLA.splice(i,1);
      if(S.r && S.r.id===t.fichaId){ pintaSubidas(); guardaFicha(); }
      procesaCola();
    });
  }
}

async function trabaja(t){
  for(let intento=1; intento<=3; intento++){
    try{
      t.media.estado = intento>1 ? "reintento" : "subiendo";
      if(S.r && S.r.id===t.fichaId) pintaSubidas();
      await subeArchivo(t);
      t.media.estado="listo"; delete t.media.detalle;
      return;
    }catch(e){
      t.media.detalle = corta(e.message||e);
      if(intento<3) await new Promise(r=>setTimeout(r, intento*2500));
    }
  }
  const llego = await verificaEnDrive(t);
  if(llego){ t.media.estado="listo"; t.media.driveId=llego; t.media.pct=100; delete t.media.detalle; return; }
  t.media.estado="error";
  flash("No se pudo subir: "+t.media.detalle);
}

/* El aviso de error puede ser falso: en móvil la conexión se corta justo al
   terminar y el archivo ya quedó en Drive. Antes de marcar error, se mira. */
async function verificaEnDrive(t){
  try{
    const r = S.r && S.r.id===t.fichaId ? S.r : JSON.parse(await St.get("r:"+t.fichaId));
    const d = destino(r, t.slot, t.danoId);
    const carpetaId = (r.driveSubs||{})[d.sub];
    if(!carpetaId) return "";
    const lista = await api("/listar?carpetaId="+encodeURIComponent(carpetaId));
    const esperado = nombreArchivo(r, t, d);
    const f = (lista.files||[]).find(x=>x.name===esperado);
    return f ? f.id : "";
  }catch(e){ return ""; }
}

/* Un solo lugar decide cómo se llama el archivo, para que la verificación
   busque exactamente el mismo nombre que usó la subida. */
function nombreArchivo(r, t, d){
  const lista = t.danoId ? ((r.danos.find(x=>x.id===t.danoId)||{}).fotos||[]) : (r.media[t.slot]||[]);
  const i = Math.max(0, lista.findIndex(m=>m.id===t.id));
  const ext = EXT(t.media.nombre) || (t.media.tipo==="video" ? "mp4" : "jpg");
  return `${d.base}${i?"-"+(i+1):""}.${ext}`;
}

/* PUT con progreso real. XHR permite seguir el avance del envío, fetch no. */
function enviar(url, blob, rango, onProg){
  return new Promise((ok,err)=>{
    const x=new XMLHttpRequest();
    x.open("PUT", url, true);
    if(rango) x.setRequestHeader("Content-Range", rango);
    x.upload.onprogress = e=>{ if(e.lengthComputable) onProg(e.loaded, e.total); };
    x.onload = ()=>ok({ status:x.status, texto:x.responseText, rango:x.getResponseHeader("Range") });
    x.onerror = ()=>err(new Error("Se cortó la conexión durante la subida"));
    x.onabort = ()=>err(new Error("Subida cancelada"));
    x.send(blob);
  });
}

const UMBRAL_TROZOS = 200 * 1024 * 1024;   // bajo esto va de una sola pasada
const TROZO = 32 * 1024 * 1024;

async function subeArchivo(t){
  const r = S.r && S.r.id===t.fichaId ? S.r : JSON.parse(await St.get("r:"+t.fichaId));
  const blob = ARCHIVOS[t.id] || (FOTOS[t.id] ? await (await fetch(FOTOS[t.id])).blob() : null);
  if(!blob) throw new Error("El archivo ya no está en memoria");

  const d = destino(r, t.slot, t.danoId);
  const nombre = nombreArchivo(r, t, d);

  const carpetaId = await carpetaSub(r, d.sub);
  const { subidaUrl } = await api("/sesion", {
    carpetaId, nombre, mime: blob.type || "application/octet-stream", tamano: blob.size,
  });

  const avanza = (hechos)=>{
    t.media.pct = Math.min(100, Math.round(hechos / blob.size * 100));
    if(S.r && S.r.id===t.fichaId) pintaSubidas();
  };

  let respuesta = null;

  if(blob.size <= UMBRAL_TROZOS){
    const res = await enviar(subidaUrl, blob, `bytes 0-${blob.size-1}/${blob.size}`, cargado=>avanza(cargado));
    if(res.status>=200 && res.status<300) respuesta = JSON.parse(res.texto||"{}");
    else throw new Error("Drive respondió "+res.status);
  }else{
    let desde = 0;
    while(desde < blob.size){
      const hasta = Math.min(desde + TROZO, blob.size);
      const base = desde;
      const res = await enviar(subidaUrl, blob.slice(desde, hasta),
        `bytes ${desde}-${hasta-1}/${blob.size}`, cargado=>avanza(base + cargado));
      if(res.status === 308){
        desde = res.rango ? Number(res.rango.split("-")[1]) + 1 : hasta;
      }else if(res.status>=200 && res.status<300){
        respuesta = JSON.parse(res.texto||"{}");
        desde = blob.size;
      }else throw new Error("Drive respondió "+res.status);
      avanza(desde);
    }
  }

  t.media.driveId = respuesta && respuesta.id || "";
  t.media.pct = 100;
  delete ARCHIVOS[t.id];
}

/* Huella del destino: nombre de la carpeta base + unidad donde vive.
   Si cambia cualquiera de los dos, los ids guardados ya no sirven y se
   vuelven a crear solos, sin que nadie tenga que acordarse de limpiar. */
async function huellaDestino(){
  if(S.huella) return S.huella;
  try{
    const d = await api("/ping");
    S.huella = (d.driveId||"mi-unidad") + "|" + (d.raiz||RAIZ);
  }catch(e){ S.huella = CFG.huella || ""; }
  return S.huella;
}
async function carpetaRaiz(){
  const fp = await huellaDestino();
  if(fp && CFG.huella !== fp){ CFG.raizId=""; CFG.estadoId=""; CFG.huella=fp; await guardaCfg(); }
  if(CFG.raizId) return CFG.raizId;
  return unaVez("raiz", async()=>{
    if(CFG.raizId) return CFG.raizId;
    const { carpetaId } = await api("/carpeta", { ruta:[RAIZ] });
    CFG.raizId = carpetaId; await guardaCfg();
    return carpetaId;
  });
}
async function carpetaArriendo(r){
  const fp = await huellaDestino();
  if(fp && r.driveCarpeta && r.driveHuella !== fp){
    delete r.driveCarpeta; delete r.driveSubs; delete r.driveVids;
    if(S.r && S.r.id===r.id){ delete S.r.driveCarpeta; delete S.r.driveSubs; delete S.r.driveVids; }
  }
  if(r.driveCarpeta) return r.driveCarpeta;
  return unaVez(`arr|${r.id}`, async()=>{
    if(r.driveCarpeta) return r.driveCarpeta;
    const padreId = await carpetaRaiz();
    const { carpetaId } = await api("/carpeta", { ruta:[nombreCarpeta(r)], padreId });
    r.driveCarpeta = carpetaId; r.driveHuella = await huellaDestino();
    if(S.r && S.r.id===r.id){ S.r.driveCarpeta = carpetaId; S.r.driveHuella = r.driveHuella; }
    return carpetaId;
  });
}
/* Los ids se guardan en la ficha para no volver a buscarlos en cada archivo */
const EN_VUELO = new Map();
function unaVez(clave, fn){
  if(EN_VUELO.has(clave)) return EN_VUELO.get(clave);
  const p = fn().finally(()=>EN_VUELO.delete(clave));
  EN_VUELO.set(clave, p);
  return p;
}

async function carpetaSub(r, sub){
  r.driveSubs = r.driveSubs || {};
  if(r.driveSubs[sub]) return r.driveSubs[sub];
  return unaVez(`${r.id}|${sub}`, async()=>{
    if(r.driveSubs[sub]) return r.driveSubs[sub];
    const padreId = await carpetaArriendo(r);
    const { carpetaId } = await api("/carpeta", { ruta:[sub], padreId });
    r.driveSubs[sub] = carpetaId;
    if(S.r && S.r.id===r.id){ S.r.driveSubs = S.r.driveSubs||{}; S.r.driveSubs[sub]=carpetaId; }
    return carpetaId;
  });
}
const linkCarpeta = id => id ? `https://drive.google.com/drive/folders/${id}` : "";

/* ── Videos subidos con la app de Drive ────────────────────────────────
   Safari congela el JavaScript al salir de la pestaña, así que una página web
   no puede subir en segundo plano. La app de Drive sí. Cada tema tiene su
   propia carpeta: lo que esté adentro es ese video, sin tener que asignarlo. */
const SLOTS_VIDEO = [
  {k:"v_ext", t:"Exterior y bajo", carpeta:"1 Exterior y bajo", archivo:"1-exterior-y-bajo"},
  {k:"v_int", t:"Interior",        carpeta:"2 Interior",        archivo:"2-interior"},
  {k:"v_tec", t:"Techo",           carpeta:"3 Techo",           archivo:"3-techo"},
];

/* La clave interna se mantiene fija; el nombre visible lleva la referencia del
   arriendo para que el operario confirme en Drive que está en el lugar correcto. */
const limpio = t => String(t||"").replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim();
const nombreSubcarpeta = (r,def) =>
  `${def.carpeta} · ${limpio(r.patente)||"sin patente"} · ${limpio(r.cliente)||"sin cliente"}`;

async function carpetaVideo(r, slotKey){
  const def = SLOTS_VIDEO.find(x=>x.k===slotKey);
  const clave = "Videos/"+def.carpeta;
  r.driveSubs = r.driveSubs || {};
  if(r.driveSubs[clave]) return r.driveSubs[clave];
  const padreId = await carpetaSub(r, "Videos");
  const { carpetaId } = await api("/carpeta", { ruta:[nombreSubcarpeta(r,def)], padreId });
  r.driveSubs[clave] = carpetaId;
  if(S.r && S.r.id===r.id){ S.r.driveSubs = S.r.driveSubs||{}; S.r.driveSubs[clave]=carpetaId; }
  await guardaFicha();
  return carpetaId;
}

/* Lee las carpetas de video, deja el nombre ordenado y avisa qué encontró.
   No filtra por tipo: cada carpeta es exclusiva de ese video, así que lo que
   esté adentro cuenta. iOS a veces reporta los .MOV como tipo genérico. */
async function revisaVideosDrive(silencioso){
  const r=S.r; if(!r || !hayDrive()) return;
  if(S.revisando) return;
  S.revisando=true; if(!silencioso) pinta(true);
  let total=0, nuevos=0, sueltos=0, fallo="";
  r.driveVids = r.driveVids || {};
  try{
    const subs = r.driveSubs||{};
    const noCarpeta = f => f.mimeType !== "application/vnd.google-apps.folder";
    const consultas = SLOTS_VIDEO.map(def=>{
      const id = subs["Videos/"+def.carpeta];
      return id ? api("/listar?carpetaId="+encodeURIComponent(id)).then(d=>({def, d}))
                : Promise.resolve(null);
    });
    if(subs.Videos) consultas.push(
      api("/listar?carpetaId="+encodeURIComponent(subs.Videos))
        .then(d=>{ sueltos = (d.files||[]).filter(noCarpeta).length; return null; }));

    const res = await Promise.all(consultas);
    const renombres = [];
    for(const x of res){
      if(!x) continue;
      const { def, d } = x;
      const archivos = (d.files||[]).filter(noCarpeta)
        .map(f=>({ id:f.id, nombre:f.name, mb:Math.round(Number(f.size||0)/1048576) }));
      const antes = (r.driveVids[def.k]||[]).length;
      r.driveVids[def.k] = archivos;
      total += archivos.length;
      nuevos += Math.max(0, archivos.length - antes);
      archivos.forEach((a,i)=>{
        const esperado = `${def.archivo}${i?"-"+(i+1):""}.${EXT(a.nombre)}`;
        if(a.nombre !== esperado)
          renombres.push(api("/renombrar",{fileId:a.id,nombre:esperado})
            .then(()=>{ a.nombre = esperado; }).catch(()=>{}));
      });
    }
    await Promise.all(renombres);
    r.revisado = Date.now();
    await guardaFicha(true);
  }catch(e){ fallo = corta(e.message||e); }
  S.revisando=false; pinta(true);
  if(fallo) flash("No se pudo revisar: "+fallo);
  else if(sueltos) flash(`${sueltos} archivo(s) están en la carpeta Videos, no en la del tema`);
  else if(!silencioso) flash(total ? `${total} video(s) confirmados` : "Las carpetas están vacías");
  else if(nuevos) flash(nuevos===1 ? "Video confirmado en Drive" : `${nuevos} videos confirmados`);
}
const videosDe = (r,slot) => (r.driveVids||{})[slot] || [];

/* Drive sube en segundo plano, así que la app va confirmando sola cada 20
   segundos mientras el operario sigue llenando el checklist. */
let RELOJ = null;
function vigilaVideos(){
  clearInterval(RELOJ); RELOJ = null;
  if(!(S.vista==="ficha" && S.etapa==="entrega" && hayDrive() && S.r)) return;
  if(cuentaVideos(S.r) >= SLOTS_VIDEO.length) return;
  RELOJ = setInterval(()=>{
    if(!(S.vista==="ficha" && S.etapa==="entrega" && S.r)){ clearInterval(RELOJ); RELOJ=null; return; }
    if(cuentaVideos(S.r) >= SLOTS_VIDEO.length){ clearInterval(RELOJ); RELOJ=null; return; }
    if(!navigator.onLine || S.revisando || document.hidden) return;
    const f = document.activeElement;
    if(f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName||"")) return;   // alguien está escribiendo
    revisaVideosDrive(true);
  }, 20000);
}

/* Las carpetas se crean al entrar a la etapa: Safari bloquea abrir una ventana
   si entremedio hubo una espera, así que el botón tiene que ser un enlace listo. */
let PREPARANDO = false;
let RENOMBRANDO = false;
async function renombraCarpeta(r){
  if(RENOMBRANDO || !hayDrive() || !r.driveCarpeta) return;
  const nuevo = nombreCarpeta(r);
  if(r.driveNombre === nuevo) return;
  RENOMBRANDO = true;
  try{
    const tareas = [ api("/renombrar", { fileId:r.driveCarpeta, nombre:nuevo }) ];
    for(const def of SLOTS_VIDEO){
      const id = (r.driveSubs||{})["Videos/"+def.carpeta];
      if(id) tareas.push(api("/renombrar", { fileId:id, nombre:nombreSubcarpeta(r,def) }));
    }
    await Promise.all(tareas);
    r.driveNombre = nuevo;
    await guardaFicha(true);
    flash("Carpetas de Drive actualizadas");
  }catch(e){ /* se reintenta en el próximo guardado */ }
  finally{ RENOMBRANDO = false; }
}

const datosListos = r => !!(r && r.patente && (r.cliente||"").trim() && (r.ft || r.fi));

async function alistaVideos(){
  const r=S.r;
  if(!r || !hayDrive() || PREPARANDO) return;
  if(!datosListos(r)) return;
  const faltan = SLOTS_VIDEO.filter(def=>!(r.driveSubs||{})["Videos/"+def.carpeta]);
  if(!faltan.length) return;
  PREPARANDO = true;
  try{
    await carpetaSub(r, "Videos");                       // el padre primero
    await Promise.all(faltan.map(def=>carpetaVideo(r, def.k)));
    await guardaFicha(true);
    if(S.vista==="ficha" && S.etapa==="entrega") pinta(true);
  }catch(e){
    if(S.etapa==="entrega") flash("No se pudieron crear las carpetas: "+corta(e.message));
  }finally{ PREPARANDO=false; }
}

const pendientes = ()=> COLA.length;
function pintaSubidas(){
  document.querySelectorAll("[data-ver]").forEach(b=>{
    const m = buscaMedia(b.dataset.ver); if(!m) return;
    b.dataset.estado = m.estado || (m.driveId ? "listo" : "");
    const barra = b.querySelector(".pb");
    if(barra) barra.style.width = (m.pct||0) + "%";
  });
  pintaPie();
}
function buscaMedia(id){
  const r=S.r; if(!r) return null;
  for(const k of Object.keys(r.media||{})){ const m=(r.media[k]||[]).find(x=>x.id===id); if(m) return m; }
  for(const d of r.danos||[]){ const m=(d.fotos||[]).find(x=>x.id===id); if(m) return m; }
  return null;
}



/* ══════════ ARRIENDOS COMPARTIDOS ══════════
   El índice vive en un archivo en Drive y cada ficha guarda su copia
   completa en su propia carpeta. Así cualquier dispositivo ve los mismos
   arriendos, y el teléfono solo descarga la ficha que va a abrir. */

let SYNC = { subiendo:false, ultimo:0, pendientes:new Set(), error:"" };

async function carpetaEstado(){
  if(CFG.estadoId) return CFG.estadoId;
  return unaVez("estado", async()=>{
    if(CFG.estadoId) return CFG.estadoId;
    const raizId = await carpetaRaiz();
    const { carpetaId } = await api("/carpeta", { ruta:["_Flota"], padreId:raizId });
    CFG.estadoId = carpetaId; await guardaCfg();
    return carpetaId;
  });
}

/* Índice: lo mínimo para dibujar la lista sin descargar cada ficha */
function resumenDe(r){
  const [n,t] = progTotal(r);
  return { id:r.id, suc:r.suc, patente:r.patente, cliente:r.cliente, fi:r.fi, ft:r.ft,
           estado:r.estado, act:r.act||Date.now(), pct:Math.round(n/t*100),
           mes:mesDe(r), carpeta:nombreCarpeta(r), fase:faseDe(r).k,
           driveCarpeta:r.driveCarpeta||"",
           /* nombre REAL de la carpeta en Drive, que puede ir atrasado respecto
              de "carpeta" si el renombrado aún no se completó. Sin esto, otro
              dispositivo busca un nombre que todavía no existe. */
           driveNombre:r.driveNombre||"" };
}

function fusionaIndice(local, remoto){
  if(!remoto) return { lista:local.slice(), borradas:(S.borradas||[]) };
  const borradas = {};
  for(const b of [...(remoto.borradas||[]), ...(S.borradas||[])])
    if(!borradas[b.id] || b.t > borradas[b.id].t) borradas[b.id] = b;

  const mapa = new Map();
  for(const f of [...(remoto.lista||[]), ...local]){
    const prev = mapa.get(f.id);
    if(!prev || (f.act||0) >= (prev.act||0)) mapa.set(f.id, f);
  }
  for(const id of Object.keys(borradas)){
    const f = mapa.get(id);
    if(f && (f.act||0) <= borradas[id].t) mapa.delete(id);
  }
  return { lista:[...mapa.values()].sort((a,b)=>(b.act||0)-(a.act||0)),
           borradas:Object.values(borradas).filter(b=>b.t > Date.now()-180*86400000) };
}

/* El Worker nuevo expone /indice, que resuelve la carpeta en el servidor para
   que todos los dispositivos lean el mismo archivo. Si el Worker todavía no
   está actualizado, se usa el camino antiguo en vez de dejar de funcionar.
   WORKER_VIEJO se recuerda para no reintentar /indice en cada llamada. */
let WORKER_VIEJO = false;
const esRutaFaltante = e => /ruta no encontrada|HTTP 404/i.test(String(e&&e.message||e));

async function leeIndice(){
  if(!WORKER_VIEJO){
    try{ return await api("/indice"); }
    catch(e){ if(!esRutaFaltante(e)) throw e; WORKER_VIEJO = true; }
  }
  const carpetaId = await carpetaEstado();
  return await api(`/json?carpetaId=${encodeURIComponent(carpetaId)}&nombre=indice.json`);
}
async function escribeIndice(contenido){
  if(!WORKER_VIEJO){
    try{ return await api("/indice", { contenido }); }
    catch(e){ if(!esRutaFaltante(e)) throw e; WORKER_VIEJO = true; }
  }
  const carpetaId = await carpetaEstado();
  return await api("/json", { carpetaId, nombre:"indice.json", contenido });
}

async function bajaArriendosDrive(silencioso){
  if(!hayDrive() || !navigator.onLine) return;
  try{
    const d = await leeIndice();
    const antes = S.indice.length;
    const r = fusionaIndice(S.indice, d && d.contenido);
    S.indice = r.lista; S.borradas = r.borradas;
    await guardaIndice();
    SYNC.ultimo = Date.now(); SYNC.error = "";
    /* Si en Drive todavía no hay índice y aquí sí hay arriendos, este
       dispositivo es el que tiene los datos: hay que subirlos, no callar. */
    if(!(d && d.contenido) && S.indice.length)
      S.indice.forEach(f=>SYNC.pendientes.add(f.id));
    if(SYNC.pendientes.size) subeArriendos();
    const nuevos = S.indice.length - antes;
    if(!silencioso) flash(nuevos>0 ? `${nuevos} arriendo(s) nuevo(s)`
      : (d && d.contenido) ? "Al día" : "En Drive no hay índice todavía · subiendo lo de aquí");
    if(S.vista==="inicio"||S.vista==="archivo") pinta(true);
  }catch(e){
    SYNC.error = corta(e.message||e);
    if(!silencioso) flash("No se pudo sincronizar: "+SYNC.error);
  }
}

/* Si ya hay una subida en vuelo, esta llamada la ESPERA en vez de darse por
   fallida. Antes devolvía false sin error y el botón Guardar informaba
   "no subió" cuando en realidad la subida estaba en curso. */
let SUBIDA_EN_VUELO = null;
async function subeArriendos(){
  if(!hayDrive() || !navigator.onLine) return false;
  if(SUBIDA_EN_VUELO){
    try{ await SUBIDA_EN_VUELO; }catch(e){}
    if(!SYNC.pendientes.size) return !SYNC.error;   // la otra subida se llevó todo
  }
  if(SYNC.subiendo) return false;
  SUBIDA_EN_VUELO = subeArriendosSegunDestino();
  try{ return await SUBIDA_EN_VUELO; }
  finally{ SUBIDA_EN_VUELO = null; }
}
async function subeArriendosDrive(){
  SYNC.subiendo = true;
  const subidos = [];          // no se descuentan hasta que el índice quede escrito
  try{
    const d = await leeIndice();               // la carpeta la resuelve el servidor
    const remoto = new Map(((d&&d.contenido&&d.contenido.lista)||[]).map(f=>[f.id,f]));

    for(const id of [...SYNC.pendientes]){
      const raw = await St.get("r:"+id);
      if(!raw){ subidos.push(id); continue; }
      const r = JSON.parse(raw);
      if(!r.patente && !r.cliente){ subidos.push(id); continue; }

      /* Alguien más guardó esta misma ficha después de que la abrimos:
         no se pisa en silencio, se avisa y se deja decidir. */
      const suyo = remoto.get(id);
      if(suyo && S.r && S.r.id===id && S.baseAct && suyo.act > S.baseAct && suyo.act > (r.act||0)){
        subidos.push(id);
        avisaChoque(id, suyo);
        continue;
      }
      const carpFicha = await carpetaSub(r, "Ficha");
      await api("/json", { carpetaId:carpFicha, nombre:"ficha.json", contenido:r });
      subidos.push(id);
    }

    const m = fusionaIndice(S.indice, d && d.contenido);
    S.indice = m.lista; S.borradas = m.borradas;

    /* El índice es lo que el otro dispositivo lee: si esto falla, nada se dio
       por subido. Antes se descontaba la ficha aquí arriba y el aviso quedaba
       en verde con el índice sin escribir. */
    await escribeIndice({ v:1, act:Date.now(), lista:S.indice, borradas:S.borradas });

    subidos.forEach(id=>SYNC.pendientes.delete(id));
    await guardaIndice();
    SYNC.ultimo = Date.now(); SYNC.error = "";
    return true;
  }catch(e){
    SYNC.error = corta(e.message||e);          // las fichas siguen pendientes y se reintentan
    return false;
  }
  finally{ SYNC.subiendo = false; }
}

/* Si algo queda sin subir, se reintenta solo hasta lograrlo. Sin esto,
   una falla pasajera dejaba el arriendo solo en el teléfono sin avisar. */
let REINTENTO = null;
function vigilaRespaldo(){
  clearInterval(REINTENTO);
  REINTENTO = setInterval(()=>{
    if(document.hidden) return;
    if(!navigator.onLine || !hayDrive()) return;
    if(SYNC.pendientes.size && !SYNC.subiendo) subeArriendos();
    if(FLOTA_SYNC.sucio && !FLOTA_SYNC.subiendo) subeFlota();
    /* Buscar lo que hicieron los otros. El intervalo era de 90 s porque cada
       consulta eran varias idas y vueltas a Google Drive; con la base de datos
       es UNA consulta con índice que no devuelve nada cuando no hay cambios,
       así que no hay razón para hacer esperar a nadie dos minutos. */
    if(!SYNC.subiendo && !SYNC.pendientes.size) sincronizaAhora();
    if(S.vista==="inicio" && document.querySelector(".estado-sync")) pinta(true);
    if(S.vista==="ficha" && S.r) pintaPie();   // el pie muestra si falta subir
  }, 10000);
}

/* Una sola llamada trae arriendos, vehículos y tareas. Antes se llamaba a
   las dos y, con la base conectada, eso consultaba lo mismo dos veces. */
async function sincronizaAhora(silencioso){
  const ok = await bajaArriendos(silencioso===undefined ? true : silencioso);
  if(!(await hayBase())) await bajaFlotaDrive(true);   // sin base, la flota va aparte
  return ok;
}

/* Dos personas en la misma ficha a la vez. Poco probable con este volumen,
   pero si pasa conviene que se note en vez de perder trabajo en silencio. */
let CHOQUE_AVISADO = 0;
function avisaChoque(id, suyo){
  if(Date.now() - CHOQUE_AVISADO < 60000) return;
  CHOQUE_AVISADO = Date.now();
  modal(`<h3>Alguien más editó este arriendo</h3>
    <p style="margin:0 0 10px">Se guardó una versión desde otro dispositivo mientras tenías esta abierta.
    Para no perder ninguno de los dos trabajos, tus cambios no se subieron todavía.</p>
    <div class="aviso" style="margin:0 0 12px"><b>${esc(suyo.carpeta||"")}</b><br>
      Guardado a las ${new Date(suyo.act).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}
      desde otro dispositivo.</div>
    <div class="row">
      <button class="btn acento" data-act="ganarYo" style="flex:1">Subir lo mío igual</button>
      <button class="btn ghost" data-act="traerSuyo" style="flex:1">Traer lo del otro</button>
    </div>`);
}

/* La subida se agrupa 1,5 s para no llamar a Drive en cada tecla, pero con
   techo: si alguien edita sin pausas, igual se sube a los 8 s. Antes el
   temporizador se reiniciaba con cada cambio y podía postergarse sin fin. */
function marcaParaSubir(id){
  if(!id) return;
  SYNC.pendientes.add(id);
  if(!marcaParaSubir._desde) marcaParaSubir._desde = Date.now();
  if(Date.now() - marcaParaSubir._desde > 8000){
    clearTimeout(marcaParaSubir._t);
    marcaParaSubir._desde = 0;
    subeArriendos();
    return;
  }
  clearTimeout(marcaParaSubir._t);
  marcaParaSubir._t = setTimeout(()=>{ marcaParaSubir._desde = 0; subeArriendos(); }, 1500);
}

/* Guardado explícito: guarda aquí y sube a Drive de inmediato, sin esperar
   ningún temporizador, y devuelve lo que realmente pasó. Es lo que usan el
   botón Guardar, Guardar y salir, y el cierre o minimizado de la app.
   Nunca decimos "guardado" a secas cuando solo quedó en el dispositivo. */
async function guardaYSube(){
  if(!S.r) return { local:false, drive:false, motivo:"sin ficha" };
  /* No archivar una ficha vacía: antes bastaba guardar para crear un
     arriendo fantasma que aparecía en los otros dispositivos. */
  if(!S.indice.some(x=>x.id===S.r.id) && !tieneContenido(S.r))
    return { local:false, drive:false, motivo:"vacía" };
  S.r.ultimaEtapa = S.etapa;
  clearTimeout(marcaParaSubir._t);
  marcaParaSubir._desde = 0;
  await guardaFicha(true);
  clearTimeout(marcaParaSubir._t);          // guardaFicha reprogramó el temporizador
  const local = S.indice.some(x=>x.id===S.r.id);
  if(!hayDrive())        return { local, drive:false, motivo:"sin Drive" };
  if(!navigator.onLine)  return { local, drive:false, motivo:"sin conexión" };
  /* Guardar es una orden, no una propuesta: si otra persona guardó mientras
     tanto, se funde con lo suyo y se reintenta en vez de rechazarlo. */
  BD.forzar = true;
  let ok;
  try{ ok = await subeArriendos(); }
  finally{ BD.forzar = false; }
  if(S.r && BD.choques.has(S.r.id))
    return { local, drive:false, motivo:"choque" };
  return { local, drive:!!ok, motivo: ok ? "" : (SYNC.error || "falló la subida") };
}

/* El texto que corresponde al resultado de guardaYSube */
function avisoGuardado(res, alSalir){
  if(!res.local) return "No había nada que guardar";
  if(res.drive)  return alSalir ? "Guardado y sincronizado" : "Sincronizado";
  if(res.motivo==="choque") return "Otra persona guardó esta ficha · elige qué versión conservar";
  if(res.motivo==="sin conexión") return "Guardado aquí · se sube solo al volver la conexión";
  if(res.motivo==="sin Drive")    return "Guardado solo en este dispositivo";
  return "Guardado aquí · aún no se sincroniza: "+res.motivo;
}

/* Al abrir una ficha que este dispositivo no tiene, se baja de su carpeta */
async function traeFicha(id){
  const res = S.indice.find(x=>x.id===id);
  if(!res || !hayDrive() || !navigator.onLine) return null;
  try{
    flash("Trayendo la ficha…", true);
    /* Varias formas de ubicar la carpeta, de la más directa a la más tolerante.
       El nombre de la carpeta incluye el cliente, así que cambia cuando alguien
       corrige el nombre: no se puede depender de que calce exacto. El prefijo
       fecha_PATENTE sí es estable, y la ficha se verifica por id, de modo que
       un candidato equivocado se descarta en vez de devolver datos ajenos. */
    const intenta = async padre => {
      if(!padre) return null;
      const { carpetaId } = await api("/carpeta", { ruta:["Ficha"], padreId:padre });
      const d = await api(`/json?carpetaId=${encodeURIComponent(carpetaId)}&nombre=ficha.json`);
      if(!(d && d.contenido && d.contenido.id === id)) return null;   // candidato ajeno
      d.contenido.driveCarpeta = padre;
      await St.set("r:"+id, JSON.stringify(d.contenido));
      const i = S.indice.findIndex(x=>x.id===id);
      if(i>=0){ S.indice[i].driveCarpeta = padre; await guardaIndice(); }
      return d.contenido;
    };
    /* 1) la carpeta anotada en el índice: el camino normal, una sola llamada */
    const directo = await intenta(res.driveCarpeta);
    if(directo) return directo;
    /* 2) por nombre. El nombre lleva el cliente, así que cambia cuando alguien
          lo corrige y puede no calzar; el prefijo fecha_PATENTE_ sí es estable. */
    const raizId = await carpetaRaiz();
    const files = (await api("/listar?carpetaId="+encodeURIComponent(raizId))).files || [];
    const cand = [];
    for(const n of [res.driveNombre, res.carpeta])
      if(n) for(const f of files) if(f.name === n) cand.push(f.id);
    const partes = String(res.carpeta||"").split("_");
    if(partes.length >= 2){
      const pref = partes[0]+"_"+partes[1]+"_";
      for(const f of files) if(f.name.startsWith(pref)) cand.push(f.id);
    }
    for(const padre of [...new Set(cand)].slice(0,6)){
      const hallada = await intenta(padre);
      if(hallada) return hallada;
    }
  }catch(e){}
  return null;
}
